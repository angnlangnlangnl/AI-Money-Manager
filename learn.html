<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>学习专区 - 现货交易 - AI 金融助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
            overflow-y: auto;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        .tap-active:active {
            transform: scale(0.96);
            opacity: 0.7;
        }

        .spot-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .back-btn {
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s;
            color: #8a8a9a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            font-size: 0;
            text-decoration: none;
        }
        .back-btn:active {
            background: #1a1a2a;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #8a8a9a;
            fill: none;
            stroke-width: 2;
        }
        .help-btn {
            background: transparent;
            border: none;
            color: #60a5fa;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
            text-decoration: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .help-btn:hover {
            color: #93c5fd;
        }
        .help-btn:active {
            color: #3b82f6;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 14px 20px;
        }
        .page-header .title {
            font-size: 18px;
            font-weight: 700;
            color: #60a5fa;
        }
        .page-header .current-price-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .page-header .current-price-info .price {
            font-size: 24px;
            font-weight: 700;
            color: #e8e8f0;
        }
        .page-header .current-price-info .change {
            font-size: 14px;
            font-weight: 600;
        }

        .symbol-bar {
            display: flex;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid #1a1a2a;
            padding: 12px 0 8px 0;
            margin-bottom: 12px;
            position: relative;
        }
        .symbol-list {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 #1a1a2a;
            flex: 1;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .symbol-list::-webkit-scrollbar {
            height: 4px;
        }
        .symbol-list::-webkit-scrollbar-thumb {
            background-color: #3b82f6;
            border-radius: 2px;
        }
        .symbol-list::-webkit-scrollbar-track {
            background: #1a1a2a;
        }
        .symbol-item {
            color: #6a6a7a;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
            white-space: nowrap;
            flex-shrink: 0;
            padding: 4px 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .symbol-item:hover {
            color: #9ca3af;
        }
        .symbol-item.active {
            color: #3b82f6;
        }
        .add-pair-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #3b82f6;
            color: #3b82f6;
            background: transparent;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 300;
            margin-left: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .add-pair-btn:active {
            background-color: #3b82f6;
            color: #0a0a0f;
        }

        .chart-container {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            min-height: 320px;
            position: relative;
        }
        .chart-container .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .chart-container .chart-header .chart-title {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
        }
        .chart-container .chart-header .chart-pair {
            color: #6a6a7a;
            font-size: 14px;
            font-weight: 500;
            background: #1a1a2a;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
        }
        .chart-type-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .chart-type-tabs::-webkit-scrollbar {
            display: none;
        }
        .chart-type-tab {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #1a1a2a;
            background: #12121f;
            color: #6a6a7a;
            touch-action: manipulation;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .chart-type-tab.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }
        .chart-wrapper {
            position: relative;
            height: 220px;
        }
        .chart-wrapper canvas {
            width: 100% !important;
            height: 220px !important;
        }
        .chart-time-labels {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 8px;
            padding-right: 4px;
            flex-wrap: nowrap;
        }
        .chart-time-labels .time-label {
            font-size: 11px;
            color: #5a5a6a;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 12px;
            transition: all 0.2s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .chart-time-labels .time-label:hover {
            color: #8a8a9a;
            border-color: #2a2a3a;
        }
        .chart-time-labels .time-label.active {
            color: #3b82f6;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
        }

        .account-card {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .account-card .card-title {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #1a1a2a;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .account-card .account-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            min-height: 24px;
            gap: 12px;
        }
        .account-card .account-row .label {
            font-size: 13px;
            color: #6a6a7a;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .account-card .account-row .value {
            font-size: 15px;
            font-weight: 600;
            color: #e8e8f0;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
        }
        .account-card .account-row .value.btc {
            color: #fbbf24;
        }
        .account-card .account-row .value.green {
            color: #10b981;
        }
        .account-card .account-row .value.red {
            color: #ef4444;
        }
        .account-card .divider {
            border-top: 1px solid #1a1a2a;
            margin: 12px 0;
        }

        .amount-input-section {
            margin-bottom: 12px;
        }
        .amount-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 10px;
            padding: 10px 12px;
        }
        .amount-input-row:focus-within {
            border-color: #3b82f6;
        }
        .amount-input-row .amount-label {
            font-size: 12px;
            color: #6a6a7a;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .amount-input-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e8e8f0;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            text-align: right;
            min-width: 0;
        }
        .amount-input-row input::placeholder {
            color: #5a5a6a;
            font-weight: 400;
        }
        .amount-input-row .amount-usdt {
            font-size: 12px;
            color: #6a6a7a;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .amount-quick-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .amount-quick-btns::-webkit-scrollbar {
            display: none;
        }
        .amount-quick-btn {
            flex: 0 0 auto;
            padding: 6px 12px;
            border: 1px solid #1a1a2a;
            border-radius: 6px;
            background: #12121f;
            color: #8a8a9a;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            min-width: 50px;
        }
        .amount-quick-btn:active {
            background: #1a1a2a;
            color: #e8e8f0;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }
        .button-group .btn {
            flex: 1;
            text-align: center;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            color: white;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .button-group .btn:active {
            opacity: 0.85;
        }
        .button-group .btn-buy {
            background: #10b981;
        }
        .button-group .btn-sell {
            background: #ef4444;
        }
        .account-card .current-price {
            margin-top: 10px;
            font-size: 13px;
            color: #6a6a7a;
        }

        .tp-sl-section {
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
        }
        .tp-sl-title {
            font-size: 12px;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 10px;
        }
        .tp-sl-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .tp-sl-row:last-child {
            margin-bottom: 0;
        }
        .tp-sl-label {
            font-size: 11px;
            color: #6a6a7a;
            min-width: 50px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tp-sl-input {
            flex: 1;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            color: #e8e8f0;
            outline: none;
            min-width: 0;
        }
        .tp-sl-input:focus {
            border-color: #3b82f6;
        }
        .tp-sl-btn-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }
        .tp-sl-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tp-sl-btn:active {
            background: #2563eb;
        }
        .tp-sl-status {
            font-size: 13px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            font-weight: 500;
        }
        .tp-sl-status.active {
            color: #10b981;
            font-weight: 600;
        }

        .orders-card {
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 20px;
        }
        .orders-card .section-title {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            padding: 0 4px;
        }
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .order-card {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s ease;
            width: 100%;
            overflow: hidden;
        }
        .order-card.active {
            border-color: #3b82f6;
        }
        .order-card.closed {
            border-color: #2a2a3a;
            opacity: 0.8;
        }
        .order-card.cancelled {
            border-color: #3a1a1a;
            opacity: 0.6;
        }
        
        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 8px;
            border-bottom: 1px solid #1a1a2a;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .order-card-header .order-pair {
            font-size: 13px;
            font-weight: 700;
            color: #e8e8f0;
            white-space: nowrap;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        .order-card-header .order-badges {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .order-card-header .order-type-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .order-card-header .order-type-badge.buy {
            background: #1a3a2a;
            color: #10b981;
        }
        .order-card-header .order-type-badge.sell {
            background: #3a1a1a;
            color: #ef4444;
        }
        .order-card-header .order-status-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .order-card-header .order-status-badge.active {
            background: #1a2a3a;
            color: #60a5fa;
        }
        .order-card-header .order-status-badge.closed {
            background: #1a1a2a;
            color: #8a8a9a;
        }
        .order-card-header .order-status-badge.cancelled {
            background: #3a1a1a;
            color: #ef4444;
        }
        
        .order-card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .order-info-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            min-width: 0;
            overflow: hidden;
            padding: 4px 0;
        }
        .order-info-item .info-label {
            font-size: 10px;
            color: #6a6a7a;
            white-space: nowrap;
        }
        .order-info-item .info-value {
            font-size: 12px;
            font-weight: 600;
            color: #e8e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }
        .order-info-item .info-value.profit {
            color: #10b981;
        }
        .order-info-item .info-value.loss {
            color: #ef4444;
        }
        .order-info-item.full-width {
            grid-column: 1 / -1;
        }
        
        .order-card-footer {
            display: flex;
            gap: 8px;
        }
        .order-action-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .order-action-btn:active {
            opacity: 0.7;
        }
        .btn-cancel-order {
            background: #3a1a1a;
            color: #ef4444;
        }
        .btn-close-order {
            background: #1a2a3a;
            color: #60a5fa;
        }
        .btn-cancel-order:disabled,
        .btn-close-order:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .no-orders {
            text-align: center;
            padding: 30px;
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            color: #5a5a6a;
            font-size: 13px;
        }

        .pair-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .pair-modal-overlay.show {
            display: flex;
        }
        .pair-modal {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 16px;
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }
        .pair-modal .modal-title {
            color: #60a5fa;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }
        .pair-modal .search-input {
            width: 100%;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            color: #e8e8f0;
            outline: none;
            margin-bottom: 12px;
        }
        .pair-modal .search-input:focus {
            border-color: #3b82f6;
        }
        .pair-modal .search-input::placeholder {
            color: #5a5a6a;
        }
        .pair-modal .pair-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
            flex: 1;
        }
        .pair-modal .pair-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .pair-modal .pair-option:active {
            background: #1a1a2a;
        }
        .pair-modal .pair-option.selected {
            background: #1a2a3a;
            border: 1px solid #3b82f6;
        }
        .pair-modal .pair-option .pair-name {
            font-size: 13px;
            font-weight: 600;
            color: #e8e8f0;
            white-space: nowrap;
        }
        .pair-modal .pair-option .pair-price {
            font-size: 11px;
            color: #6a6a7a;
            white-space: nowrap;
        }
        .pair-modal .pair-option .check-icon {
            color: #3b82f6;
            font-size: 14px;
            font-weight: 700;
        }
        .pair-modal .no-results {
            text-align: center;
            padding: 15px;
            color: #5a5a6a;
            font-size: 12px;
        }
        .add-pair-section {
            border-top: 1px solid #1a1a2a;
            padding-top: 12px;
        }
        .add-pair-row {
            display: flex;
            gap: 8px;
        }
        .add-pair-row input {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: #e8e8f0;
            outline: none;
            min-width: 0;
        }
        .add-pair-row input:focus {
            border-color: #3b82f6;
        }
        .add-pair-row input::placeholder {
            color: #5a5a6a;
        }
        .add-pair-modal-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .add-pair-modal-btn:active {
            background: #2563eb;
        }
        .pair-modal .save-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;

    <script>
        // ============================================================
        //  现货交易核心逻辑
        // ============================================================
        
        let spotUsdtBalance = 10000;
        let spotBtcBalance = 0;
        let spotBtcPrice = 65432.10;
        let spotCurrentSymbol = 'BTC/USDT';
        let spotCurrentPeriod = '1h';
        let spotChartType = 'line';
        let spotChart = null;
        let spotChartData = [];
        let spotPriceHistory = [];
        let spotOrders = [];
        let spotOrdersInitialized = false;
        
        let takeProfitPrice = null;
        let stopLossPrice = null;
        let tpSlActive = false;
        let tpSlCheckInterval = null;
        
        let spotPairs = ['BTC/USDT', 'ETH/USDT', 'SOL/USDT', 'BNB/USDT', 'XRP/USDT', 'ADA/USDT', 'DOT/USDT', 'AVAX/USDT'];
        
        let spotPairData = {
            'BTC/USDT': { price: 65432.10, change: 3.21, base: 'USDT', asset: 'BTC' },

            'UNI/USDT': { price: 8.92, change: -0.78, base: 'USDT', asset: 'UNI' },
            'ATOM/USDT': { price: 9.87, change: 1.45, base: 'USDT', asset: 'ATOM' },
            'LTC/USDT': { price: 72.34, change: 0.56, base: 'USDT', asset: 'LTC' },
            'BCH/USDT': { price: 345.67, change: -1.89, base: 'USDT', asset: 'BCH' },
            'FIL/USDT': { price: 5.67, change: 3.45, base: 'USDT', asset: 'FIL' },
            'APT/USDT': { price: 12.34, change: 7.89, base: 'USDT', asset: 'APT' },
            'SUI/USDT': { price: 1.89, change: 4.56, base: 'USDT', asset: 'SUI' },
            'NEAR/USDT': { price: 5.67, change: -2.34, base: 'USDT', asset: 'NEAR' },
            'OP/USDT': { price: 2.34, change: 1.23, base: 'USDT', asset: 'OP' },
            'ARB/USDT': { price: 1.56, change: -0.89, base: 'USDT', asset: 'ARB' },
            'MATIC/USDT': { price: 0.78, change: 2.45, base: 'USDT', asset: 'MATIC' },
            'DOGE/USDT': { price: 0.156, change: 8.90, base: 'USDT', asset: 'DOGE' },
            'SHIB/USDT': { price: 0.0000234, change: 6.78, base: 'USDT', asset: 'SHIB' },
            'TRX/USDT': { price: 0.234, change: 1.56, base: 'USDT', asset: 'TRX' },
            'ETC/USDT': { price: 23.45, change: -1.23, base: 'USDT', asset: 'ETC' },
            'AAVE/USDT': { price: 156.78, change: 3.45, base: 'USDT', asset: 'AAVE' },
            'MKR/USDT': { price: 2345.67, change: -0.56, base: 'USDT', asset: 'MKR' },
            'COMP/USDT': { price: 56.78, change: 1.89, base: 'USDT', asset: 'COMP' },
            'CRV/USDT': { price: 0.567, change: -2.34, base: 'USDT', asset: 'CRV' },
            'SNX/USDT': { price: 3.45, change: 4.56, base: 'USDT', asset: 'SNX' },
            'YFI/USDT': { price: 6789.01, change: 0.89, base: 'USDT', asset: 'YFI' },
        };
        
        const periodDataPoints = {
            '1h': 24,
            '4h': 30,
            '1d': 30,
            '1m': 30
        };
        
        function openUnifiedPairModal() {
            document.getElementById('pairSearchInput').value = '';
            document.getElementById('newPairInput').value = '';
            renderUnifiedPairList('');
            document.getElementById('pairModalOverlay').classList.add('show');
        }
        
        function closeUnifiedPairModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('pairModalOverlay').classList.remove('show');
        }
        
        function renderUnifiedPairList(filter) {
            const container = document.getElementById('pairModalContent');
            const filterLower = filter.toLowerCase();
            const allPairs = Object.keys(spotPairData);
            const filteredPairs = allPairs.filter(pair => pair.toLowerCase().includes(filterLower));
            
            if (filteredPairs.length === 0) {
                container.innerHTML = '<div class="no-results">未找到匹配的交易对</div>';
                return;
            }
            
            let html = '';
            filteredPairs.forEach(pair => {
                const isSelected = spotPairs.includes(pair);
                const price = spotPairData[pair]?.price || 0;
                html += `
                    <div class="pair-option ${isSelected ? 'selected' : ''}" onclick="togglePairSelection('${pair}')">
                        <span class="pair-name">${pair}</span>
                        <span class="pair-price">$${price.toFixed(2)}</span>
                        <span class="check-icon">${isSelected ? '✓' : '+'}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function filterUnifiedPairList() {
            const filter = document.getElementById('pairSearchInput').value;
            renderUnifiedPairList(filter);
        }
        
        function togglePairSelection(pair) {
            if (spotPairs.includes(pair)) {
                if (spotPairs.length <= 1) {
                    alert('至少保留一个交易对');
                    return;
                }
                spotPairs = spotPairs.filter(p => p !== pair);
            } else {
                spotPairs.push(pair);
            }
            renderUnifiedPairList(document.getElementById('pairSearchInput').value);
        }
        
        function handleNewPairKeydown(event) {
            if (event.key === 'Enter') {
                addNewPairFromModal();
            }
        }
        
        function addNewPairFromModal() {
            const input = document.getElementById('newPairInput');
            const newPair = input.value.trim().toUpperCase();
            
            if (!newPair) {
                alert('请输入交易对名称');
                return;
            }
            
            if (!newPair.includes('/')) {
                alert('请输入正确格式，如: ATOM/USDT');
                return;
            }
            
            if (spotPairData[newPair]) {
                if (!spotPairs.includes(newPair)) {
                    spotPairs.push(newPair);
                    input.value = '';
                    renderUnifiedPairList(document.getElementById('pairSearchInput').value);
                    alert(`✅ 已添加交易对: ${newPair}`);
                } else {
                    alert('该交易对已在列表中');
                    input.value = '';
                }
                return;
            }
            
            const randomPrice = (Math.random() * 100 + 1).toFixed(2);
            const assetName = newPair.split('/')[0];
            spotPairData[newPair] = {
                price: parseFloat(randomPrice),
                change: (Math.random() * 10 - 5).toFixed(2),
                base: 'USDT',
                asset: assetName
            };
            
            spotPairs.push(newPair);
            input.value = '';
            renderUnifiedPairList(document.getElementById('pairSearchInput').value);
            
            alert(`✅ 已添加新交易对: ${newPair}\n价格: $${randomPrice}`);
        }
        
        function savePairSelection() {
            spotRenderSymbols();
            closeUnifiedPairModal();
            alert(`✅ 交易对列表已保存\n当前共 ${spotPairs.length} 个交易对`);
        }
        
        function setQuickAmount(value) {
            const input = document.getElementById('tradeAmountInput');
            if (value === 'max') {
                input.value = spotUsdtBalance.toFixed(2);
            } else {
                input.value = value;
            }
        }
        
        function getTradeAmount() {
            const input = document.getElementById('tradeAmountInput');
            const value = parseFloat(input.value);
            if (isNaN(value) || value <= 0) {
                alert('请输入有效的交易金额');
                return null;
            }
            return value;
        }
        
        function setTpSl() {
            const tpInput = document.getElementById('takeProfitInput');
            const slInput = document.getElementById('stopLossInput');
            
            const tpValue = parseFloat(tpInput.value);
            const slValue = parseFloat(slInput.value);
            
            if (isNaN(tpValue) && isNaN(slValue)) {
                alert('请至少输入止盈价或止损价');
                return;
            }
            
            if (!isNaN(tpValue) && tpValue <= spotBtcPrice) {
                alert('止盈价应高于当前价格');
                return;
            }
            
            if (!isNaN(slValue) && slValue >= spotBtcPrice) {
                alert('止损价应低于当前价格');
                return;
            }
            
            takeProfitPrice = !isNaN(tpValue) ? tpValue : null;
            stopLossPrice = !isNaN(slValue) ? slValue : null;
            tpSlActive = true;
            
            const statusEl = document.getElementById('tpSlStatus');
            if (statusEl) {
                let statusText = '✅ ';
                const parts = [];
                if (takeProfitPrice) parts.push(`止盈$${takeProfitPrice.toFixed(2)}`);
                if (stopLossPrice) parts.push(`止损$${stopLossPrice.toFixed(2)}`);
                statusText += parts.join(' | ');
                statusEl.textContent = statusText;
                statusEl.style.color = '#10b981';
            }
            
            if (tpSlCheckInterval) {
                clearInterval(tpSlCheckInterval);
            }
            
            tpSlCheckInterval = setInterval(checkTpSl, 2000);
            
            alert(`✅ 止盈止损已设置\n${takeProfitPrice ? '止盈: $' + takeProfitPrice.toFixed(2) : ''}\n${stopLossPrice ? '止损: $' + stopLossPrice.toFixed(2) : ''}`);
        }
        
        function checkTpSl() {
            if (!tpSlActive) return;
            
            if (takeProfitPrice && spotBtcPrice >= takeProfitPrice && spotBtcBalance > 0.001) {
                executeTpSl('take_profit');
            }
            
            if (stopLossPrice && spotBtcPrice <= stopLossPrice && spotBtcBalance > 0.001) {
                executeTpSl('stop_loss');
            }
        }
        
        function executeTpSl(type) {
            const assetSymbol = spotCurrentSymbol.split('/')[0];
            const sellQuantity = spotBtcBalance;
            const sellAmount = sellQuantity * spotBtcPrice;
            
            spotBtcBalance = 0;
            spotUsdtBalance += sellAmount;
            spotUpdateDisplay();
            
            takeProfitPrice = null;
            stopLossPrice = null;
            tpSlActive = false;
            
            if (tpSlCheckInterval) {
                clearInterval(tpSlCheckInterval);
                tpSlCheckInterval = null;
            }
            
            const statusEl = document.getElementById('tpSlStatus');
            if (statusEl) {
                statusEl.textContent = '已触发，止盈止损已清除';
                statusEl.style.color = '#6a6a7a';
            }
            
            const typeText = type === 'take_profit' ? '止盈' : '止损';
            alert(`🎯 ${typeText}触发！\n已卖出全部 ${sellQuantity.toFixed(6)} ${assetSymbol}\n价格: $${spotBtcPrice.toFixed(2)}\n金额: $${sellAmount.toFixed(2)}`);
            
            const order = {
                id: Date.now(),
                pair: spotCurrentSymbol,
                type: 'sell',
                asset: assetSymbol,
                quantity: sellQuantity,
                price: spotBtcPrice,
                amount: sellAmount,
                pnl: 0,
                status: 'closed',
                time: new Date().toLocaleString(),
                trigger: typeText
            };
            spotOrders.push(order);
            spotRenderOrders();
        }
        
        function spotRenderSymbols() {
            const container = document.getElementById('spotSymbolList');
            if (container) {
                let html = '';
                spotPairs.forEach((symbol, index) => {
                    const activeClass = index === 0 ? 'active' : '';
                    html += `<span class="symbol-item ${activeClass}" onclick="spotSelectSymbol(this, '${symbol}')">${symbol}</span>`;
                });
                container.innerHTML = html;
                if (spotPairs.length > 0) {
                    spotCurrentSymbol = spotPairs[0];
                }
            }
        }
        
        function spotSelectSymbol(el, symbol) {
            document.querySelectorAll('#spotSymbolList .symbol-item').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            spotCurrentSymbol = symbol;
            
            const data = spotPairData[symbol] || spotPairData['BTC/USDT'];
            spotBtcPrice = data.price;
            
            document.getElementById('spotCurrentPrice').textContent = '$' + data.price.toFixed(2);
            const changeEl = document.getElementById('spotPriceChange');
            if (changeEl) {
                changeEl.textContent = (data.change >= 0 ? '+' : '') + data.change.toFixed(2) + '%';
                changeEl.style.color = data.change >= 0 ? '#10b981' : '#ef4444';
            }
            
            document.getElementById('chartPairDisplay').textContent = symbol;
            document.getElementById('spotAssetLabel').textContent = data.asset + ' 持仓';
            document.getElementById('spotCurrentPriceDisplay').textContent = '$' + data.price.toFixed(2);
            
            spotGenerateChartData();
            spotUpdateDisplay();
        }
        
        function switchChartType(type, el) {
            spotChartType = type;
            document.querySelectorAll('.chart-type-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });
            spotGenerateChartData();
        }
        
        function spotSetTimePeriod(period, el) {
            spotCurrentPeriod = period;
            document.querySelectorAll('.chart-time-labels .time-label').forEach(label => {
                label.classList.remove('active');
            });
            if (el) el.classList.add('active');
            spotGenerateChartData();
        }
        
        function spotGenerateChartData() {
            const data = spotPairData[spotCurrentSymbol] || spotPairData['BTC/USDT'];
            const basePrice = data.price;
            const volatility = basePrice * 0.025;
            const numPoints = periodDataPoints[spotCurrentPeriod] || 24;
            
            spotChartData = [];
            spotPriceHistory = [];
            let current = basePrice * 0.97;
            for (let i = 0; i < numPoints; i++) {
                current += (Math.random() - 0.5) * volatility * 2;
                current = Math.max(basePrice * 0.85, Math.min(basePrice * 1.15, current));
                spotChartData.push(Math.round(current * 100) / 100);
                spotPriceHistory.push(Math.round(current * 100) / 100);
            }
            
            spotUpdateChart();
        }
        
        function spotUpdateChart() {
            const canvas = document.getElementById('spotPriceChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            if (spotChart) {
                spotChart.destroy();
            }
            
            if (spotChartType === 'line') {
                spotChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array(spotChartData.length).fill(''),
                        datasets: [{
                            label: spotCurrentSymbol,
                            data: spotChartData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59,130,246,0.1)',
                            fill: true,
                            tension: 0.2,
                            pointRadius: 0,
                            borderWidth: 2,
                        }]
                    },
                    options: getChartOptions()
                });
            } else if (spotChartType === 'candle') {
                const candleData = spotChartData.map((price, index) => {
                    const open = index > 0 ? spotChartData[index - 1] : price * 0.998;
                    const close = price;
                    const high = Math.max(open, close) * 1.002;
                    const low = Math.min(open, close) * 0.998;
                    return { open, close, high, low };
                });
                
                spotChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Array(candleData.length).fill(''),
                        datasets: [{
                            label: spotCurrentSymbol,
                            data: candleData.map(d => d.high - d.low),
                            backgroundColor: candleData.map(d => d.close >= d.open ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)'),
                            borderColor: candleData.map(d => d.close >= d.open ? '#10b981' : '#ef4444'),
                            borderWidth: 1,
                        }]
                    },
                    options: getChartOptions()
                });
            } else if (spotChartType === 'bar') {
                const barData = spotChartData.map((price, index) => {
                    return index > 0 ? price - spotChartData[index - 1] : 0;
                });
                
                spotChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Array(barData.length).fill(''),
                        datasets: [{
                            label: '涨跌',
                            data: barData,
                            backgroundColor: barData.map(v => v >= 0 ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)'),
                            borderColor: barData.map(v => v >= 0 ? '#10b981' : '#ef4444'),
                            borderWidth: 1,
                        }]
                    },
                    options: getChartOptions()
                });
            }
        }
        
        function getChartOptions() {
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                if (spotChartType === 'bar') {
                                    return (context.parsed.y >= 0 ? '+' : '') + context.parsed.y.toFixed(2);
                                }
                                return '$' + context.parsed.y.toFixed(2);
                            }
                        }
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        ticks: {
                            color: '#6a6a7a',
                            callback: function(value) { return '$' + value.toFixed(0); }
                        },
                        grid: { color: '#1a1a2a' }
                    }
                }
            };
        }
        
        function spotUpdateDisplay() {
            const total = spotUsdtBalance + spotBtcBalance * spotBtcPrice;
            const pnl = total - 10000;
            
            document.getElementById('spotCurrentPrice').textContent = '$' + spotBtcPrice.toFixed(2);
            document.getElementById('spotTotalBalance').textContent = '$' + total.toFixed(2);
            document.getElementById('spotUsdtBalance').textContent = spotUsdtBalance.toFixed(2);
            document.getElementById('spotBtcBalance').textContent = spotBtcBalance.toFixed(4);
            
            const pnlEl = document.getElementById('spotTotalPnl');
            if (pnlEl) {
                pnlEl.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
                pnlEl.className = 'value ' + (pnl >= 0 ? 'green' : 'red');
            }
            
            document.getElementById('spotCurrentPriceDisplay').textContent = '$' + spotBtcPrice.toFixed(2);
        }
        
        function spotBuy() {
            const assetSymbol = spotCurrentSymbol.split('/')[0];
            const tradeAmount = getTradeAmount();
            if (tradeAmount === null) return;
            
            if (tradeAmount > spotUsdtBalance) {
                alert('USDT 余额不足');
                return;
            }
            
            const quantity = tradeAmount / spotBtcPrice;
            if (quantity < 0.001) {
                alert('买入量太小');
                return;
            }
            
            spotBtcBalance += quantity;
            spotUsdtBalance -= tradeAmount;
            spotUpdateDisplay();
            
            const order = {
                id: Date.now(),
                pair: spotCurrentSymbol,
                type: 'buy',
                asset: assetSymbol,
                quantity: quantity,
                price: spotBtcPrice,
                amount: tradeAmount,
                pnl: 0,
                status: 'active',
                time: new Date().toLocaleString()
            };
            spotOrders.push(order);
            spotRenderOrders();
            
            document.getElementById('tradeAmountInput').value = '';
        }
        
        function spotSell() {
            const assetSymbol = spotCurrentSymbol.split('/')[0];
            const tradeAmount = getTradeAmount();
            if (tradeAmount === null) return;
            
            const sellQuantity = tradeAmount / spotBtcPrice;
            
            if (sellQuantity > spotBtcBalance) {
                alert(assetSymbol + ' 持仓不足');
                return;
            }
            
            spotBtcBalance -= sellQuantity;
            spotUsdtBalance += tradeAmount;
            spotUpdateDisplay();
            
            const order = {
                id: Date.now(),
                pair: spotCurrentSymbol,
                type: 'sell',
                asset: assetSymbol,
                quantity: sellQuantity,
                price: spotBtcPrice,
                amount: tradeAmount,
                pnl: 0,
                status: 'active',
                time: new Date().toLocaleString()
            };
            spotOrders.push(order);
            spotRenderOrders();
            
            document.getElementById('tradeAmountInput').value = '';
        }
        
        function spotRenderOrders() {
            const container = document.getElementById('ordersContainer');
            
            if (spotOrders.length === 0) {
                container.innerHTML = '<div class="no-orders">暂无订单记录</div>';
                return;
            }
            
            let html = '';
            spotOrders.forEach(order => {
                const pnlClass = order.pnl >= 0 ? 'profit' : 'loss';
                const pnlText = (order.pnl >= 0 ? '+' : '') + '$' + order.pnl.toFixed(2);
                const typeClass = order.type === 'buy' ? 'buy' : 'sell';
                const typeText = order.type === 'buy' ? '买入' : '卖出';
                const statusClass = order.status;
                const statusText = order.status === 'active' ? '持仓中' : (order.status === 'closed' ? '已平仓' : '已撤销');
                
                const isActionable = order.status === 'active';
                
                html += `
                    <div class="order-card ${statusClass}" id="order_${order.id}">
                        <div class="order-card-header">
                            <span class="order-pair">${order.pair}${order.trigger ? ' (' + order.trigger + ')' : ''}</span>
                            <div class="order-badges">
                                <span class="order-type-badge ${typeClass}">${typeText}</span>
                                <span class="order-status-badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <div class="order-card-body">
                            <div class="order-info-item">
                                <span class="info-label">数量</span>
                                <span class="info-value">${order.quantity.toFixed(6)} ${order.asset}</span>
                            </div>
                            <div class="order-info-item">
                                <span class="info-label">价格</span>
                                <span class="info-value">$${order.price.toFixed(2)}</span>
                            </div>
                            <div class="order-info-item">
                                <span class="info-label">金额</span>
                                <span class="info-value">$${order.amount.toFixed(2)}</span>
                            </div>
                            <div class="order-info-item">
                                <span class="info-label">盈亏</span>
                                <span class="info-value ${pnlClass}">${pnlText}</span>
                            </div>
                            <div class="order-info-item full-width">
                                <span class="info-label">时间</span>
                                <span class="info-value">${order.time}</span>
                            </div>
                        </div>
                        <div class="order-card-footer">
                            <button class="order-action-btn btn-cancel-order" onclick="spotCancelOrder(${order.id})" ${isActionable ? '' : 'disabled'}>撤单</button>
                            <button class="order-action-btn btn-close-order" onclick="spotCloseOrder(${order.id})" ${isActionable ? '' : 'disabled'}>平仓</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function spotCancelOrder(orderId) {
            const order = spotOrders.find(o => o.id === orderId);
            if (!order) return;
            
            if (order.status !== 'active') {
                alert('该订单已处理，无法撤单');
                return;
            }
            
            if (order.type === 'buy') {
                spotBtcBalance -= order.quantity;
                spotUsdtBalance += order.amount;
            } else {
                spotBtcBalance += order.quantity;
                spotUsdtBalance -= order.amount;
            }
            
            order.status = 'cancelled';
            spotUpdateDisplay();
            spotRenderOrders();
            
            alert(`✅ 订单已撤销\n${order.pair} ${order.type === 'buy' ? '买入' : '卖出'} $${order.amount.toFixed(2)}`);
        }
        
        function spotCloseOrder(orderId) {
            const order = spotOrders.find(o => o.id === orderId);
            if (!order) return;
            
            if (order.status !== 'active') {
                alert('该订单已处理，无法平仓');
                return;
            }
            
            if (order.type === 'buy') {
                const currentValue = order.quantity * spotBtcPrice;
                const pnl = currentValue - order.amount;
                order.pnl = pnl;
                
                spotBtcBalance -= order.quantity;
                spotUsdtBalance += currentValue;
            } else {
                const currentValue = order.quantity * spotBtcPrice;
                const pnl = order.amount - currentValue;
                order.pnl = pnl;
                
                spotBtcBalance += order.quantity;
                spotUsdtBalance -= currentValue;
            }
            
            order.status = 'closed';
            spotUpdateDisplay();
            spotRenderOrders();
            
            const pnlText = (order.pnl >= 0 ? '+' : '') + '$' + order.pnl.toFixed(2);
            alert(`✅ 订单已平仓\n盈亏: ${pnlText}`);
        }
        
        function spotInitOrders() {
            if (spotOrdersInitialized) return;
            spotOrdersInitialized = true;
            
            const now = new Date();
            spotOrders.push({
                id: Date.now() - 86400000,
                pair: 'BTC/USDT',
                type: 'buy',
                asset: 'BTC',
                quantity: 0.05,
                price: 62000,
                amount: 3100,
                pnl: 171.60,
                status: 'closed',
                time: now.toLocaleString()
            });
            
            spotOrders.push({
                id: Date.now() - 43200000,
                pair: 'ETH/USDT',
                type: 'sell',
                asset: 'ETH',
                quantity: 2.5,
                price: 3500,
                amount: 8750,
                pnl: -250.25,
                status: 'active',
                time: now.toLocaleString()
            });
            
            spotRenderOrders();
        }
        
        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            spotRenderSymbols();
            spotGenerateChartData();
            spotUpdateDisplay();
            spotInitOrders();
            
            window.spotSelectSymbol = spotSelectSymbol;
            window.spotSetTimePeriod = spotSetTimePeriod;
            window.switchChartType = switchChartType;
            window.spotBuy = spotBuy;
            window.spotSell = spotSell;
            window.spotCancelOrder = spotCancelOrder;
            window.spotCloseOrder = spotCloseOrder;
            window.setTpSl = setTpSl;
            window.setQuickAmount = setQuickAmount;
            window.openUnifiedPairModal = openUnifiedPairModal;
            window.closeUnifiedPairModal = closeUnifiedPairModal;
            window.filterUnifiedPairList = filterUnifiedPairList;
            window.togglePairSelection = togglePairSelection;
            window.handleNewPairKeydown = handleNewPairKeydown;
            window.addNewPairFromModal = addNewPairFromModal;
            window.savePairSelection = savePairSelection;
            
            document.getElementById('pairModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeUnifiedPairModal();
                }
            });
            
            setInterval(() => {
                const volatility = 100;
                const change = (Math.random() - 0.5) * volatility * 2;
                spotBtcPrice = Math.max(10000, spotBtcPrice + change);
                spotBtcPrice = Math.round(spotBtcPrice * 100) / 100;
                
                spotChartData.push(spotBtcPrice);
                const maxPoints = periodDataPoints[spotCurrentPeriod] || 24;
                if (spotChartData.length > maxPoints) spotChartData.shift();
                
                spotUpdateChart();
                spotUpdateDisplay();
                
                checkTpSl();
            }, 5000);
        });
    </script>
</body>
</html>
