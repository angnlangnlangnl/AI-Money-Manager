<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>现货交易</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        .tap-active:active {
            transform: scale(0.96);
            opacity: 0.7;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }

        /* ===== 交易所选择器样式 ===== */
        .exchange-selector {
            background: #12121f;
            border-bottom: 1px solid #1a1a2a;
            padding: 8px 12px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .exchange-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .exchange-selector-title {
            font-size: 11px;
            color: #6a6a7a;
            font-weight: 500;
        }
        .exchange-selector-status {
            font-size: 10px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .exchange-selector-status .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .exchange-selector-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 2px;
        }
        .exchange-selector-list::-webkit-scrollbar {
            display: none;
        }
        .exchange-option {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid #1a1a2a;
            background: #0a0a12;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .exchange-option:active {
            transform: scale(0.95);
        }
        .exchange-option.active {
            border-color: #3b82f6;
            background: #1a2a3a;
        }
        .exchange-option .exchange-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .exchange-option .exchange-icon.gateio {
            background: #1a3a2a;
            color: #4ade80;
        }
        .exchange-option .exchange-icon.binance {
            background: #2a2a1a;
            color: #fbbf24;
        }
        .exchange-option .exchange-icon.okx {
            background: #1a1a2a;
            color: #60a5fa;
        }
        .exchange-option .exchange-icon.bybit {
            background: #2a1a2a;
            color: #e879f9;
        }
        .exchange-option .exchange-icon.mexc {
            background: #1a2a2a;
            color: #2dd4bf;
        }
        .exchange-option .exchange-name {
            font-size: 12px;
            font-weight: 500;
            color: #c8c8d8;
        }
        .exchange-option.active .exchange-name {
            color: #e8e8f0;
        }
        .exchange-option .exchange-check {
            font-size: 10px;
            color: #3b82f6;
            font-weight: 700;
        }

        /* ===== 行情栏 ===== */
        .market-bar {
            background: #12121f;
            border-bottom: 1px solid #1a1a2a;
            padding: 8px 12px;
            flex-shrink: 0;
        }
        .market-bar .price-display {
            font-size: 20px;
            font-weight: 700;
            color: #4ade80;
        }
        .market-bar .price-change {
            font-size: 12px;
        }

        /* ===== K线图区域 ===== */
        .chart-container {
            background: #0a0a12;
            border-bottom: 1px solid #1a1a2a;
            padding: 8px;
            flex-shrink: 0;
            height: 260px;
            position: relative;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== 交易对选择 ===== */
        .pair-selector {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 6px 12px;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .pair-selector::-webkit-scrollbar {
            display: none;
        }
        .pair-btn {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #1a1a2a;
            background: #12121f;
            color: #8a8a9a;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .pair-btn.active {
            background: #1a2a3a;
            border-color: #3b82f6;
            color: #e8e8f0;
        }

        /* ===== 买卖面板 ===== */
        .trade-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px;
            flex-shrink: 0;
            background: #12121f;
            border-bottom: 1px solid #1a1a2a;
        }
        .trade-btn-buy {
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .trade-btn-buy:active {
            background: #0d9668;
            transform: scale(0.97);
        }
        .trade-btn-sell {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .trade-btn-sell:active {
            background: #dc2626;
            transform: scale(0.97);
        }

        /* ===== 订单簿 ===== */
        .orderbook {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            background: #0a0a0f;
        }
        .orderbook-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid #0d0d18;
        }
        .orderbook-row .price-bid {
            color: #4ade80;
        }
        .orderbook-row .price-ask {
            color: #ef4444;
        }
        .orderbook-row .amount {
            color: #8a8a9a;
        }
        .orderbook-header {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 10px;
            color: #5a5a6a;
            border-bottom: 1px solid #1a1a2a;
            font-weight: 600;
        }

        /* ===== 底部操作栏 ===== */
        .bottom-actions {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #12121f;
            border-top: 1px solid #1a1a2a;
            flex-shrink: 0;
        }
        .bottom-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid #1a1a2a;
            background: #0a0a12;
            color: #8a8a9a;
        }
        .bottom-btn:active {
            background: #1a1a2a;
            color: #e8e8f0;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 350px;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #e8e8f0;
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-input {
            width: 100%;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            color: #e8e8f0;
            outline: none;
            margin-bottom: 12px;
        }
        .modal-input:focus {
            border-color: #3b82f6;
        }
        .modal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .modal-btn-primary {
            background: #3b82f6;
            color: white;
        }
        .modal-btn-primary:active {
            background: #2563eb;
        }
        .modal-btn-secondary {
            background: #1a1a2a;
            color: #8a8a9a;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="app" style="display:flex;flex-direction:column;height:100vh;background:#0a0a0f;">

        <!-- 顶部导航 -->
        <div class="flex items-center justify-between px-4 py-2 border-b border-[#1a1a2a] bg-[#0a0a0f] flex-shrink-0" style="padding-top:3.6px;padding-bottom:3.6px;">
            <button onclick="goBack()" class="p-1.5 -ml-2 tap-active" aria-label="返回">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="flex flex-col items-center">
                <span class="text-sm font-medium text-[#e8e8f0]">现货交易</span>
                <span class="text-[10px] text-[#5a5a6a]" id="currentExchangeLabel">Gate.io</span>
            </div>
            <button onclick="openSettings()" class="p-1.5 -mr-2 tap-active" aria-label="设置">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>

        <!-- 交易所选择器（新增） -->
        <div class="exchange-selector">
            <div class="exchange-selector-header">
                <span class="exchange-selector-title">选择交易所</span>
                <span class="exchange-selector-status">
                    <span class="status-dot"></span>
                    <span id="exchangeStatusText">已连接</span>
                </span>
            </div>
            <div class="exchange-selector-list" id="exchangeSelectorList">
                <!-- 由JS渲染 -->
            </div>
        </div>

        <!-- 行情栏 -->
        <div class="market-bar">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-sm text-[#8a8a9a]" id="currentPair">BTC/USDT</span>
                    <span class="text-xs text-[#5a5a6a] ml-2" id="exchangeTag">Gate.io</span>
                </div>
                <div class="price-change text-emerald-400" id="priceChange">+2.34%</div>
            </div>
            <div class="price-display" id="currentPrice">$65,432.10</div>
        </div>

        <!-- K线图 -->
        <div class="chart-container">
            <canvas id="klineChart"></canvas>
        </div>

        <!-- 交易对选择 -->
        <div class="pair-selector" id="pairSelector">
            <!-- 由JS渲染 -->
        </div>

        <!-- 买卖按钮 -->
        <div class="trade-panel">
            <button class="trade-btn-buy" onclick="openTradeModal('buy')">买入</button>
            <button class="trade-btn-sell" onclick="openTradeModal('sell')">卖出</button>
        </div>

        <!-- 订单簿 -->
        <div class="orderbook" id="orderbook">
            <div class="orderbook-header">
                <span>价格 (USDT)</span>
                <span>数量 (BTC)</span>
                <span>合计</span>
            </div>
            <!-- 由JS渲染 -->
        </div>

        <!-- 底部操作栏 -->
        <div class="bottom-actions safe-area-bottom">
            <div class="bottom-btn" onclick="alert('持仓功能开发中')">📊 持仓</div>
            <div class="bottom-btn" onclick="alert('订单功能开发中')">📋 订单</div>
            <div class="bottom-btn" onclick="alert('资产功能开发中')">💰 资产</div>
            <div class="bottom-btn" onclick="goBack()">🏠 返回</div>
        </div>
    </div>

    <!-- 交易弹窗 -->
    <div class="modal-overlay" id="tradeModal" onclick="closeTradeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title" id="tradeModalTitle">买入 BTC</div>
            <input type="number" class="modal-input" id="tradePriceInput" placeholder="价格 (USDT)">
            <input type="number" class="modal-input" id="tradeAmountInput" placeholder="数量 (BTC)">
            <div class="flex justify-between text-xs text-[#6a6a7a] mb-3">
                <span>可用: <span id="availableBalance">0.00</span> USDT</span>
                <span>预估: <span id="estimatedTotal">0.00</span> USDT</span>
            </div>
            <button class="modal-btn modal-btn-primary" id="confirmTradeBtn" onclick="confirmTrade()">确认交易</button>
            <button class="modal-btn modal-btn-secondary" onclick="closeTradeModal()">取消</button>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal" onclick="closeSettingsModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title">⚙️ 交易设置</div>
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm text-[#8a8a9a]">当前交易所</span>
                <span class="text-sm text-[#e8e8f0]" id="settingsExchangeName">Gate.io</span>
            </div>
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm text-[#8a8a9a]">API连接状态</span>
                <span class="text-sm text-emerald-400">✓ 已连接</span>
            </div>
            <button class="modal-btn modal-btn-secondary" onclick="disconnectExchange()">断开连接</button>
            <button class="modal-btn modal-btn-secondary" onclick="closeSettingsModal()">关闭</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  交易所配置
        // ============================================================
        const EXCHANGES = [
            { id: 'gateio', name: 'Gate.io', icon: 'G', color: 'gateio', supportedPairs: ['BTC/USDT', 'ETH/USDT', 'SOL/USDT', 'ARB/USDT', 'DOGE/USDT'] },
            { id: 'binance', name: 'Binance', icon: 'B', color: 'binance', supportedPairs: ['BTC/USDT', 'ETH/USDT', 'BNB/USDT', 'SOL/USDT', 'XRP/USDT'] },
            { id: 'okx', name: 'OKX', icon: 'O', color: 'okx', supportedPairs: ['BTC/USDT', 'ETH/USDT', 'OKB/USDT', 'SOL/USDT', 'DOT/USDT'] },
            { id: 'bybit', name: 'Bybit', icon: 'B', color: 'bybit', supportedPairs: ['BTC/USDT', 'ETH/USDT', 'SOL/USDT', 'AVAX/USDT', 'LINK/USDT'] },
            { id: 'mexc', name: 'MEXC', icon: 'M', color: 'mexc', supportedPairs: ['BTC/USDT', 'ETH/USDT', 'SOL/USDT', 'APT/USDT', 'SUI/USDT'] },
        ];

        // ============================================================
        //  状态变量
        // ============================================================
        let currentExchange = 'gateio';
        let currentPair = 'BTC/USDT';
        let currentPrice = 65432.10;
        let tradeType = 'buy';
        let klineChartInstance = null;
        let orderbookData = [];

        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderExchangeSelector();
            renderPairSelector();
            renderOrderbook();
            initKlineChart();
            updateMarketDisplay();
            
            // 监听价格输入
            document.getElementById('tradePriceInput').addEventListener('input', updateEstimatedTotal);
            document.getElementById('tradeAmountInput').addEventListener('input', updateEstimatedTotal);
        });

        // ============================================================
        //  交易所选择器
        // ============================================================
        function renderExchangeSelector() {
            const container = document.getElementById('exchangeSelectorList');
            
            container.innerHTML = EXCHANGES.map(exchange => {
                const isActive = exchange.id === currentExchange;
                return `
                    <div class="exchange-option ${isActive ? 'active' : ''}" onclick="selectExchange('${exchange.id}')">
                        <div class="exchange-icon ${exchange.color}">${exchange.icon}</div>
                        <span class="exchange-name">${exchange.name}</span>
                        ${isActive ? '<span class="exchange-check">✓</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        function selectExchange(exchangeId) {
            currentExchange = exchangeId;
            renderExchangeSelector();
            
            // 更新当前交易所标签
            const exchange = EXCHANGES.find(e => e.id === exchangeId);
            document.getElementById('currentExchangeLabel').textContent = exchange.name;
            document.getElementById('exchangeTag').textContent = exchange.name;
            document.getElementById('settingsExchangeName').textContent = exchange.name;
            document.getElementById('exchangeStatusText').textContent = '已连接';
            
            // 更新交易对列表
            renderPairSelector();
            
            // 更新模拟价格
            updateMockPrice();
            updateMarketDisplay();
        }

        // ============================================================
        //  交易对选择
        // ============================================================
        function renderPairSelector() {
            const container = document.getElementById('pairSelector');
            const exchange = EXCHANGES.find(e => e.id === currentExchange);
            
            container.innerHTML = exchange.supportedPairs.map(pair => {
                const isActive = pair === currentPair;
                return `
                    <button class="pair-btn ${isActive ? 'active' : ''}" onclick="selectPair('${pair}')">${pair}</button>
                `;
            }).join('');
        }

        function selectPair(pair) {
            currentPair = pair;
            renderPairSelector();
            updateMockPrice();
            updateMarketDisplay();
            renderOrderbook();
        }

        // ============================================================
        //  模拟价格更新
        // ============================================================
        function updateMockPrice() {
            const basePrices = {
                'BTC/USDT': 65432.10,
                'ETH/USDT': 3456.78,
                'SOL/USDT': 187.50,
                'ARB/USDT': 1.56,
                'DOGE/USDT': 0.156,
                'BNB/USDT': 598.20,
                'XRP/USDT': 0.612,
                'OKB/USDT': 45.67,
                'DOT/USDT': 7.89,
                'AVAX/USDT': 38.76,
                'LINK/USDT': 16.45,
                'APT/USDT': 12.34,
                'SUI/USDT': 1.89,
            };
            
            const basePrice = basePrices[currentPair] || 100;
            const randomVariation = (Math.random() - 0.5) * basePrice * 0.002;
            currentPrice = basePrice + randomVariation;
        }

        function updateMarketDisplay() {
            document.getElementById('currentPair').textContent = currentPair;
            document.getElementById('currentPrice').textContent = '$' + currentPrice.toFixed(2);
            
            const change = (Math.random() * 4 - 1).toFixed(2);
            const changeEl = document.getElementById('priceChange');
            changeEl.textContent = (change >= 0 ? '+' : '') + change + '%';
            changeEl.className = 'price-change ' + (change >= 0 ? 'text-emerald-400' : 'text-red-400');
        }

        // ============================================================
        //  K线图
        // ============================================================
        function initKlineChart() {
            const canvas = document.getElementById('klineChart');
            const ctx = canvas.getContext('2d');
            
            klineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: currentPair,
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: '#12121f',
                            titleColor: '#e8e8f0',
                            bodyColor: '#8a8a9a',
                            borderColor: '#1a1a2a',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#0d0d18' },
                            ticks: { color: '#5a5a6a', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: '#0d0d18' },
                            ticks: { color: '#5a5a6a', font: { size: 10 } }
                        }
                    }
                }
            });
            
            updateKlineData();
        }

        function updateKlineData() {
            if (!klineChartInstance) return;
            
            const labels = [];
            const data = [];
            const now = new Date();
            
            for (let i = 30; i >= 0; i--) {
                const time = new Date(now - i * 60000);
                labels.push(time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
                const variation = (Math.random() - 0.5) * currentPrice * 0.01;
                data.push(currentPrice + variation);
            }
            
            klineChartInstance.data.labels = labels;
            klineChartInstance.data.datasets[0].data = data;
            klineChartInstance.data.datasets[0].label = currentPair;
            klineChartInstance.update();
        }

        // ============================================================
        //  订单簿
        // ============================================================
        function renderOrderbook() {
            const container = document.getElementById('orderbook');
            const header = container.querySelector('.orderbook-header');
            
            // 生成模拟订单簿数据
            const asks = [];
            const bids = [];
            
            for (let i = 0; i < 10; i++) {
                const askPrice = currentPrice * (1 + (i + 1) * 0.001);
                const bidPrice = currentPrice * (1 - (i + 1) * 0.001);
                const askAmount = Math.random() * 2;
                const bidAmount = Math.random() * 2;
                asks.push({ price: askPrice, amount: askAmount });
                bids.push({ price: bidPrice, amount: bidAmount });
            }
            
            let html = header.outerHTML;
            
            // 卖单（从上到下）
            asks.reverse().forEach(ask => {
                html += `
                    <div class="orderbook-row">
                        <span class="price-ask">$${ask.price.toFixed(2)}</span>
                        <span class="amount">${ask.amount.toFixed(4)}</span>
                        <span class="amount">$${(ask.price * ask.amount).toFixed(2)}</span>
                    </div>
                `;
            });
            
            // 当前价格
            html += `
                <div class="orderbook-row" style="justify-content:center;border-bottom:none;padding:6px 0;">
                    <span style="color:#e8e8f0;font-weight:700;">$${currentPrice.toFixed(2)}</span>
                </div>
            `;
            
            // 买单
            bids.forEach(bid => {
                html += `
                    <div class="orderbook-row">
                        <span class="price-bid">$${bid.price.toFixed(2)}</span>
                        <span class="amount">${bid.amount.toFixed(4)}</span>
                        <span class="amount">$${(bid.price * bid.amount).toFixed(2)}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // ============================================================
        //  交易弹窗
        // ============================================================
        function openTradeModal(type) {
            tradeType = type;
            const modal = document.getElementById('tradeModal');
            const title = document.getElementById('tradeModalTitle');
            const confirmBtn = document.getElementById('confirmTradeBtn');
            
            const pairBase = currentPair.split('/')[0];
            
            if (type === 'buy') {
                title.textContent = '买入 ' + pairBase;
                confirmBtn.className = 'modal-btn modal-btn-primary';
                confirmBtn.style.background = '#10b981';
            } else {
                title.textContent = '卖出 ' + pairBase;
                confirmBtn.className = 'modal-btn modal-btn-primary';
                confirmBtn.style.background = '#ef4444';
            }
            
            document.getElementById('tradePriceInput').value = currentPrice.toFixed(2);
            document.getElementById('tradeAmountInput').value = '';
            document.getElementById('estimatedTotal').textContent = '0.00';
            document.getElementById('availableBalance').textContent = '10,000.00';
            
            modal.classList.add('show');
        }

        function closeTradeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('tradeModal').classList.remove('show');
        }

        function updateEstimatedTotal() {
            const price = parseFloat(document.getElementById('tradePriceInput').value) || 0;
            const amount = parseFloat(document.getElementById('tradeAmountInput').value) || 0;
            const total = price * amount;
            document.getElementById('estimatedTotal').textContent = total.toFixed(2);
        }

        function confirmTrade() {
            const price = parseFloat(document.getElementById('tradePriceInput').value);
            const amount = parseFloat(document.getElementById('tradeAmountInput').value);
            const exchange = EXCHANGES.find(e => e.id === currentExchange);
            
            if (!price || !amount || price <= 0 || amount <= 0) {
                alert('请输入有效的价格和数量');
                return;
            }
            
            const total = price * amount;
            const action = tradeType === 'buy' ? '买入' : '卖出';
            
            alert(`✅ ${action}订单已提交\n\n交易所: ${exchange.name}\n交易对: ${currentPair}\n价格: $${price.toFixed(2)}\n数量: ${amount}\n总金额: $${total.toFixed(2)}\n\n（演示版，未实际执行）`);
            
            closeTradeModal();
        }

        // ============================================================
        //  设置弹窗
        // ============================================================
        function openSettings() {
            document.getElementById('settingsModal').classList.add('show');
        }

        function closeSettingsModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('settingsModal').classList.remove('show');
        }

        function disconnectExchange() {
            const exchange = EXCHANGES.find(e => e.id === currentExchange);
            alert(`已断开 ${exchange.name} 连接`);
            closeSettingsModal();
        }

        // ============================================================
        //  返回
        // ============================================================
        function goBack() {
            window.location.href = 'index.html';
        }

        // ============================================================
        //  定时刷新
        // ============================================================
        setInterval(() => {
            updateMockPrice();
            updateMarketDisplay();
            updateKlineData();
            renderOrderbook();
        }, 5000);

        // 暴露全局函数
        window.selectExchange = selectExchange;
        window.selectPair = selectPair;
        window.openTradeModal = openTradeModal;
        window.closeTradeModal = closeTradeModal;
        window.confirmTrade = confirmTrade;
        window.openSettings = openSettings;
        window.closeSettingsModal = closeSettingsModal;
        window.disconnectExchange = disconnectExchange;
        window.goBack = goBack;
    </script>

</body>
</html>
