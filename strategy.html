<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTC/USDT 交易界面（真实行情+完整指标+价格标签+缩放）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app { width: 390px; height: 844px; background-color: #181a20; color: #eaecef; position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: 20px; box-shadow: 0 0 20px rgba(255,255,255,0.1); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; height: 60px; }
        .header-left { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
        .header-icons { display: flex; gap: 15px; font-size: 18px; }

        .tabs { display: flex; justify-content: space-around; padding: 10px 15px; border-bottom: 1px solid #2b3139; }
        .tab { color: #848e9c; font-size: 14px; }
        .tab.active { color: #f0b90b; position: relative; }
        .tab.active::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; background: #f0b90b; border-radius: 2px; }

        .quote-section { display: flex; justify-content: space-between; padding: 15px; }
        .price-main { font-size: 32px; font-weight: bold; }
        .price-sub { font-size: 13px; color: #848e9c; margin-top: 5px; }
        .price-sub span.green { color: #0ecb81; }
        .price-sub span.red { color: #f6465d; }
        .quote-details { font-size: 12px; color: #848e9c; text-align: right; line-height: 1.6; }
        .quote-details b { color: #eaecef; font-weight: normal; }

        .timeframes { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 10px; font-size: 12px; color: #848e9c; }
        .timeframes span.active { color: #eaecef; font-weight: bold; border-bottom: 2px solid #eaecef; padding-bottom: 4px; }
        .timeframes span { cursor: pointer; }
        .timeframes span:hover { color: #eaecef; }

        .chart-container { flex: 1; position: relative; background: #181a20; }
        #kline { width: 100%; height: 100%; }

        .indicators {
            display: flex;
            gap: 15px;
            padding: 10px 15px;
            font-size: 12px;
            color: #848e9c;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .indicators::-webkit-scrollbar { display: none; }
        .indicators span { cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: all 0.2s; white-space: nowrap; }
        .indicators span.active { color: #f0b90b; background: rgba(240,185,11,0.1); }
        .indicators span:hover { color: #eaecef; }

        .performance { display: flex; justify-content: space-between; padding: 10px 15px; font-size: 12px; color: #848e9c; border-top: 1px solid #2b3139; }
        .perf-item span:last-child { margin-left: 5px; }
        .green { color: #0ecb81; }
        .red { color: #f6465d; }

        .order-book-bar { display: flex; align-items: center; padding: 10px 15px; font-size: 12px; font-weight: bold; }
        .sell-bar { width: 50%; background: #0ecb81; color: #181a20; text-align: center; padding: 4px 0; border-radius: 4px 0 0 4px; transition: width 0.5s; }
        .buy-bar { width: 50%; background: #f6465d; color: #181a20; text-align: center; padding: 4px 0; border-radius: 0 4px 4px 0; transition: width 0.5s; }
        .order-labels { display: flex; justify-content: space-around; font-size: 12px; color: #848e9c; padding: 5px 0; border-bottom: 1px solid #2b3139; }

        .bottom-action { position: absolute; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #181a20; border-top: 1px solid #2b3139; }
        .tools { display: flex; gap: 20px; font-size: 12px; color: #848e9c; text-align: center; }
        .tools div { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tools i { font-size: 18px; }
        .buy-btn, .sell-btn { flex: 1; text-align: center; padding: 12px 0; border-radius: 4px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer; }
        .buy-btn { background: #0ecb81; margin-right: 10px; }
        .sell-btn { background: #f6465d; }
        .icon { font-style: normal; }
        .error-msg { color: #f6465d; font-size: 11px; text-align: center; padding: 3px; display: none; }
    </style>
</head>
<body>
<div class="app">
    <!-- 顶部导航 -->
    <div class="header">
        <div class="header-left">
            <i class="icon">‹</i>
            <span>BTC/USDT ▾</span>
            <div style="font-size: 10px; color: #848e9c;">Bitcoin</div>
        </div>
        <div class="header-icons">
            <i class="icon">✨</i>
            <i class="icon">★</i>
            <i class="icon">🔔</i>
        </div>
    </div>

    <!-- 导航标签 -->
    <div class="tabs">
        <div class="tab">报价</div>
        <div class="tab">信息</div>
        <div class="tab">数据</div>
        <div class="tab">广场</div>
        <div class="tab active">交易</div>
    </div>

    <!-- 价格区 -->
    <div class="quote-section">
        <div>
            <div class="price-main" id="last-price">--</div>
            <div class="price-sub" id="cn-price">¥0.00 <span class="green">+0.00%</span></div>
            <div class="price-sub" style="font-size: 11px; color: #848e9c; margin-top: 8px;">支付 成交额 交易赛</div>
        </div>
        <div class="quote-details">
            <div>24h最高价 <b id="high-24">--</b></div>
            <div>24h最低价 <b id="low-24">--</b></div>
            <div>24h成交量(BTC) <b id="vol-24">--</b></div>
            <div>24h成交额(USDT) <b id="amount-24">--</b></div>
        </div>
    </div>

    <!-- 时间轴 -->
    <div class="timeframes" id="timeframes">
        <span data-interval="1m">分时</span>
        <span data-interval="15m">15分</span>
        <span data-interval="1h" class="active">1小时</span>
        <span data-interval="4h">4小时</span>
        <span data-interval="1d">日线</span>
        <span>更多 ▾</span>
    </div>

    <!-- K线图 -->
    <div class="chart-container">
        <div id="kline"></div>
        <div class="error-msg" id="kline-error">K线数据加载失败，请检查网络</div>
    </div>

    <!-- 指标按钮 -->
    <div class="indicators" id="indicator-buttons">
        <span class="active" data-indicator="MA">MA</span>
        <span data-indicator="EMA">EMA</span>
        <span data-indicator="BOLL">BOLL</span>
        <span data-indicator="SAR">SAR</span>
        <span data-indicator="AVL">AVL</span>
        <span data-indicator="VOL">VOL</span>
        <span data-indicator="MACD">MACD</span>
    </div>

    <!-- 周期涨跌 -->
    <div class="performance" id="performance">
        <div class="perf-item">今日 <span id="perf-today">--</span></div>
        <div class="perf-item">7天 <span id="perf-7d">--</span></div>
        <div class="perf-item">30天 <span id="perf-30d">--</span></div>
        <div class="perf-item">90天 <span id="perf-90d">--</span></div>
        <div class="perf-item">180天 <span id="perf-180d">--</span></div>
        <div class="perf-item">1年 <span id="perf-365d">--</span></div>
    </div>

    <!-- 买卖盘比例 -->
    <div class="order-labels">
        <span>委托订单</span><span>深度</span><span>最新成交</span><span>网络</span>
    </div>
    <div class="order-book-bar">
        <div class="sell-bar" id="sell-bar">--</div>
        <div class="buy-bar" id="buy-bar">--</div>
    </div>

    <!-- 底部操作按钮 -->
    <div class="bottom-action">
        <div class="tools">
            <div><i class="icon">⋯</i>更多</div>
            <div><i class="icon">◧</i>工具</div>
            <div><i class="icon">⚖</i>杠杆</div>
        </div>
        <div style="display: flex; flex: 1; margin-left: 15px;">
            <button class="buy-btn">买入</button>
            <button class="sell-btn">卖出</button>
        </div>
    </div>
</div>

<script>
    // =================== 常量 ===================
    const BASE_URL = 'https://api.gateio.ws/api/v4';
    const PAIR = 'BTC_USDT';
    const CNY_RATE = 7.2;
    let currentInterval = '1h';

    const indicatorState = { MA: true, EMA: false, BOLL: false, SAR: false, AVL: false, VOL: false, MACD: false };
    let cache = { ticker: null, klines: null, orderBook: null };

    // =================== 技术指标计算库 ===================
    class Indicators {
        static SMA(data, period) {
            const result = new Array(data.length).fill(null);
            for (let i = period - 1; i < data.length; i++) {
                let sum = 0;
                for (let j = i - period + 1; j <= i; j++) sum += data[j];
                result[i] = sum / period;
            }
            return result;
        }
        static EMA(data, period) {
            const result = new Array(data.length).fill(null);
            const multiplier = 2 / (period + 1);
            result[0] = data[0];
            for (let i = 1; i < data.length; i++) result[i] = (data[i] - result[i - 1]) * multiplier + result[i - 1];
            return result;
        }
        static BOLL(data, period = 20, stdDev = 2) {
            const middle = this.SMA(data, period);
            const upper = new Array(data.length).fill(null);
            const lower = new Array(data.length).fill(null);
            for (let i = period - 1; i < data.length; i++) {
                let sum = 0;
                for (let j = i - period + 1; j <= i; j++) sum += Math.pow(data[j] - middle[i], 2);
                const std = Math.sqrt(sum / period);
                upper[i] = middle[i] + stdDev * std;
                lower[i] = middle[i] - stdDev * std;
            }
            return { upper, middle, lower };
        }
        static SAR(highs, lows, step = 0.02, maxStep = 0.2) {
            const result = new Array(highs.length).fill(null);
            let isUp = true;
            let sar = lows[0];
            let ep = highs[0];
            let af = step;
            for (let i = 1; i < highs.length; i++) {
                sar = sar + af * (ep - sar);
                if (isUp) {
                    if (lows[i] < sar) {
                        isUp = false; sar = ep; ep = lows[i]; af = step;
                    } else {
                        if (highs[i] > ep) { ep = highs[i]; af = Math.min(af + step, maxStep); }
                        if (lows[i - 1] < sar) sar = lows[i - 1];
                        if (lows[i - 2] < sar) sar = lows[i - 2];
                    }
                } else {
                    if (highs[i] > sar) {
                        isUp = true; sar = ep; ep = highs[i]; af = step;
                    } else {
                        if (lows[i] < ep) { ep = lows[i]; af = Math.min(af + step, maxStep); }
                        if (highs[i - 1] > sar) sar = highs[i - 1];
                        if (highs[i - 2] > sar) sar = highs[i - 2];
                    }
                }
                result[i] = sar;
            }
            return result;
        }
        static MACD(data, fast = 12, slow = 26, signal = 9) {
            const emaFast = this.EMA(data, fast);
            const emaSlow = this.EMA(data, slow);
            const dif = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) if (emaFast[i] !== null && emaSlow[i] !== null) dif[i] = emaFast[i] - emaSlow[i];
            const validDif = dif.filter(v => v !== null);
            const deaValid = this.EMA(validDif, signal);
            const dea = new Array(data.length).fill(null);
            const offset = dif.length - deaValid.length;
            for (let i = 0; i < deaValid.length; i++) dea[offset + i] = deaValid[i];
            const macd = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) if (dif[i] !== null && dea[i] !== null) macd[i] = (dif[i] - dea[i]) * 2;
            return { dif, dea, macd };
        }
    }

    // =================== ECharts 初始化 ===================
    const chartDom = document.getElementById('kline');
    const myChart = echarts.init(chartDom);
    let chartData = { dates: [], klines: [], volumes: [] };

    // =================== 工具函数 ===================
    function formatNum(num, decimals = 2) {
        const n = parseFloat(num);
        if (isNaN(n)) return '--';
        return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }
    function setColor(el, value) { el.className = value >= 0 ? 'green' : 'red'; }
    function formatPercent(value) { return (value >= 0 ? '+' : '') + value.toFixed(2) + '%'; }
    async function fetchWithTimeout(url, timeout = 8000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
            const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } finally { clearTimeout(timer); }
    }

    // =================== 获取数据 ===================
    async function fetchTicker() {
        try {
            const data = await fetchWithTimeout(`${BASE_URL}/spot/tickers?currency_pair=${PAIR}`);
            if (!data || data.length === 0) throw new Error('空数据');
            cache.ticker = data[0];
            updateTickerUI(data[0]);
            if (chartData.klines.length) updateChart();
        } catch (e) { console.error('Ticker失败:', e); if (cache.ticker) updateTickerUI(cache.ticker); }
    }

    function updateTickerUI(t) {
        const last = parseFloat(t.last);
        const change = parseFloat(t.change_percentage);
        document.getElementById('last-price').innerText = formatNum(last);
        const changeClass = change >= 0 ? 'green' : 'red';
        document.getElementById('cn-price').innerHTML = `¥${formatNum(last * CNY_RATE)} <span class="${changeClass}">${formatPercent(change)}</span>`;
        document.getElementById('high-24').innerText = formatNum(t.high_24h);
        document.getElementById('low-24').innerText = formatNum(t.low_24h);
        document.getElementById('vol-24').innerText = formatNum(t.base_volume, 2);
        document.getElementById('amount-24').innerText = formatNum(t.quote_volume / 100000000, 2) + '亿';
        const perfToday = document.getElementById('perf-today');
        perfToday.innerText = formatPercent(change);
        setColor(perfToday, change);
    }

    async function fetchKline() {
        try {
            const data = await fetchWithTimeout(`${BASE_URL}/spot/candlesticks?currency_pair=${PAIR}&interval=${currentInterval}&limit=120`);
            if (!data || data.length === 0) throw new Error('空K线');
            cache.klines = data;
            processKlineData(data);
            document.getElementById('kline-error').style.display = 'none';
        } catch (e) { console.error('K线失败:', e); document.getElementById('kline-error').style.display = 'block'; }
    }

    function processKlineData(rawData) {
        const dates = [], klines = [], volumes = [];
        for (const item of rawData) {
            const open = parseFloat(item[5]);
            const close = parseFloat(item[2]);
            const low = parseFloat(item[4]);
            const high = parseFloat(item[3]);
            const vol = parseFloat(item[6]) || parseFloat(item[1]);
            klines.push([open, close, low, high]);
            volumes.push(vol);
            const d = new Date(parseInt(item[0]) * 1000);
            dates.push(currentInterval === '1d' ? `${d.getMonth() + 1}-${d.getDate()}` : `${d.getMonth() + 1}-${d.getDate()} ${d.getHours()}:00`);
        }
        chartData = { dates, klines, volumes };
        updateChart();
    }

    // =================== 获取订单簿 ===================
    async function fetchOrderBook() {
        try {
            const data = await fetchWithTimeout(`${BASE_URL}/spot/order_book?currency_pair=${PAIR}&limit=20`);
            if (!data) throw new Error('空订单簿');
            cache.orderBook = data;
            updateOrderBookUI(data);
        } catch (e) { console.error('订单簿失败:', e); if (cache.orderBook) updateOrderBookUI(cache.orderBook); }
    }

    function updateOrderBookUI(data) {
        let askVol = 0, bidVol = 0;
        for (const a of (data.asks || [])) askVol += parseFloat(a[1]);
        for (const b of (data.bids || [])) bidVol += parseFloat(b[1]);
        const total = askVol + bidVol;
        if (total === 0) return;
        const bidPct = (bidVol / total) * 100;
        const askPct = 100 - bidPct;
        document.getElementById('sell-bar').style.width = askPct + '%';
        document.getElementById('buy-bar').style.width = bidPct + '%';
        document.getElementById('sell-bar').innerText = '卖 ' + askPct.toFixed(1) + '%';
        document.getElementById('buy-bar').innerText = '买 ' + bidPct.toFixed(1) + '%';
    }

    // =================== 周期涨跌幅 ===================
    async function fetchPeriodChanges() {
        const periods = [
            { id: 'perf-today', days: 1 },
            { id: 'perf-7d', days: 7 },
            { id: 'perf-30d', days: 30 },
            { id: 'perf-90d', days: 90 },
            { id: 'perf-180d', days: 180 },
            { id: 'perf-365d', days: 365 }
        ];
        try {
            let currentPrice;
            if (cache.ticker) currentPrice = parseFloat(cache.ticker.last);
            else {
                const td = await fetchWithTimeout(`${BASE_URL}/spot/tickers?currency_pair=${PAIR}`);
                currentPrice = parseFloat(td[0].last);
            }
            for (const p of periods) {
                try {
                    const now = Math.floor(Date.now() / 1000);
                    const from = now - p.days * 86400;
                    const resp = await fetchWithTimeout(`${BASE_URL}/spot/candlesticks?currency_pair=${PAIR}&interval=1d&from=${from}&to=${now}&limit=1`);
                    if (resp && resp.length > 0) {
                        const oldClose = parseFloat(resp[0][2]);
                        const change = ((currentPrice - oldClose) / oldClose) * 100;
                        const el = document.getElementById(p.id);
                        el.innerText = formatPercent(change);
                        setColor(el, change);
                    }
                } catch (err) {}
            }
        } catch (e) {}
    }

    // =================== 图表更新（含内部价格标签、缩放） ===================
    function updateChart() {
        if (!chartData.klines.length) return;
        const { dates, klines, volumes } = chartData;
        const closes = klines.map(k => k[1]);
        const highs = klines.map(k => k[3]);
        const lows = klines.map(k => k[2]);

        const series = [];
        const grids = [];
        const xAxes = [];
        const yAxes = [];

        const showVolume = indicatorState.VOL || indicatorState.AVL;
        const showMacd = indicatorState.MACD;
        let mainHeight = showVolume && showMacd ? 55 : showVolume || showMacd ? 68 : 100;
        let currentTop = 5;

        // 主图 grid：右侧留出空间给标签
        const gridRight = 60;
        grids.push({ left: 0, right: gridRight, top: currentTop + '%', height: mainHeight + '%' });
        xAxes.push({ type: 'category', data: dates, gridIndex: 0, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false } });
        yAxes.push({
            scale: true,
            position: 'right',
            gridIndex: 0,
            splitLine: { lineStyle: { color: '#2b3139', type: 'dashed' } },
            axisLabel: {
                color: '#848e9c',
                fontSize: 10,
                inside: true,
                margin: 4,
                formatter: function(value) { return formatNum(value, 1); }
            }
        });

        // K线
        const klineSeries = {
            type: 'candlestick',
            data: klines,
            xAxisIndex: 0,
            yAxisIndex: 0,
            itemStyle: { color: '#0ecb81', color0: '#f6465d', borderColor: '#0ecb81', borderColor0: '#f6465d' },
            markLine: {
                symbol: 'none',
                label: { position: 'insideEnd', color: '#848e9c', fontSize: 10, formatter: '{c}' },
                lineStyle: { type: 'dashed', width: 1 },
                data: []
            }
        };

        if (cache.ticker) {
            const t = cache.ticker;
            klineSeries.markLine.data.push(
                { yAxis: parseFloat(t.last), name: '当前', lineStyle: { color: '#f0b90b' }, label: { formatter: formatNum(t.last), position: 'insideEnd', color: '#f0b90b' } },
                { yAxis: parseFloat(t.high_24h), name: '24h高', lineStyle: { color: '#f6465d' }, label: { formatter: formatNum(t.high_24h), position: 'insideEnd', color: '#f6465d' } },
                { yAxis: parseFloat(t.low_24h), name: '24h低', lineStyle: { color: '#0ecb81' }, label: { formatter: formatNum(t.low_24h), position: 'insideEnd', color: '#0ecb81' } }
            );
        }
        series.push(klineSeries);

        // 指标
        if (indicatorState.MA) {
            const ma5 = Indicators.SMA(closes, 5);
            const ma10 = Indicators.SMA(closes, 10);
            const ma20 = Indicators.SMA(closes, 20);
            series.push({ type: 'line', data: ma5, xAxisIndex: 0, yAxisIndex: 0, name: 'MA5', lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: true });
            series.push({ type: 'line', data: ma10, xAxisIndex: 0, yAxisIndex: 0, name: 'MA10', lineStyle: { color: '#f7931a', width: 1 }, symbol: 'none', smooth: true });
            series.push({ type: 'line', data: ma20, xAxisIndex: 0, yAxisIndex: 0, name: 'MA20', lineStyle: { color: '#00d4aa', width: 1 }, symbol: 'none', smooth: true });
        }
        if (indicatorState.EMA) {
            const ema12 = Indicators.EMA(closes, 12);
            const ema26 = Indicators.EMA(closes, 26);
            series.push({ type: 'line', data: ema12, xAxisIndex: 0, yAxisIndex: 0, name: 'EMA12', lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: true });
            series.push({ type: 'line', data: ema26, xAxisIndex: 0, yAxisIndex: 0, name: 'EMA26', lineStyle: { color: '#a78bfa', width: 1 }, symbol: 'none', smooth: true });
        }
        if (indicatorState.BOLL) {
            const boll = Indicators.BOLL(closes, 20, 2);
            series.push({ type: 'line', data: boll.upper, xAxisIndex: 0, yAxisIndex: 0, name: 'BOLL上', lineStyle: { color: '#f6465d', width: 0.8, type: 'dashed' }, symbol: 'none' });
            series.push({ type: 'line', data: boll.middle, xAxisIndex: 0, yAxisIndex: 0, name: 'BOLL中', lineStyle: { color: '#f0b90b', width: 0.8 }, symbol: 'none' });
            series.push({ type: 'line', data: boll.lower, xAxisIndex: 0, yAxisIndex: 0, name: 'BOLL下', lineStyle: { color: '#0ecb81', width: 0.8, type: 'dashed' }, symbol: 'none' });
        }
        if (indicatorState.SAR) {
            const sar = Indicators.SAR(highs, lows);
            series.push({ type: 'line', data: sar, xAxisIndex: 0, yAxisIndex: 0, name: 'SAR', lineStyle: { color: '#ff6b6b', width: 0 }, itemStyle: { color: '#ff6b6b' }, symbol: 'circle', symbolSize: 3 });
        }

        // 副图 VOL/AVL
        if (showVolume) {
            currentTop += mainHeight;
            const volHeight = showMacd ? 18 : 25;
            grids.push({ left: 0, right: gridRight, top: currentTop + '%', height: volHeight + '%' });
            xAxes.push({ type: 'category', data: dates, gridIndex: 1, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: 1, splitLine: { show: false }, axisLabel: { show: false } });
            if (indicatorState.VOL) {
                const volColors = klines.map(k => k[1] >= k[0] ? '#0ecb81' : '#f6465d');
                series.push({ type: 'bar', data: volumes.map((v, i) => ({ value: v, itemStyle: { color: volColors[i] } })), xAxisIndex: 1, yAxisIndex: 1, name: 'VOL' });
            }
            if (indicatorState.AVL) {
                const avl = Indicators.SMA(volumes, 10);
                series.push({ type: 'line', data: avl, xAxisIndex: 1, yAxisIndex: 1, name: 'AVL', lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: true });
            }
            currentTop += volHeight;
        }

        // 副图 MACD
        if (showMacd) {
            const macdHeight = showVolume ? 18 : 25;
            grids.push({ left: 0, right: gridRight, top: currentTop + '%', height: macdHeight + '%' });
            const macdGridIndex = showVolume ? 2 : 1;
            xAxes.push({ type: 'category', data: dates, gridIndex: macdGridIndex, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: macdGridIndex, splitLine: { show: false }, axisLabel: { show: false } });
            const macdResult = Indicators.MACD(closes);
            const macdColors = macdResult.macd.map(v => v === null ? 'transparent' : v >= 0 ? '#0ecb81' : '#f6465d');
            series.push({ type: 'bar', data: macdResult.macd.map((v, i) => ({ value: v, itemStyle: { color: macdColors[i] } })), xAxisIndex: macdGridIndex, yAxisIndex: macdGridIndex, name: 'MACD' });
            series.push({ type: 'line', data: macdResult.dif, xAxisIndex: macdGridIndex, yAxisIndex: macdGridIndex, name: 'DIF', lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: true });
            series.push({ type: 'line', data: macdResult.dea, xAxisIndex: macdGridIndex, yAxisIndex: macdGridIndex, name: 'DEA', lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: true });
        }

        // 更新图表（使用 merge 模式，不覆盖 dataZoom）
        const option = {
            grid: grids,
            xAxis: xAxes,
            yAxis: yAxes,
            series: series,
            tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } }
        };

        // 首次添加 dataZoom（如果尚未存在）
        if (!myChart.getOption().dataZoom || myChart.getOption().dataZoom.length === 0) {
            option.dataZoom = [
                {
                    type: 'inside',
                    xAxisIndex: [0, 1, 2],
                    start: 0,
                    end: 100,
                    zoomOnMouseWheel: true,
                    moveOnMouseMove: true,
                    moveOnMouseWheel: false
                }
            ];
        }

        myChart.setOption(option, false); // merge 模式
    }

    // =================== 指标按钮切换 ===================
    document.getElementById('indicator-buttons').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-indicator]');
        if (!span) return;
        const key = span.dataset.indicator;
        indicatorState[key] = !indicatorState[key];
        span.classList.toggle('active', indicatorState[key]);
        updateChart();
    });

    // =================== 时间周期切换 ===================
    document.getElementById('timeframes').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-interval]');
        if (!span) return;
        document.querySelectorAll('#timeframes span[data-interval]').forEach(s => s.classList.remove('active'));
        span.classList.add('active');
        currentInterval = span.dataset.interval;
        fetchKline();
    });

    // =================== 启动与定时刷新 ===================
    async function refreshAll() {
        await Promise.all([fetchTicker(), fetchKline(), fetchOrderBook()]);
        fetchPeriodChanges();
    }
    document.addEventListener('DOMContentLoaded', refreshAll);
    setInterval(() => { fetchTicker(); fetchKline(); fetchOrderBook(); }, 10000);
    setInterval(fetchPeriodChanges, 60000);
    window.addEventListener('resize', () => myChart.resize());
</script>
</body>
</html>
