<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTC/USDT 交易界面（真实行情）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app { width: 390px; height: 844px; background-color: #181a20; color: #eaecef; position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: 20px; box-shadow: 0 0 20px rgba(255,255,255,0.1); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; height: 60px; }
        .header-left { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
        .header-icons { display: flex; gap: 15px; font-size: 18px; }

        .tabs { display: flex; justify-content: space-around; padding: 10px 15px; border-bottom: 1px solid #2b3139; }
        .tab { color: #848e9c; font-size: 14px; }
        .tab.active { color: #f0b90b; position: relative; }
        .tab.active::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; background: #f0b90b; border-radius: 2px; }

        .quote-section { display: flex; justify-content: space-between; padding: 15px; }
        .price-main { font-size: 32px; font-weight: bold; }
        .price-sub { font-size: 13px; color: #848e9c; margin-top: 5px; }
        .price-sub span.green { color: #0ecb81; }
        .price-sub span.red { color: #f6465d; }
        .quote-details { font-size: 12px; color: #848e9c; text-align: right; line-height: 1.6; }
        .quote-details b { color: #eaecef; font-weight: normal; }

        .timeframes { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 10px; font-size: 12px; color: #848e9c; }
        .timeframes span.active { color: #eaecef; font-weight: bold; border-bottom: 2px solid #eaecef; padding-bottom: 4px; }
        .timeframes span { cursor: pointer; }
        .timeframes span:hover { color: #eaecef; }

        .chart-container { flex: 1; position: relative; background: #181a20; }
        #kline { width: 100%; height: 100%; }

        .indicators { display: flex; gap: 15px; padding: 10px 15px; font-size: 12px; color: #848e9c; overflow-x: auto; }
        .indicators span.active { color: #eaecef; }
        .indicators span:hover { color: #eaecef; cursor: pointer; }

        .performance { display: flex; justify-content: space-between; padding: 10px 15px; font-size: 12px; color: #848e9c; border-top: 1px solid #2b3139; }
        .perf-item span:last-child { margin-left: 5px; }
        .green { color: #0ecb81; }
        .red { color: #f6465d; }

        .order-book-bar { display: flex; align-items: center; padding: 10px 15px; font-size: 12px; font-weight: bold; }
        .sell-bar { width: 50%; background: #0ecb81; color: #181a20; text-align: center; padding: 4px 0; border-radius: 4px 0 0 4px; transition: width 0.5s; }
        .buy-bar { width: 50%; background: #f6465d; color: #181a20; text-align: center; padding: 4px 0; border-radius: 0 4px 4px 0; transition: width 0.5s; }
        .order-labels { display: flex; justify-content: space-around; font-size: 12px; color: #848e9c; padding: 5px 0; border-bottom: 1px solid #2b3139; }

        .bottom-action { position: absolute; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #181a20; border-top: 1px solid #2b3139; }
        .tools { display: flex; gap: 20px; font-size: 12px; color: #848e9c; text-align: center; }
        .tools div { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tools i { font-size: 18px; }
        .buy-btn, .sell-btn { flex: 1; text-align: center; padding: 12px 0; border-radius: 4px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer; }
        .buy-btn { background: #0ecb81; margin-right: 10px; }
        .sell-btn { background: #f6465d; }
        .icon { font-style: normal; }
        .error-msg { color: #f6465d; font-size: 11px; text-align: center; padding: 3px; display: none; }
    </style>
</head>
<body>
<div class="app">
    <!-- 顶部导航 -->
    <div class="header">
        <div class="header-left">
            <i class="icon">‹</i>
            <span>BTC/USDT ▾</span>
            <div style="font-size: 10px; color: #848e9c;">Bitcoin</div>
        </div>
        <div class="header-icons">
            <i class="icon">✨</i>
            <i class="icon">★</i>
            <i class="icon">🔔</i>
        </div>
    </div>

    <!-- 导航标签 -->
    <div class="tabs">
        <div class="tab">报价</div>
        <div class="tab">信息</div>
        <div class="tab">数据</div>
        <div class="tab">广场</div>
        <div class="tab active">交易</div>
    </div>

    <!-- 价格区 -->
    <div class="quote-section">
        <div>
            <div class="price-main" id="last-price">--</div>
            <div class="price-sub" id="cn-price">¥0.00 <span class="green">+0.00%</span></div>
            <div class="price-sub" style="font-size: 11px; color: #848e9c; margin-top: 8px;">支付 成交额 交易赛</div>
        </div>
        <div class="quote-details">
            <div>24h最高价 <b id="high-24">--</b></div>
            <div>24h最低价 <b id="low-24">--</b></div>
            <div>24h成交量(BTC) <b id="vol-24">--</b></div>
            <div>24h成交额(USDT) <b id="amount-24">--</b></div>
        </div>
    </div>

    <!-- 时间轴 -->
    <div class="timeframes" id="timeframes">
        <span data-interval="1m">分时</span>
        <span data-interval="15m">15分</span>
        <span data-interval="1h" class="active">1小时</span>
        <span data-interval="4h">4小时</span>
        <span data-interval="1d">日线</span>
        <span>更多 ▾</span>
    </div>

    <!-- K线图 -->
    <div class="chart-container">
        <div id="kline"></div>
        <div class="error-msg" id="kline-error">K线数据加载失败，请检查网络</div>
    </div>

    <!-- MA 指标 -->
    <div class="indicators">
        <span class="active">MA</span><span>EMA</span><span>BOLL</span><span>SAR</span><span>AVL</span><span>VOL</span><span>MACD</span>
    </div>

    <!-- 周期涨跌（全部真实数据） -->
    <div class="performance" id="performance">
        <div class="perf-item">今日 <span id="perf-today">--</span></div>
        <div class="perf-item">7天 <span id="perf-7d">--</span></div>
        <div class="perf-item">30天 <span id="perf-30d">--</span></div>
        <div class="perf-item">90天 <span id="perf-90d">--</span></div>
        <div class="perf-item">180天 <span id="perf-180d">--</span></div>
        <div class="perf-item">1年 <span id="perf-365d">--</span></div>
    </div>

    <!-- 买卖盘比例（真实订单簿数据） -->
    <div class="order-labels">
        <span>委托订单</span><span>深度</span><span>最新成交</span><span>网络</span>
    </div>
    <div class="order-book-bar">
        <div class="sell-bar" id="sell-bar">--</div>
        <div class="buy-bar" id="buy-bar">--</div>
    </div>

    <!-- 底部操作按钮 -->
    <div class="bottom-action">
        <div class="tools">
            <div><i class="icon">⋯</i>更多</div>
            <div><i class="icon">◧</i>工具</div>
            <div><i class="icon">⚖</i>杠杆</div>
        </div>
        <div style="display: flex; flex: 1; margin-left: 15px;">
            <button class="buy-btn">买入</button>
            <button class="sell-btn">卖出</button>
        </div>
    </div>
</div>

<script>
    // =================== 常量配置 ===================
    const BASE_URL = 'https://api.gateio.ws/api/v4';
    const PAIR = 'BTC_USDT';
    const CNY_RATE = 7.2;
    let currentInterval = '1h'; // 默认1小时

    // 缓存上次成功数据
    let cache = {
        ticker: null,
        klines: null,
        orderBook: null
    };

    // =================== 初始化 ECharts ===================
    const chartDom = document.getElementById('kline');
    const myChart = echarts.init(chartDom);
    const baseOption = {
        backgroundColor: 'transparent',
        grid: { left: 0, right: 0, top: 10, bottom: 0 },
        xAxis: {
            type: 'category',
            data: [],
            axisLine: { show: false },
            axisTick: { show: false },
            splitLine: { show: false },
            axisLabel: { show: false }
        },
        yAxis: {
            scale: true,
            position: 'right',
            splitLine: { lineStyle: { color: '#2b3139', type: 'dashed' } },
            axisLabel: { color: '#848e9c', fontSize: 10 }
        },
        series: [{
            type: 'candlestick',
            data: [],
            itemStyle: {
                color: '#0ecb81',
                color0: '#f6465d',
                borderColor: '#0ecb81',
                borderColor0: '#f6465d'
            }
        }],
        tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } }
    };
    myChart.setOption(baseOption);

    // =================== 工具函数 ===================
    function formatNum(num, decimals = 2) {
        const n = parseFloat(num);
        if (isNaN(n)) return '--';
        return n.toLocaleString('en-US', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
    }

    function setColor(el, value) {
        el.className = value >= 0 ? 'green' : 'red';
    }

    function formatPercent(value) {
        return (value >= 0 ? '+' : '') + value.toFixed(2) + '%';
    }

    // 带超时的 fetch
    async function fetchWithTimeout(url, timeout = 8000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
            const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } finally {
            clearTimeout(timer);
        }
    }

    // =================== 获取 Ticker ===================
    async function fetchTicker() {
        try {
            const data = await fetchWithTimeout(`${BASE_URL}/spot/tickers?currency_pair=${PAIR}`);
            if (!data || data.length === 0) throw new Error('空数据');
            const t = data[0];
            cache.ticker = t;
            updateTickerUI(t);
        } catch (e) {
            console.error('Ticker获取失败:', e);
            if (cache.ticker) updateTickerUI(cache.ticker); // 使用缓存
        }
    }

    function updateTickerUI(t) {
        const last = parseFloat(t.last);
        const change = parseFloat(t.change_percentage);

        document.getElementById('last-price').innerText = formatNum(last);
        const changeClass = change >= 0 ? 'green' : 'red';
        document.getElementById('cn-price').innerHTML =
            `¥${formatNum(last * CNY_RATE)} <span class="${changeClass}">${formatPercent(change)}</span>`;

        document.getElementById('high-24').innerText = formatNum(t.high_24h);
        document.getElementById('low-24').innerText = formatNum(t.low_24h);
        document.getElementById('vol-24').innerText = formatNum(t.base_volume, 2);
        document.getElementById('amount-24').innerText = formatNum(t.quote_volume / 100000000, 2) + '亿';

        const perfToday = document.getElementById('perf-today');
        perfToday.innerText = formatPercent(change);
        setColor(perfToday, change);
    }

    // =================== 获取 K 线 ===================
    async function fetchKline() {
        try {
            const data = await fetchWithTimeout(
                `${BASE_URL}/spot/candlesticks?currency_pair=${PAIR}&interval=${currentInterval}&limit=100`
            );
            if (!data || data.length === 0) throw new Error('空K线数据');
            cache.klines = data;
            updateKlineUI(data);
            document.getElementById('kline-error').style.display = 'none';
        } catch (e) {
            console.error('K线获取失败:', e);
            document.getElementById('kline-error').style.display = 'block';
            if (cache.klines) updateKlineUI(cache.klines); // 使用缓存
        }
    }

    function updateKlineUI(rawData) {
        // Gate K线格式: [时间戳, 计价币成交量, 收盘价, 最高价, 最低价, 开盘价, 基础币成交量, 窗口关闭时间戳]
        const kLineData = rawData.map(item => [
            parseFloat(item[5]), // Open
            parseFloat(item[2]), // Close
            parseFloat(item[4]), // Low
            parseFloat(item[3])  // High
        ]);

        const dates = rawData.map(item => {
            const d = new Date(parseInt(item[0]) * 1000);
            if (currentInterval === '1d') {
                return `${d.getMonth() + 1}-${d.getDate()}`;
            }
            return `${d.getMonth() + 1}-${d.getDate()} ${d.getHours()}:00`;
        });

        myChart.setOption({
            xAxis: { data: dates },
            series: [{ data: kLineData }]
        });
    }

    // =================== 获取订单簿（真实数据） ===================
    async function fetchOrderBook() {
        try {
            const data = await fetchWithTimeout(
                `${BASE_URL}/spot/order_book?currency_pair=${PAIR}&limit=20`
            );
            if (!data) throw new Error('空订单簿');
            cache.orderBook = data;
            updateOrderBookUI(data);
        } catch (e) {
            console.error('订单簿获取失败:', e);
            if (cache.orderBook) updateOrderBookUI(cache.orderBook);
        }
    }

    function updateOrderBookUI(data) {
        const asks = data.asks || [];
        const bids = data.bids || [];
        let askVolume = 0;
        let bidVolume = 0;
        for (const a of asks) askVolume += parseFloat(a[1]);
        for (const b of bids) bidVolume += parseFloat(b[1]);
        const total = askVolume + bidVolume;
        if (total === 0) return;
        const bidPct = (bidVolume / total) * 100;
        const askPct = 100 - bidPct;

        const sellBar = document.getElementById('sell-bar');
        const buyBar = document.getElementById('buy-bar');
        sellBar.style.width = askPct + '%';
        buyBar.style.width = bidPct + '%';
        sellBar.innerText = '卖 ' + askPct.toFixed(1) + '%';
        buyBar.innerText = '买 ' + bidPct.toFixed(1) + '%';
    }

    // =================== 获取周期涨跌幅（真实数据） ===================
    async function fetchPeriodChanges() {
        const periods = [
            { id: 'perf-today', days: 1, interval: '1d' },
            { id: 'perf-7d', days: 7, interval: '1d' },
            { id: 'perf-30d', days: 30, interval: '1d' },
            { id: 'perf-90d', days: 90, interval: '1d' },
            { id: 'perf-180d', days: 180, interval: '1d' },
            { id: 'perf-365d', days: 365, interval: '1d' }
        ];

        try {
            // 获取当前价格
            let currentPrice;
            if (cache.ticker) {
                currentPrice = parseFloat(cache.ticker.last);
            } else {
                const tickerData = await fetchWithTimeout(`${BASE_URL}/spot/tickers?currency_pair=${PAIR}`);
                currentPrice = parseFloat(tickerData[0].last);
            }

            for (const period of periods) {
                try {
                    const now = Math.floor(Date.now() / 1000);
                    const from = now - period.days * 86400;
                    const resp = await fetchWithTimeout(
                        `${BASE_URL}/spot/candlesticks?currency_pair=${PAIR}&interval=1d&from=${from}&to=${now}&limit=1`
                    );
                    if (resp && resp.length > 0) {
                        // 日K格式: [时间戳, 计价币成交量, 收盘价, 最高价, 最低价, 开盘价, ...]
                        const oldClose = parseFloat(resp[0][2]);
                        const change = ((currentPrice - oldClose) / oldClose) * 100;
                        const el = document.getElementById(period.id);
                        el.innerText = formatPercent(change);
                        setColor(el, change);
                    }
                } catch (err) {
                    console.error(`${period.id}获取失败:`, err);
                }
            }
        } catch (e) {
            console.error('周期涨跌幅获取失败:', e);
        }
    }

    // =================== 时间周期切换 ===================
    document.getElementById('timeframes').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-interval]');
        if (!span) return;
        document.querySelectorAll('#timeframes span[data-interval]').forEach(s => s.classList.remove('active'));
        span.classList.add('active');
        currentInterval = span.dataset.interval;
        fetchKline();
    });

    // =================== 启动与定时刷新（每10秒） ===================
    async function refreshAll() {
        await Promise.all([
            fetchTicker(),
            fetchKline(),
            fetchOrderBook()
        ]);
        fetchPeriodChanges(); // 周期涨跌幅可稍慢，不阻塞主流程
    }

    document.addEventListener('DOMContentLoaded', refreshAll);

    // 每10秒刷新行情、K线、订单簿
    setInterval(() => {
        fetchTicker();
        fetchKline();
        fetchOrderBook();
    }, 10000);

    // 每60秒刷新周期涨跌幅
    setInterval(fetchPeriodChanges, 60000);

    // 窗口大小自适应
    window.addEventListener('resize', () => myChart.resize());
</script>
</body>
</html>
