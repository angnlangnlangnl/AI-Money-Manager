<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>现货交易 - AI 金融助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
            overflow-y: auto;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        .tap-active:active {
            transform: scale(0.96);
            opacity: 0.7;
        }

        .spot-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .back-btn {
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s;
            color: #8a8a9a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            margin-bottom: 16px;
            font-size: 0;
            text-decoration: none;
        }
        .back-btn:active {
            background: #1a1a2a;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #8a8a9a;
            fill: none;
            stroke-width: 2;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 14px 20px;
        }
        .page-header .title {
            font-size: 18px;
            font-weight: 700;
            color: #60a5fa;
        }
        .page-header .current-price-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .page-header .current-price-info .price {
            font-size: 24px;
            font-weight: 700;
            color: #e8e8f0;
        }
        .page-header .current-price-info .change {
            font-size: 14px;
            font-weight: 600;
        }

        .symbol-bar {
            display: flex;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid #1a1a2a;
            padding: 12px 0 8px 0;
            margin-bottom: 12px;
            position: relative;
        }
        .symbol-list {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 #1a1a2a;
            flex: 1;
            padding-bottom: 4px;
        }
        .symbol-list::-webkit-scrollbar {
            height: 4px;
        }
        .symbol-list::-webkit-scrollbar-thumb {
            background-color: #3b82f6;
            border-radius: 2px;
        }
        .symbol-list::-webkit-scrollbar-track {
            background: #1a1a2a;
        }
        .symbol-item {
            color: #6a6a7a;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
            white-space: nowrap;
            flex-shrink: 0;
            padding: 4px 0;
        }
        .symbol-item:hover {
            color: #9ca3af;
        }
        .symbol-item.active {
            color: #3b82f6;
        }
        .add-pair-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #3b82f6;
            color: #3b82f6;
            background: transparent;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 300;
            margin-left: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .add-pair-btn:hover {
            background-color: #3b82f6;
            color: #0a0a0f;
        }

        /* 图表容器 */
        .chart-container {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            min-height: 320px;
            position: relative;
        }
        .chart-container .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .chart-container .chart-header .chart-title {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
        }
        .chart-container .chart-header .chart-pair {
            color: #6a6a7a;
            font-size: 14px;
            font-weight: 500;
            background: #1a1a2a;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
        }
        .chart-type-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .chart-type-tab {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #1a1a2a;
            background: #12121f;
            color: #6a6a7a;
            touch-action: manipulation;
        }
        .chart-type-tab.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }
        .chart-wrapper {
            position: relative;
            height: 220px;
        }
        .chart-wrapper canvas {
            width: 100% !important;
            height: 220px !important;
        }
        .chart-time-labels {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 8px;
            padding-right: 4px;
        }
        .chart-time-labels .time-label {
            font-size: 11px;
            color: #5a5a6a;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 12px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .chart-time-labels .time-label:hover {
            color: #8a8a9a;
            border-color: #2a2a3a;
        }
        .chart-time-labels .time-label.active {
            color: #3b82f6;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
        }

        /* 账户操作卡片 */
        .account-card {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .account-card .card-title {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #1a1a2a;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .account-card .account-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .account-card .account-row .label {
            font-size: 13px;
            color: #6a6a7a;
        }
        .account-card .account-row .value {
            font-size: 15px;
            font-weight: 600;
            color: #e8e8f0;
        }
        .account-card .account-row .value.btc {
            color: #fbbf24;
        }
        .account-card .account-row .value.green {
            color: #10b981;
        }
        .account-card .account-row .value.red {
            color: #ef4444;
        }
        .account-card .divider {
            border-top: 1px solid #1a1a2a;
            margin: 12px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .button-group .btn {
            flex: 1;
            text-align: center;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            color: white;
            touch-action: manipulation;
        }
        .button-group .btn:hover {
            opacity: 0.85;
        }
        .button-group .btn-buy {
            background: #10b981;
        }
        .button-group .btn-sell {
            background: #ef4444;
        }
        .account-card .current-price {
            margin-top: 10px;
            font-size: 13px;
            color: #6a6a7a;
        }

        /* 订单记录卡片 */
        .orders-card {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .orders-card .card-title {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #1a1a2a;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .order-item {
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .order-item:last-child {
            margin-bottom: 0;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-pair {
            font-size: 13px;
            font-weight: 700;
            color: #e8e8f0;
        }
        .order-type {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
        }
        .order-type.buy {
            background: #1a3a2a;
            color: #10b981;
        }
        .order-type.sell {
            background: #3a1a1a;
            color: #ef4444;
        }
        .order-details {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #6a6a7a;
        }
        .order-pnl {
            font-size: 12px;
            font-weight: 600;
        }
        .order-pnl.profit {
            color: #10b981;
        }
        .order-pnl.loss {
            color: #ef4444;
        }
        .order-actions {
            display: flex;
            gap: 8px;
        }
        .order-action-btn {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            touch-action: manipulation;
        }
        .order-action-btn:active {
            opacity: 0.7;
        }
        .btn-cancel-order {
            background: #3a1a1a;
            color: #ef4444;
        }
        .btn-close-order {
            background: #1a2a3a;
            color: #60a5fa;
        }
        .no-orders {
            text-align: center;
            padding: 20px;
            color: #5a5a6a;
            font-size: 13px;
        }

        /* 添加交易对弹窗 */
        .pair-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .pair-modal-overlay.show {
            display: flex;
        }
        .pair-modal {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 16px;
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
        }
        .pair-modal .modal-title {
            color: #60a5fa;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }
        .pair-modal .search-input {
            width: 100%;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            color: #e8e8f0;
            outline: none;
            margin-bottom: 12px;
        }
        .pair-modal .search-input:focus {
            border-color: #3b82f6;
        }
        .pair-modal .pair-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .pair-modal .pair-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            touch-action: manipulation;
        }
        .pair-modal .pair-option:active {
            background: #1a1a2a;
        }
        .pair-modal .pair-option.selected {
            background: #1a2a3a;
            border: 1px solid #3b82f6;
        }
        .pair-modal .pair-option .pair-name {
            font-size: 13px;
            font-weight: 600;
            color: #e8e8f0;
        }
        .pair-modal .pair-option .pair-price {
            font-size: 11px;
            color: #6a6a7a;
        }
        .pair-modal .pair-option .check-icon {
            color: #3b82f6;
            font-size: 14px;
        }
        .pair-modal .no-results {
            text-align: center;
            padding: 15px;
            color: #5a5a6a;
            font-size: 12px;
        }
        .add-pair-section {
            border-top: 1px solid #1a1a2a;
            padding-top: 12px;
        }
        .add-pair-row {
            display: flex;
            gap: 8px;
        }
        .add-pair-row input {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: #e8e8f0;
            outline: none;
        }
        .add-pair-row input:focus {
            border-color: #3b82f6;
        }
        .add-pair-modal-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .spot-container {
                padding: 12px;
            }
            .page-header .title {
                font-size: 15px;
            }
            .page-header .current-price-info .price {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="spot-container">
        <!-- 返回按钮 -->
        <a class="back-btn" href="index.html" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </a>

        <!-- 1. 顶部价格卡片 -->
        <div class="page-header">
            <span class="title">💰 现货交易</span>
            <div class="current-price-info">
                <span class="price" id="spotCurrentPrice">$65,432.10</span>
                <span class="change" id="spotPriceChange" style="color:#10b981;">+3.21%</span>
            </div>
        </div>

        <!-- 2. 交易对选择栏 -->
        <div class="symbol-bar">
            <div class="symbol-list" id="spotSymbolList">
                <!-- 由JS渲染 -->
            </div>
            <button class="add-pair-btn" onclick="spotAddPair()">+</button>
        </div>

        <!-- 3. 价格走势卡片 -->
        <div class="chart-container">
            <div class="chart-header">
                <span class="chart-title">📈 价格走势</span>
                <span class="chart-pair" id="chartPairDisplay">BTC/USDT</span>
            </div>
            
            <div class="chart-type-tabs">
                <span class="chart-type-tab active" data-type="line" onclick="switchChartType('line', this)">📉 折线图</span>
                <span class="chart-type-tab" data-type="candle" onclick="switchChartType('candle', this)">🕯️ K线图</span>
                <span class="chart-type-tab" data-type="bar" onclick="switchChartType('bar', this)">📊 柱状图</span>
            </div>
            
            <div class="chart-wrapper">
                <canvas id="spotPriceChart"></canvas>
            </div>
            
            <div class="chart-time-labels" id="chartTimeLabels">
                <span class="time-label active" data-period="1h" onclick="spotSetTimePeriod('1h', this)">1小时</span>
                <span class="time-label" data-period="4h" onclick="spotSetTimePeriod('4h', this)">4小时</span>
                <span class="time-label" data-period="1d" onclick="spotSetTimePeriod('1d', this)">日线</span>
                <span class="time-label" data-period="1m" onclick="spotSetTimePeriod('1m', this)">月线</span>
            </div>
        </div>

        <!-- 4. 账户操作卡片 -->
        <div class="account-card">
            <div class="card-title">📊 账户操作</div>
            
            <div class="account-row">
                <span class="label">总资产</span>
                <span class="value" id="spotTotalBalance">$10,000.00</span>
            </div>
            <div class="account-row">
                <span class="label">USDT 余额</span>
                <span class="value" id="spotUsdtBalance">10,000.00</span>
            </div>
            <div class="account-row">
                <span class="label" id="spotAssetLabel">BTC 持仓</span>
                <span class="value btc" id="spotBtcBalance">0.0000</span>
            </div>
            <div class="account-row">
                <span class="label">总盈亏</span>
                <span class="value green" id="spotTotalPnl">+$0.00</span>
            </div>
            
            <div class="divider"></div>
            
            <div class="button-group">
                <button class="btn btn-buy" onclick="spotBuy()">买入</button>
                <button class="btn btn-sell" onclick="spotSell()">卖出</button>
            </div>
            <div class="current-price">
                当前价格: <span id="spotCurrentPriceDisplay">$65,432.10</span>
            </div>
        </div>

        <!-- 5. 订单记录卡片 -->
        <div class="orders-card">
            <div class="card-title">📋 订单记录</div>
            <div id="ordersContainer">
                <div class="no-orders">暂无订单记录</div>
            </div>
        </div>
    </div>

    <!-- 添加交易对弹窗 -->
    <div class="pair-modal-overlay" id="pairModalOverlay" onclick="spotClosePairModal(event)">
        <div class="pair-modal" onclick="event.stopPropagation()">
            <div class="modal-title">🔍 添加交易对</div>
            <input type="text" class="search-input" id="pairSearchInput" placeholder="搜索交易对..." oninput="spotFilterPairList()">
            <div class="pair-list" id="pairModalContent"></div>
            <div class="add-pair-section">
                <div class="add-pair-row">
                    <input type="text" id="newPairInput" placeholder="输入新交易对 (如: ATOM/USDT)" onkeydown="spotHandleNewPairKeydown(event)">
                    <button class="add-pair-modal-btn" onclick="spotAddNewPair()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  现货交易核心逻辑
        // ============================================================
        
        // 全局状态
        let spotUsdtBalance = 10000;
        let spotBtcBalance = 0;
        let spotBtcPrice = 65432.10;
        let spotCurrentSymbol = 'BTC/USDT';
        let spotCurrentPeriod = '1h';
        let spotChartType = 'line';
        let spotChart = null;
        let spotChartData = [];
        let spotPriceHistory = [];
        let spotOrders = [];
        let spotOrdersInitialized = false;
        
        // 交易对数据
        let spotPairs = ['BTC/USDT', 'ETH/USDT', 'SOL/USDT', 'BNB/USDT', 'XRP/USDT', 'ADA/USDT', 'DOT/USDT', 'AVAX/USDT'];
        
        let spotPairData = {
            'BTC/USDT': { price: 65432.10, change: 3.21, base: 'USDT', asset: 'BTC' },
            'ETH/USDT': { price: 3456.78, change: -1.23, base: 'USDT', asset: 'ETH' },
            'SOL/USDT': { price: 187.50, change: 5.67, base: 'USDT', asset: 'SOL' },
            'BNB/USDT': { price: 598.20, change: 0.87, base: 'USDT', asset: 'BNB' },
            'XRP/USDT': { price: 0.612, change: -0.45, base: 'USDT', asset: 'XRP' },
            'ADA/USDT': { price: 0.456, change: 3.21, base: 'USDT', asset: 'ADA' },
            'DOT/USDT': { price: 7.89, change: -2.10, base: 'USDT', asset: 'DOT' },
            'AVAX/USDT': { price: 38.76, change: 4.56, base: 'USDT', asset: 'AVAX' },
        };
        
        // 时间周期数据点
        const periodDataPoints = {
            '1h': 24,
            '4h': 30,
            '1d': 30,
            '1m': 30
        };
        
        // 渲染交易对列表
        function spotRenderSymbols() {
            const container = document.getElementById('spotSymbolList');
            if (container) {
                let html = '';
                spotPairs.forEach((symbol, index) => {
                    const activeClass = index === 0 ? 'active' : '';
                    html += `<span class="symbol-item ${activeClass}" onclick="spotSelectSymbol(this, '${symbol}')">${symbol}</span>`;
                });
                container.innerHTML = html;
            }
        }
        
        // 选择交易对
        function spotSelectSymbol(el, symbol) {
            document.querySelectorAll('#spotSymbolList .symbol-item').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            spotCurrentSymbol = symbol;
            
            const data = spotPairData[symbol] || spotPairData['BTC/USDT'];
            spotBtcPrice = data.price;
            
            document.getElementById('spotCurrentPrice').textContent = '$' + data.price.toFixed(2);
            const changeEl = document.getElementById('spotPriceChange');
            if (changeEl) {
                changeEl.textContent = (data.change >= 0 ? '+' : '') + data.change.toFixed(2) + '%';
                changeEl.style.color = data.change >= 0 ? '#10b981' : '#ef4444';
            }
            
            document.getElementById('chartPairDisplay').textContent = symbol;
            document.getElementById('spotAssetLabel').textContent = data.asset + ' 持仓';
            document.getElementById('spotCurrentPriceDisplay').textContent = '$' + data.price.toFixed(2);
            
            spotGenerateChartData();
            spotUpdateDisplay();
        }
        
        // 切换图表类型
        function switchChartType(type, el) {
            spotChartType = type;
            document.querySelectorAll('.chart-type-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });
            spotGenerateChartData();
        }
        
        // 切换时间周期
        function spotSetTimePeriod(period, el) {
            spotCurrentPeriod = period;
            document.querySelectorAll('.chart-time-labels .time-label').forEach(label => {
                label.classList.remove('active');
            });
            if (el) el.classList.add('active');
            spotGenerateChartData();
        }
        
        // 生成图表数据
        function spotGenerateChartData() {
            const data = spotPairData[spotCurrentSymbol] || spotPairData['BTC/USDT'];
            const basePrice = data.price;
            const volatility = basePrice * 0.025;
            const numPoints = periodDataPoints[spotCurrentPeriod] || 24;
            
            spotChartData = [];
            spotPriceHistory = [];
            let current = basePrice * 0.97;
            for (let i = 0; i < numPoints; i++) {
                current += (Math.random() - 0.5) * volatility * 2;
                current = Math.max(basePrice * 0.85, Math.min(basePrice * 1.15, current));
                spotChartData.push(Math.round(current * 100) / 100);
                spotPriceHistory.push(Math.round(current * 100) / 100);
            }
            
            spotUpdateChart();
        }
        
        // 更新图表
        function spotUpdateChart() {
            const canvas = document.getElementById('spotPriceChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            if (spotChart) {
                spotChart.destroy();
            }
            
            if (spotChartType === 'line') {
                spotChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array(spotChartData.length).fill(''),
                        datasets: [{
                            label: spotCurrentSymbol,
                            data: spotChartData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59,130,246,0.1)',
                            fill: true,
                            tension: 0.2,
                            pointRadius: 0,
                            borderWidth: 2,
                        }]
                    },
                    options: getChartOptions()
                });
            } else if (spotChartType === 'candle') {
                const candleData = spotChartData.map((price, index) => {
                    const open = index > 0 ? spotChartData[index - 1] : price * 0.998;
                    const close = price;
                    const high = Math.max(open, close) * 1.002;
                    const low = Math.min(open, close) * 0.998;
                    return { open, close, high, low };
                });
                
                spotChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Array(candleData.length).fill(''),
                        datasets: [{
                            label: spotCurrentSymbol,
                            data: candleData.map(d => d.high - d.low),
                            backgroundColor: candleData.map(d => d.close >= d.open ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)'),
                            borderColor: candleData.map(d => d.close >= d.open ? '#10b981' : '#ef4444'),
                            borderWidth: 1,
                        }]
                    },
                    options: getChartOptions()
                });
            } else if (spotChartType === 'bar') {
                const barData = spotChartData.map((price, index) => {
                    return index > 0 ? price - spotChartData[index - 1] : 0;
                });
                
                spotChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Array(barData.length).fill(''),
                        datasets: [{
                            label: '涨跌',
                            data: barData,
                            backgroundColor: barData.map(v => v >= 0 ? 'rgba(16,185,129,0.7)' : 'rgba(239,68,68,0.7)'),
                            borderColor: barData.map(v => v >= 0 ? '#10b981' : '#ef4444'),
                            borderWidth: 1,
                        }]
                    },
                    options: getChartOptions()
                });
            }
        }
        
        // 获取图表配置
        function getChartOptions() {
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                if (spotChartType === 'bar') {
                                    return (context.parsed.y >= 0 ? '+' : '') + context.parsed.y.toFixed(2);
                                }
                                return '$' + context.parsed.y.toFixed(2);
                            }
                        }
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        ticks: {
                            color: '#6a6a7a',
                            callback: function(value) { return '$' + value.toFixed(0); }
                        },
                        grid: { color: '#1a1a2a' }
                    }
                }
            };
        }
        
        // 更新显示
        function spotUpdateDisplay() {
            const total = spotUsdtBalance + spotBtcBalance * spotBtcPrice;
            const pnl = total - 10000;
            
            document.getElementById('spotCurrentPrice').textContent = '$' + spotBtcPrice.toFixed(2);
            document.getElementById('spotTotalBalance').textContent = '$' + total.toFixed(2);
            document.getElementById('spotUsdtBalance').textContent = spotUsdtBalance.toFixed(2);
            document.getElementById('spotBtcBalance').textContent = spotBtcBalance.toFixed(4);
            
            const pnlEl = document.getElementById('spotTotalPnl');
            if (pnlEl) {
                pnlEl.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
                pnlEl.className = 'value ' + (pnl >= 0 ? 'green' : 'red');
            }
            
            document.getElementById('spotCurrentPriceDisplay').textContent = '$' + spotBtcPrice.toFixed(2);
        }
        
        // 买入
        function spotBuy() {
            const assetSymbol = spotCurrentSymbol.split('/')[0];
            const maxBuy = Math.min(spotUsdtBalance, 500);
            
            if (maxBuy < 10) {
                alert('USDT 余额不足，无法买入');
                return;
            }
            
            const quantity = maxBuy / spotBtcPrice;
            if (quantity < 0.001) {
                alert('买入量太小');
                return;
            }
            
            const buyAmount = maxBuy;
            spotBtcBalance += quantity;
            spotUsdtBalance -= buyAmount;
            spotUpdateDisplay();
            
            // 创建订单
            const order = {
                id: Date.now(),
                pair: spotCurrentSymbol,
                type: 'buy',
                asset: assetSymbol,
                quantity: quantity,
                price: spotBtcPrice,
                amount: buyAmount,
                pnl: 0,
                status: 'active',
                time: new Date().toLocaleString()
            };
            spotOrders.push(order);
            spotRenderOrders();
        }
        
        // 卖出
        function spotSell() {
            const assetSymbol = spotCurrentSymbol.split('/')[0];
            
            if (spotBtcBalance < 0.001) {
                alert(assetSymbol + ' 持仓不足，无法卖出');
                return;
            }
            
            const maxSell = Math.min(spotBtcBalance, 0.01);
            const sellAmount = maxSell * spotBtcPrice;
            spotBtcBalance -= maxSell;
            spotUsdtBalance += sellAmount;
            spotUpdateDisplay();
            
            // 创建订单
            const order = {
                id: Date.now(),
                pair: spotCurrentSymbol,
                type: 'sell',
                asset: assetSymbol,
                quantity: maxSell,
                price: spotBtcPrice,
                amount: sellAmount,
                pnl: 0,
                status: 'active',
                time: new Date().toLocaleString()
            };
            spotOrders.push(order);
            spotRenderOrders();
        }
        
        // 渲染订单记录
        function spotRenderOrders() {
            const container = document.getElementById('ordersContainer');
            
            if (spotOrders.length === 0) {
                container.innerHTML = '<div class="no-orders">暂无订单记录</div>';
                return;
            }
            
            let html = '';
            spotOrders.forEach(order => {
                const pnlClass = order.pnl >= 0 ? 'profit' : 'loss';
                const pnlText = (order.pnl >= 0 ? '+' : '') + '$' + order.pnl.toFixed(2);
                const typeClass = order.type === 'buy' ? 'buy' : 'sell';
                const typeText = order.type === 'buy' ? '买入' : '卖出';
                
                html += `
                    <div class="order-item" id="order_${order.id}">
                        <div class="order-header">
                            <span class="order-pair">${order.pair}</span>
                            <span class="order-type ${typeClass}">${typeText}</span>
                        </div>
                        <div class="order-details">
                            <span>数量: ${order.quantity.toFixed(6)} ${order.asset}</span>
                            <span>价格: $${order.price.toFixed(2)}</span>
                            <span>金额: $${order.amount.toFixed(2)}</span>
                        </div>
                        <div class="order-details">
                            <span>${order.time}</span>
                            <span class="order-pnl ${pnlClass}">盈亏: ${pnlText}</span>
                        </div>
                        <div class="order-actions">
                            <button class="order-action-btn btn-cancel-order" onclick="spotCancelOrder(${order.id})">撤单</button>
                            <button class="order-action-btn btn-close-order" onclick="spotCloseOrder(${order.id})">平仓</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // 撤单
        function spotCancelOrder(orderId) {
            const order = spotOrders.find(o => o.id === orderId);
            if (!order) return;
            
            if (order.status !== 'active') {
                alert('该订单已处理，无法撤单');
                return;
            }
            
            // 回滚交易
            if (order.type === 'buy') {
                spotBtcBalance -= order.quantity;
                spotUsdtBalance += order.amount;
            } else {
                spotBtcBalance += order.quantity;
                spotUsdtBalance -= order.amount;
            }
            
            order.status = 'cancelled';
            spotUpdateDisplay();
            spotRenderOrders();
            
            alert(`✅ 订单已撤销\n${order.pair} ${order.type === 'buy' ? '买入' : '卖出'} $${order.amount.toFixed(2)}`);
        }
        
        // 平仓
        function spotCloseOrder(orderId) {
            const order = spotOrders.find(o => o.id === orderId);
            if (!order) return;
            
            if (order.status !== 'active') {
                alert('该订单已处理，无法平仓');
                return;
            }
            
            // 计算盈亏
            if (order.type === 'buy') {
                const currentValue = order.quantity * spotBtcPrice;
                const pnl = currentValue - order.amount;
                order.pnl = pnl;
                
                // 卖出平仓
                spotBtcBalance -= order.quantity;
                spotUsdtBalance += currentValue;
            } else {
                const currentValue = order.quantity * spotBtcPrice;
                const pnl = order.amount - currentValue;
                order.pnl = pnl;
                
                // 买入平仓
                spotBtcBalance += order.quantity;
                spotUsdtBalance -= currentValue;
            }
            
            order.status = 'closed';
            spotUpdateDisplay();
            spotRenderOrders();
            
            const pnlText = (order.pnl >= 0 ? '+' : '') + '$' + order.pnl.toFixed(2);
            alert(`✅ 订单已平仓\n盈亏: ${pnlText}`);
        }
        
        // 初始化默认订单
        function spotInitOrders() {
            if (spotOrdersInitialized) return;
            spotOrdersInitialized = true;
            
            // 添加一笔示例订单
            const now = new Date();
            spotOrders.push({
                id: Date.now() - 86400000,
                pair: 'BTC/USDT',
                type: 'buy',
                asset: 'BTC',
                quantity: 0.05,
                price: 62000,
                amount: 3100,
                pnl: 171.60,
                status: 'closed',
                time: now.toLocaleString()
            });
            
            spotOrders.push({
                id: Date.now() - 43200000,
                pair: 'ETH/USDT',
                type: 'sell',
                asset: 'ETH',
                quantity: 2.5,
                price: 3500,
                amount: 8750,
                pnl: -250.25,
                status: 'active',
                time: now.toLocaleString()
            });
            
            spotRenderOrders();
        }
        
        // 打开添加交易对弹窗
        function spotAddPair() {
            document.getElementById('pairSearchInput').value = '';
            document.getElementById('newPairInput').value = '';
            spotRenderPairList('');
            document.getElementById('pairModalOverlay').classList.add('show');
        }
        
        // 关闭添加交易对弹窗
        function spotClosePairModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('pairModalOverlay').classList.remove('show');
        }
        
        // 渲染交易对列表
        function spotRenderPairList(filter) {
            const container = document.getElementById('pairModalContent');
            const filterLower = filter.toLowerCase();
            const availablePairs = Object.keys(spotPairData);
            const filteredPairs = availablePairs.filter(pair => pair.toLowerCase().includes(filterLower) && !spotPairs.includes(pair));
            
            if (filteredPairs.length === 0) {
                container.innerHTML = '<div class="no-results">未找到可添加的交易对</div>';
                return;
            }
            
            let html = '';
            filteredPairs.forEach(pair => {
                const price = spotPairData[pair]?.price || 0;
                html += `
                    <div class="pair-option" onclick="spotSelectNewPair('${pair}')">
                        <span class="pair-name">${pair}</span>
                        <span class="pair-price">$${price.toFixed(2)}</span>
                        <span class="check-icon">+</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // 搜索过滤
        function spotFilterPairList() {
            const filter = document.getElementById('pairSearchInput').value;
            spotRenderPairList(filter);
        }
        
        // 选择新交易对
        function spotSelectNewPair(pair) {
            if (!spotPairs.includes(pair)) {
                spotPairs.push(pair);
                spotRenderSymbols();
                spotClosePairModal();
                alert(`✅ 已添加交易对: ${pair}`);
            }
        }
        
        // 处理新交易对输入回车键
        function spotHandleNewPairKeydown(event) {
            if (event.key === 'Enter') {
                spotAddNewPair();
            }
        }
        
        // 添加新交易对
        function spotAddNewPair() {
            const input = document.getElementById('newPairInput');
            const newPair = input.value.trim().toUpperCase();
            
            if (!newPair) {
                alert('请输入交易对名称');
                return;
            }
            
            if (!newPair.includes('/')) {
                alert('请输入正确格式，如: ATOM/USDT');
                return;
            }
            
            if (spotPairs.includes(newPair)) {
                alert('该交易对已在列表中');
                input.value = '';
                return;
            }
            
            // 添加到列表
            spotPairs.push(newPair);
            
            // 生成随机价格
            const randomPrice = (Math.random() * 100 + 1).toFixed(2);
            const assetName = newPair.split('/')[0];
            spotPairData[newPair] = {
                price: parseFloat(randomPrice),
                change: (Math.random() * 10 - 5).toFixed(2),
                base: 'USDT',
                asset: assetName
            };
            
            input.value = '';
            spotRenderSymbols();
            spotRenderPairList(document.getElementById('pairSearchInput').value);
            
            alert(`✅ 已添加新交易对: ${newPair}\n价格: $${randomPrice}`);
        }
        
        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            spotRenderSymbols();
            spotGenerateChartData();
            spotUpdateDisplay();
            spotInitOrders();
            
            // 暴露全局函数
            window.spotSelectSymbol = spotSelectSymbol;
            window.spotSetTimePeriod = spotSetTimePeriod;
            window.switchChartType = switchChartType;
            window.spotBuy = spotBuy;
            window.spotSell = spotSell;
            window.spotAddPair = spotAddPair;
            window.spotClosePairModal = spotClosePairModal;
            window.spotFilterPairList = spotFilterPairList;
            window.spotSelectNewPair = spotSelectNewPair;
            window.spotHandleNewPairKeydown = spotHandleNewPairKeydown;
            window.spotAddNewPair = spotAddNewPair;
            window.spotCancelOrder = spotCancelOrder;
            window.spotCloseOrder = spotCloseOrder;
            
            document.getElementById('pairModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    spotClosePairModal();
                }
            });
            
            // 模拟价格更新
            setInterval(() => {
                const volatility = 100;
                const change = (Math.random() - 0.5) * volatility * 2;
                spotBtcPrice = Math.max(10000, spotBtcPrice + change);
                spotBtcPrice = Math.round(spotBtcPrice * 100) / 100;
                
                spotChartData.push(spotBtcPrice);
                const maxPoints = periodDataPoints[spotCurrentPeriod] || 24;
                if (spotChartData.length > maxPoints) spotChartData.shift();
                
                spotUpdateChart();
                spotUpdateDisplay();
            }, 5000);
        });
    </script>
</body>
</html>
