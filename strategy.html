<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTC/USDT 交易界面（真实行情+完整指标+价格标签）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app { width: 100%; max-width: 390px; height: 100vh; background-color: #181a20; color: #eaecef; position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: 20px; box-shadow: 0 0 20px rgba(255,255,255,0.1); margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 9px 15px; height: 45px; }
        .header-left { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
        .header-left .pair-selector { cursor: pointer; }
        .header-icons { display: flex; gap: 15px; font-size: 18px; }
        .tabs { display: flex; justify-content: space-around; padding: 7px 15px; border-bottom: 1px solid #2b3139; }
        .tab { color: #848e9c; font-size: 14px; position: relative; cursor: pointer; }
        .tab.active { color: #f0b90b; }
        .tab.active::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; background: #f0b90b; border-radius: 2px; }
        .quote-section { display: flex; justify-content: space-between; padding: 9px 15px; }
        .price-main { font-size: 28px; font-weight: bold; }
        .price-sub { font-size: 12px; color: #848e9c; margin-top: 3px; }
        .price-sub span.green { color: #0ecb81; }
        .price-sub span.red { color: #f6465d; }
        .quote-details { font-size: 11px; color: #848e9c; text-align: right; line-height: 1.5; }
        .quote-details b { color: #eaecef; font-weight: normal; }
        .timeframes { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 7px; font-size: 12px; color: #848e9c; }
        .timeframes span.active { color: #eaecef; font-weight: bold; border-bottom: 2px solid #eaecef; padding-bottom: 4px; }
        .timeframes span { cursor: pointer; }
        .timeframes span:hover { color: #eaecef; }
        .chart-container { flex: 0 0 40.5vh; position: relative; background: #181a20; margin-top: -4px; }
        #kline { width: 100%; height: 100%; }
        .indicators { display: flex; gap: 15px; padding: 5px 15px; font-size: 12px; color: #848e9c; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; margin-top: 0; }
        .indicators::-webkit-scrollbar { display: none; }
        .indicators span { cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: all 0.2s; white-space: nowrap; }
        .indicators span.active { color: #f0b90b; background: rgba(240,185,11,0.1); }
        .indicators span:hover { color: #eaecef; }
        .performance { display: flex; justify-content: space-between; padding: 7px 15px; font-size: 12px; color: #848e9c; border-top: 1px solid #2b3139; }
        .perf-item span:last-child { margin-left: 5px; }
        .green { color: #0ecb81; }
        .red { color: #f6465d; }
        .order-book-bar { display: flex; align-items: center; padding: 7px 15px; font-size: 12px; font-weight: bold; }
        .sell-bar { width: 50%; background: #0ecb81; color: #181a20; text-align: center; padding: 4px 0; border-radius: 4px 0 0 4px; transition: width 0.5s; }
        .buy-bar { width: 50%; background: #f6465d; color: #181a20; text-align: center; padding: 4px 0; border-radius: 0 4px 4px 0; transition: width 0.5s; }
        .order-labels { display: flex; justify-content: space-around; font-size: 12px; color: #848e9c; padding: 5px 0; border-bottom: 1px solid #2b3139; }
        .order-labels span { cursor: pointer; padding: 5px 10px; border-radius: 4px; }
        .order-labels span:hover { background: #252535; color: #eaecef; }

        /* 底部浮动操作栏 */
        .bottom-action {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(24,26,32,0.95);
            border: 1px solid #2b3139;
            border-radius: 16px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.5);
            z-index: 40;
        }
        .tools { display: flex; gap: 15px; font-size: 12px; color: #848e9c; text-align: center; }
        .tools div { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .tools i { font-size: 16px; }
        .buy-btn, .sell-btn { flex: 1; text-align: center; padding: 9px 0; border-radius: 4px; font-size: 15px; font-weight: bold; color: #fff; cursor: pointer; }
        .buy-btn { background: #0ecb81; margin-right: 8px; }
        .sell-btn { background: #f6465d; }

        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; justify-content: flex-end; flex-direction: column; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #1a1a2a; border-radius: 16px 16px 0 0; width: 90%; margin: 0 auto; padding: 15px; animation: slideUp 0.3s ease; max-height: 70vh; display: flex; flex-direction: column; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-title { font-size: 16px; font-weight: bold; color: #fff; }
        .modal-close { cursor: pointer; color: #848e9c; font-size: 18px; }
        .modal-body { overflow-y: auto; flex: 1; }

        .order-list-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a3a; font-size: 12px; }
        .ask-text { color: #f6465d; }
        .bid-text { color: #0ecb81; }

        .pair-search { background: #0a0a12; border: 1px solid #2a2a3a; border-radius: 8px; padding: 10px 12px; color: #eaecef; font-size: 13px; outline: none; margin-bottom: 10px; }
        .pair-list { overflow-y: auto; flex: 1; }
        .pair-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid #2a2a3a; cursor: pointer; font-size: 14px; }
        .pair-item:hover { background: #252535; }

        .trade-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .trade-row label { width: 60px; font-size: 12px; color: #848e9c; }
        .trade-row input, .trade-row select { flex: 1; background: #0a0a12; border: 1px solid #2a2a3a; border-radius: 6px; padding: 8px 10px; color: #eaecef; font-size: 13px; outline: none; }

        /* 内联订单面板样式 */
        .order-inline-panel {
            max-height: 150px;
            overflow-y: auto;
            padding: 5px 15px;
            font-size: 12px;
            background: #181a20;
            border-bottom: 1px solid #2b3139;
            display: none; /* 默认隐藏，点击标签时显示 */
        }
        .order-inline-panel.show { display: block; }

        @media (min-width: 769px) {
            .app { max-width: 100%; border-radius: 0; box-shadow: none; width: 100%; }
            .chart-container { flex: 1; height: auto; min-height: 300px; }
            .bottom-action { left: 30px; right: 30px; }
            .quote-section, .timeframes, .indicators, .performance, .order-book-bar, .order-labels, .order-inline-panel { padding-left: 30px; padding-right: 30px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-left">
            <i class="icon">‹</i>
            <span class="pair-selector" id="pairSelectorBtn">BTC/USDT ▾</span>
            <div style="font-size:10px;color:#848e9c;" id="pairBaseAsset">Bitcoin</div>
        </div>
        <div class="header-icons"><i class="icon">✨</i><i class="icon">★</i><i class="icon">🔔</i></div>
    </div>
    <div class="tabs"><div class="tab">报价</div><div class="tab">信息</div><div class="tab">数据</div><div class="tab">广场</div><div class="tab active">交易</div></div>
    <div class="quote-section">
        <div>
            <div class="price-main" id="last-price">--</div>
            <div class="price-sub" id="cn-price">¥0.00 <span class="green">+0.00%</span></div>
            <div class="price-sub" style="font-size:11px;color:#848e9c;margin-top:8px;">支付 成交额 交易赛</div>
        </div>
        <div class="quote-details">
            <div>24h最高价 <b id="high-24">--</b></div>
            <div>24h最低价 <b id="low-24">--</b></div>
            <div>24h成交量(BTC) <b id="vol-24">--</b></div>
            <div>24h成交额(USDT) <b id="amount-24">--</b></div>
        </div>
    </div>
    <div class="timeframes" id="timeframes">
        <span data-interval="1m">分时</span><span data-interval="15m">15分</span><span data-interval="1h" class="active">1小时</span><span data-interval="4h">4小时</span><span data-interval="1d">日线</span><span>更多 ▾</span>
    </div>
    <div class="chart-container"><div id="kline"></div><div class="error-msg" id="kline-error">K线数据加载失败，请检查网络</div></div>
    <div class="indicators" id="indicator-buttons">
        <span class="active" data-indicator="MA">MA</span><span data-indicator="EMA">EMA</span><span data-indicator="BOLL">BOLL</span><span data-indicator="SAR">SAR</span><span data-indicator="AVL">AVL</span><span data-indicator="VOL">VOL</span><span data-indicator="MACD">MACD</span>
    </div>
    <div class="performance" id="performance">
        <div class="perf-item">今日 <span id="perf-today">--</span></div>
        <div class="perf-item">7天 <span id="perf-7d">--</span></div>
        <div class="perf-item">30天 <span id="perf-30d">--</span></div>
        <div class="perf-item">90天 <span id="perf-90d">--</span></div>
        <div class="perf-item">180天 <span id="perf-180d">--</span></div>
        <div class="perf-item">1年 <span id="perf-365d">--</span></div>
    </div>
    <div class="order-labels">
        <span onclick="openOrderPanel('delegate')">委托订单</span>
        <span onclick="openOrderPanel('depth')">深度</span>
        <span onclick="openOrderPanel('trades')">最新成交</span>
        <span onclick="openOrderPanel('network')">网络</span>
    </div>
    <div class="order-book-bar">
        <div class="sell-bar" id="sell-bar">--</div>
        <div class="buy-bar" id="buy-bar">--</div>
    </div>
    <!-- 内联订单面板，显示在买卖盘比例条下方 -->
    <div class="order-inline-panel" id="orderInlinePanel"></div>

    <div class="bottom-action">
        <div class="tools">
            <div><i class="icon">⋯</i>更多</div>
            <div><i class="icon">◧</i>工具</div>
            <div><i class="icon">⚖</i>杠杆</div>
        </div>
        <div style="display:flex;flex:1;margin-left:15px;">
            <button class="buy-btn" onclick="openTradeModal('buy')">买入</button>
            <button class="sell-btn" onclick="openTradeModal('sell')">卖出</button>
        </div>
    </div>

    <!-- 交易对选择弹窗 -->
    <div class="modal-overlay" id="pairModalOverlay">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">选择交易对</span><span class="modal-close" onclick="closePairModal()">✕</span></div>
            <input type="text" class="pair-search" id="pairSearchInput" placeholder="搜索交易对..." oninput="filterPairList()">
            <div class="pair-list" id="pairModalList"></div>
        </div>
    </div>

    <!-- 交易设置弹窗 -->
    <div class="modal-overlay" id="tradeModalOverlay">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title" id="tradeModalTitle">买入 BTC/USDT</span><span class="modal-close" onclick="closeTradeModal()">✕</span></div>
            <div class="trade-row"><label>订单类型</label><select id="tradeOrderType" onchange="toggleTradePriceInput()"><option value="market">市价单</option><option value="limit">限价单</option></select></div>
            <div class="trade-row" id="tradePriceRow"><label>价格</label><input type="number" id="tradePrice" placeholder="限价单价格" step="0.01"></div>
            <div class="trade-row"><label>数量</label><input type="number" id="tradeAmount" placeholder="数量" step="0.0001" min="0"></div>
            <div class="trade-row"><label>止盈价</label><input type="number" id="takeProfit" placeholder="止盈价格(可选)" step="0.01"></div>
            <div class="trade-row"><label>止损价</label><input type="number" id="stopLoss" placeholder="止损价格(可选)" step="0.01"></div>
            <div style="display:flex;gap:10px;margin-top:15px;">
                <button class="sell-btn" onclick="closeTradeModal()" style="background:#2a2a3a;">取消</button>
                <button class="buy-btn" onclick="confirmTrade()" style="background:#f0b90b;color:#181a20;">确认下单</button>
            </div>
        </div>
    </div>
</div>

<script>
    // =================== 常量 ===================
    const BASE_URL = 'https://api.gateio.ws/api/v4';
    const CNY_RATE = 7.2;
    let currentInterval = '1h';
    let currentPair = 'BTC_USDT';
    let currentSide = 'buy';
    const indicatorState = { MA: true, EMA: false, BOLL: false, SAR: false, AVL: false, VOL: false, MACD: false };
    let cache = { ticker: null, klines: null, orderBook: null };
    let allPairs = [];

    // =================== 技术指标计算库 ===================
    class Indicators {
        static SMA(data, period) { const result = new Array(data.length).fill(null); for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = i - period + 1; j <= i; j++) sum += data[j]; result[i] = sum / period; } return result; }
        static EMA(data, period) { const result = new Array(data.length).fill(null); const multiplier = 2 / (period + 1); result[0] = data[0]; for (let i = 1; i < data.length; i++) result[i] = (data[i] - result[i - 1]) * multiplier + result[i - 1]; return result; }
        static BOLL(data, period = 20, stdDev = 2) { const middle = this.SMA(data, period); const upper = new Array(data.length).fill(null); const lower = new Array(data.length).fill(null); for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = i - period + 1; j <= i; j++) sum += Math.pow(data[j] - middle[i], 2); const std = Math.sqrt(sum / period); upper[i] = middle[i] + stdDev * std; lower[i] = middle[i] - stdDev * std; } return { upper, middle, lower }; }
        static SAR(highs, lows, step = 0.02, maxStep = 0.2) { const result = new Array(highs.length).fill(null); let isUp = true; let sar = lows[0]; let ep = highs[0]; let af = step; for (let i = 1; i < highs.length; i++) { sar = sar + af * (ep - sar); if (isUp) { if (lows[i] < sar) { isUp = false; sar = ep; ep = lows[i]; af = step; } else { if (highs[i] > ep) { ep = highs[i]; af = Math.min(af + step, maxStep); } if (lows[i - 1] < sar) sar = lows[i - 1]; if (lows[i - 2] < sar) sar = lows[i - 2]; } } else { if (highs[i] > sar) { isUp = true; sar = ep; ep = highs[i]; af = step; } else { if (lows[i] < ep) { ep = lows[i]; af = Math.min(af + step, maxStep); } if (highs[i - 1] > sar) sar = highs[i - 1]; if (highs[i - 2] > sar) sar = highs[i - 2]; } } result[i] = sar; } return result; }
        static MACD(data, fast = 12, slow = 26, signal = 9) { const emaFast = this.EMA(data, fast); const emaSlow = this.EMA(data, slow); const dif = new Array(data.length).fill(null); for (let i = 0; i < data.length; i++) if (emaFast[i] !== null && emaSlow[i] !== null) dif[i] = emaFast[i] - emaSlow[i]; const validDif = dif.filter(v => v !== null); const deaValid = this.EMA(validDif, signal); const dea = new Array(data.length).fill(null); const offset = dif.length - deaValid.length; for (let i = 0; i < deaValid.length; i++) dea[offset + i] = deaValid[i]; const macd = new Array(data.length).fill(null); for (let i = 0; i < data.length; i++) if (dif[i] !== null && dea[i] !== null) macd[i] = (dif[i] - dea[i]) * 2; return { dif, dea, macd }; }
    }

    // =================== ECharts 初始化 ===================
    const chartDom = document.getElementById('kline');
    const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });
    let chartData = { dates: [], klines: [], volumes: [] };
    let visibleStart = 0, visibleEnd = 0;

    // =================== 工具函数 ===================
    function formatNum(num, decimals = 2) { const n = parseFloat(num); if (isNaN(n)) return '--'; return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
    function setColor(el, value) { el.className = value >= 0 ? 'green' : 'red'; }
    function formatPercent(value) { return (value >= 0 ? '+' : '') + value.toFixed(2) + '%'; }
    async function fetchWithTimeout(url, timeout = 8000) { const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), timeout); try { const res = await fetch(url, { signal: controller.signal, cache: 'no-store' }); if (!res.ok) throw new Error(`HTTP ${res.status}`); return await res.json(); } finally { clearTimeout(timer); } }

    // =================== 数据获取 ===================
    async function fetchTicker() { try { const data = await fetchWithTimeout(`${BASE_URL}/spot/tickers?currency_pair=${currentPair}`); if (!data || data.length === 0) throw new Error('空数据'); cache.ticker = data[0]; updateTickerUI(data[0]); if (chartData.klines.length) updateChart(); } catch (e) { console.error('Ticker失败:', e); if (cache.ticker) updateTickerUI(cache.ticker); } }
    function updateTickerUI(t) { const last = parseFloat(t.last); const change = parseFloat(t.change_percentage); document.getElementById('last-price').innerText = formatNum(last); const changeClass = change >= 0 ? 'green' : 'red'; document.getElementById('cn-price').innerHTML = `¥${formatNum(last * CNY_RATE)} <span class="${changeClass}">${formatPercent(change)}</span>`; document.getElementById('high-24').innerText = formatNum(t.high_24h); document.getElementById('low-24').innerText = formatNum(t.low_24h); document.getElementById('vol-24').innerText = formatNum(t.base_volume, 2); document.getElementById('amount-24').innerText = formatNum(t.quote_volume / 100000000, 2) + '亿'; const perfToday = document.getElementById('perf-today'); perfToday.innerText = formatPercent(change); setColor(perfToday, change); }
    async function fetchKline() { try { const data = await fetchWithTimeout(`${BASE_URL}/spot/candlesticks?currency_pair=${currentPair}&interval=${currentInterval}&limit=120`); if (!data || data.length === 0) throw new Error('空K线'); cache.klines = data; processKlineData(data); document.getElementById('kline-error').style.display = 'none'; } catch (e) { console.error('K线失败:', e); document.getElementById('kline-error').style.display = 'block'; } }
    function processKlineData(rawData) { const dates = [], klines = [], volumes = []; for (const item of rawData) { const open = parseFloat(item[5]); const close = parseFloat(item[2]); const low = parseFloat(item[4]); const high = parseFloat(item[3]); const vol = parseFloat(item[6]) || parseFloat(item[1]); klines.push([open, close, low, high]); volumes.push(vol); const d = new Date(parseInt(item[0]) * 1000); dates.push(currentInterval === '1d' ? `${d.getMonth() + 1}-${d.getDate()}` : `${d.getMonth() + 1}-${d.getDate()} ${d.getHours()}:00`); } chartData = { dates, klines, volumes }; updateChart(); }
    async function fetchOrderBook() { try { const data = await fetchWithTimeout(`${BASE_URL}/spot/order_book?currency_pair=${currentPair}&limit=20`); if (!data) throw new Error('空订单簿'); cache.orderBook = data; updateOrderBookUI(data); } catch (e) { console.error('订单簿失败:', e); if (cache.orderBook) updateOrderBookUI(cache.orderBook); } }
    function updateOrderBookUI(data) { let askVol = 0, bidVol = 0; for (const a of (data.asks || [])) askVol += parseFloat(a[1]); for (const b of (data.bids || [])) bidVol += parseFloat(b[1]); const total = askVol + bidVol; if (total === 0) return; const bidPct = (bidVol / total) * 100; const askPct = 100 - bidPct; document.getElementById('sell-bar').style.width = askPct + '%'; document.getElementById('buy-bar').style.width = bidPct + '%'; document.getElementById('sell-bar').innerText = '卖 ' + askPct.toFixed(1) + '%'; document.getElementById('buy-bar').innerText = '买 ' + bidPct.toFixed(1) + '%'; }
    async function fetchPeriodChanges() { const periods = [{ id: 'perf-today', days: 1 }, { id: 'perf-7d', days: 7 }, { id: 'perf-30d', days: 30 }, { id: 'perf-90d', days: 90 }, { id: 'perf-180d', days: 180 }, { id: 'perf-365d', days: 365 }]; try { let currentPrice; if (cache.ticker) currentPrice = parseFloat(cache.ticker.last); else { const td = await fetchWithTimeout(`${BASE_URL}/spot/tickers?currency_pair=${currentPair}`); currentPrice = parseFloat(td[0].last); } for (const p of periods) { try { const now = Math.floor(Date.now() / 1000); const from = now - p.days * 86400; const resp = await fetchWithTimeout(`${BASE_URL}/spot/candlesticks?currency_pair=${currentPair}&interval=1d&from=${from}&to=${now}&limit=1`); if (resp && resp.length > 0) { const oldClose = parseFloat(resp[0][2]); const change = ((currentPrice - oldClose) / oldClose) * 100; const el = document.getElementById(p.id); el.innerText = formatPercent(change); setColor(el, change); } } catch (err) {} } } catch (e) {} }

    // =================== 交易对弹窗 ===================
    async function openPairModal() { document.getElementById('pairModalOverlay').classList.add('show'); if (allPairs.length === 0) { try { const data = await fetchWithTimeout(`${BASE_URL}/spot/currency_pairs`); allPairs = data.map(p => p.id); } catch (e) { allPairs = ['BTC_USDT','ETH_USDT','SOL_USDT','ARB_USDT','DOGE_USDT','BNB_USDT','XRP_USDT','LTC_USDT']; } } renderPairList(''); }
    function closePairModal() { document.getElementById('pairModalOverlay').classList.remove('show'); }
    function filterPairList() { const search = document.getElementById('pairSearchInput').value.trim().toUpperCase(); renderPairList(search); }
    function renderPairList(search) { const list = document.getElementById('pairModalList'); let filtered = allPairs; if (search) filtered = allPairs.filter(p => p.includes(search)); filtered = filtered.filter(p => p.endsWith('_USDT')).slice(0, 100); if (filtered.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">无匹配交易对</div>'; return; } list.innerHTML = filtered.map(pair => { const display = pair.replace('_', '/'); return `<div class="pair-item" onclick="selectPair('${pair}')"><span class="symbol">${display}</span></div>`; }).join(''); }
    async function selectPair(pair) { currentPair = pair; closePairModal(); document.getElementById('pairSelectorBtn').innerText = pair.replace('_', '/') + ' ▾'; document.getElementById('pairBaseAsset').innerText = pair.split('_')[0]; await refreshAll(); }
    document.getElementById('pairSelectorBtn').addEventListener('click', openPairModal);
    document.getElementById('pairModalOverlay').addEventListener('click', function(e) { if (e.target === this) closePairModal(); });

    // =================== 交易弹窗 ===================
    function openTradeModal(side) { currentSide = side; document.getElementById('tradeModalTitle').innerText = (side === 'buy' ? '买入' : '卖出') + ' ' + currentPair.replace('_', '/'); document.getElementById('tradeOrderType').value = 'market'; document.getElementById('tradePrice').value = ''; document.getElementById('tradeAmount').value = ''; document.getElementById('takeProfit').value = ''; document.getElementById('stopLoss').value = ''; toggleTradePriceInput(); document.getElementById('tradeModalOverlay').classList.add('show'); }
    function closeTradeModal() { document.getElementById('tradeModalOverlay').classList.remove('show'); }
    function toggleTradePriceInput() { document.getElementById('tradePriceRow').style.display = document.getElementById('tradeOrderType').value === 'limit' ? 'flex' : 'none'; }
    function confirmTrade() { const type = document.getElementById('tradeOrderType').value; const price = parseFloat(document.getElementById('tradePrice').value); const amount = parseFloat(document.getElementById('tradeAmount').value); const takeProfit = parseFloat(document.getElementById('takeProfit').value); const stopLoss = parseFloat(document.getElementById('stopLoss').value); if (!amount || amount <= 0) { alert('请输入有效数量'); return; } if (type === 'limit' && (!price || price <= 0)) { alert('请输入有效限价价格'); return; } alert(`模拟${currentSide === 'buy' ? '买入' : '卖出'}订单：\n交易对：${currentPair}\n类型：${type === 'market' ? '市价' : '限价'}\n数量：${amount}\n${type === 'limit' ? '价格：' + price : ''}\n止盈：${takeProfit || '未设置'}\n止损：${stopLoss || '未设置'}`); closeTradeModal(); }

    // =================== 内联订单面板数据 ===================
    async function openOrderPanel(type) {
        const panel = document.getElementById('orderInlinePanel');
        panel.classList.add('show');
        panel.innerHTML = '加载中...';
        try {
            let html = '';
            if (type === 'delegate' || type === 'depth') {
                const data = await fetchWithTimeout(`${BASE_URL}/spot/order_book?currency_pair=${currentPair}&limit=20`);
                if (!data || typeof data !== 'object') throw new Error('订单簿数据无效');
                html = '<div style="display:flex;gap:10px;">';
                html += '<div style="flex:1;"><div style="color:#f6465d;font-weight:bold;">卖盘</div>';
                (data.asks || []).slice(0,10).forEach(a => { html += `<div class="order-list-item"><span class="ask-text">${formatNum(parseFloat(a[0]))}</span><span>${parseFloat(a[1]).toFixed(6)}</span></div>`; });
                html += '</div><div style="flex:1;"><div style="color:#0ecb81;font-weight:bold;">买盘</div>';
                (data.bids || []).slice(0,10).forEach(b => { html += `<div class="order-list-item"><span class="bid-text">${formatNum(parseFloat(b[0]))}</span><span>${parseFloat(b[1]).toFixed(6)}</span></div>`; });
                html += '</div></div>';
                panel.innerHTML = html || '<div style="text-align:center;padding:10px;color:#888;">暂无深度数据</div>';
            } else if (type === 'trades') {
                const data = await fetchWithTimeout(`${BASE_URL}/spot/trades?currency_pair=${currentPair}&limit=30`);
                if (!Array.isArray(data)) throw new Error('成交数据无效');
                data.forEach(t => {
                    const side = t.side === 'buy' ? '<span class="bid-text">买入</span>' : '<span class="ask-text">卖出</span>';
                    const time = new Date(parseInt(t.create_time) * 1000).toLocaleTimeString();
                    html += `<div class="order-list-item">${side} ${formatNum(parseFloat(t.price))} × ${parseFloat(t.amount).toFixed(6)} <span style="color:#555;">${time}</span></div>`;
                });
                panel.innerHTML = html || '<div style="text-align:center;padding:10px;color:#888;">暂无成交记录</div>';
            } else if (type === 'network') {
                panel.innerHTML = '<div style="text-align:center;padding:10px;color:#888;">网络状态：正常，延迟 20ms</div>';
            }
        } catch(e) {
            console.error('订单面板数据获取失败:', e);
            panel.innerHTML = '<div style="text-align:center;padding:10px;color:#f6465d;">数据获取失败，请检查网络或稍后重试</div>';
        }
    }

    // =================== 图表更新（保持原逻辑，仅显示当前修改所需部分） ===================
    function updateChart() {
        // ... 原有图表更新代码保持不变 ...
    }

    // =================== 指标按钮切换 ===================
    document.getElementById('indicator-buttons').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-indicator]');
        if (!span) return;
        const key = span.dataset.indicator;
        indicatorState[key] = !indicatorState[key];
        span.classList.toggle('active', indicatorState[key]);
        updateChart();
    });

    // =================== 时间周期切换 ===================
    document.getElementById('timeframes').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-interval]');
        if (!span) return;
        document.querySelectorAll('#timeframes span[data-interval]').forEach(s => s.classList.remove('active'));
        span.classList.add('active');
        currentInterval = span.dataset.interval;
        fetchKline();
    });

    // =================== 启动与定时刷新 ===================
    async function refreshAll() {
        await Promise.all([fetchTicker(), fetchKline(), fetchOrderBook()]);
        fetchPeriodChanges();
    }
    document.addEventListener('DOMContentLoaded', refreshAll);
    setInterval(() => { fetchTicker(); fetchKline(); fetchOrderBook(); }, 10000);
    setInterval(fetchPeriodChanges, 60000);
    window.addEventListener('resize', () => myChart.resize());

    // 暴露全局函数
    window.selectPair = selectPair;
    window.closePairModal = closePairModal;
    window.filterPairList = filterPairList;
    window.openTradeModal = openTradeModal;
    window.closeTradeModal = closeTradeModal;
    window.toggleTradePriceInput = toggleTradePriceInput;
    window.confirmTrade = confirmTrade;
    window.openOrderPanel = openOrderPanel;
</script>
</body>
</html>
