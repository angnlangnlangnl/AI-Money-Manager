<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>启动页 - AI 金融助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 启动页容器 */
        #splashContainer {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #splashContainer.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        .splash-slide {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 32px;
            text-align: center;
            min-height: 70vh;
        }
        .splash-icon {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 28px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.3);
        }
        .splash-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .splash-desc {
            font-size: 16px;
            color: #9ca3af;
            line-height: 1.7;
            max-width: 320px;
        }
        .splash-highlight {
            color: #fbbf24;
            font-weight: 600;
        }
        .splash-badge {
            display: inline-block;
            background: #1e293b;
            color: #94a3b8;
            font-size: 12px;
            padding: 4px 16px;
            border-radius: 20px;
            margin-top: 16px;
            border: 1px solid #334155;
        }
        .splash-stats {
            display: flex;
            gap: 24px;
            margin-top: 20px;
        }
        .splash-stats .stat {
            text-align: center;
        }
        .splash-stats .stat .num {
            font-size: 24px;
            font-weight: 700;
            color: #e8e8f0;
        }
        .splash-stats .stat .label {
            font-size: 12px;
            color: #6b7280;
        }
        .splash-footer {
            padding: 20px 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: linear-gradient(to top, #0a0a0f 60%, transparent);
        }
        .splash-dots {
            display: flex;
            gap: 10px;
        }
        .splash-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a2a3a;
            transition: all 0.3s;
            cursor: pointer;
        }
        .splash-dots .dot.active {
            background: #3b82f6;
            width: 28px;
            border-radius: 6px;
        }
        .splash-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            font-weight: 600;
            font-size: 18px;
            padding: 14px 48px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
            width: 100%;
            max-width: 300px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .splash-btn:active {
            transform: scale(0.96);
        }
        .splash-skip {
            color: #6b7280;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 12px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .splash-skip:active {
            color: #9ca3af;
        }
        .slide-enter {
            animation: slideUp 0.5s ease forwards;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="splashContainer">
        <div id="splashSlides" class="flex-1 relative overflow-hidden">
            <!-- 第1屏 -->
            <div class="splash-slide slide-enter" data-index="0">
                <div class="splash-icon">🧠</div>
                <div class="splash-title">你的 AI 金融管家</div>
                <div class="splash-desc">
                    把你的加密资产交给 AI，<br>
                    它替你 <span class="splash-highlight">24/7 智能管理</span>，<br>
                    让你真正实现 <span class="splash-highlight">「睡后收入」</span>
                </div>
                <div class="splash-stats">
                    <div class="stat"><div class="num">47%</div><div class="label">平均收益提升</div></div>
                    <div class="stat"><div class="num">99.6%</div><div class="label">风险拦截率</div></div>
                </div>
                <div class="splash-badge">已保护 12,000+ 钱包</div>
            </div>
            <!-- 第2屏 -->
            <div class="splash-slide" data-index="1" style="display:none;">
                <div class="splash-icon">⚡</div>
                <div class="splash-title">能力全开，一键搞定</div>
                <div class="splash-desc" style="max-width:340px;">
                    <strong style="color:#60a5fa;">收益优化</strong> · 自动扫链，存入最高 APY 协议<br>
                    <strong style="color:#60a5fa;">风险守护</strong> · 拦截钓鱼，预警清算<br>
                    <strong style="color:#60a5fa;">持仓分析</strong> · 跨链汇总，一目了然<br>
                    <strong style="color:#60a5fa;">AI 自动化</strong> · 你睡觉，它打工
                </div>
                <div class="splash-badge">支持 Ethereum · Solana · Arbitrum 等</div>
            </div>
            <!-- 第3屏 -->
            <div class="splash-slide" data-index="2" style="display:none;">
                <div class="splash-icon">🚀</div>
                <div class="splash-title">立即开启智能管理</div>
                <div class="splash-desc">
                    3 分钟设置，AI 即刻为你工作。<br>
                    <span class="splash-highlight">首周免费体验</span>，不满意随时取消。
                </div>
                <div style="margin-top:24px; display:flex; gap:16px; flex-wrap:wrap; justify-content:center;">
                    <span style="background:#1e293b; padding:6px 18px; border-radius:30px; font-size:13px; color:#94a3b8;">非托管 · 私钥自持</span>
                    <span style="background:#1e293b; padding:6px 18px; border-radius:30px; font-size:13px; color:#94a3b8;">手机 / 网页 通用</span>
                </div>
                <div class="splash-badge">7 天免费试用 · 随时取消</div>
            </div>
        </div>
        <div class="splash-footer">
            <div class="splash-dots" id="splashDots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
            <button class="splash-btn" id="splashBtn">开始使用</button>
            <button class="splash-skip" id="splashSkip">跳过介绍</button>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('splashContainer');
            const slides = document.querySelectorAll('.splash-slide');
            const dots = document.querySelectorAll('.dot');
            const btn = document.getElementById('splashBtn');
            const skipBtn = document.getElementById('splashSkip');
            let current = 0;
            const total = slides.length;

            function showSlide(index) {
                slides.forEach((el, i) => {
                    el.style.display = i === index ? 'flex' : 'none';
                    el.classList.remove('slide-enter');
                    if (i === index) {
                        requestAnimationFrame(() => {
                            el.classList.add('slide-enter');
                        });
                    }
                });
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
                if (index === total - 1) {
                    btn.textContent = '立即开始';
                } else {
                    btn.textContent = '下一步';
                }
                current = index;
            }

            function enterApp() {
                container.classList.add('hide');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);
            }

            function nextSlide() {
                const next = (current + 1) % total;
                showSlide(next);
            }

            function prevSlide() {
                const prev = (current - 1 + total) % total;
                showSlide(prev);
            }

            dots.forEach((dot) => {
                dot.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (idx !== current) showSlide(idx);
                });
            });

            btn.addEventListener('click', function() {
                if (current === total - 1) {
                    enterApp();
                } else {
                    nextSlide();
                }
            });

            skipBtn.addEventListener('click', function() {
                enterApp();
            });

            let startX = 0;
            let startY = 0;
            container.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });
            container.addEventListener('touchend', function(e) {
                if (startX === 0) return;
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const diffX = startX - endX;
                const diffY = startY - endY;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                    if (diffX > 0) nextSlide();
                    else prevSlide();
                }
                startX = 0;
            });

            showSlide(0);
        })();
    </script>
</body>
</html>
