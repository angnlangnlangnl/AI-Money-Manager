<!DOCTYPE html>
<html lang="zh-CN">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        }

            margin-bottom: 16px;

        /* 信号指示 */

            font-weight: 600;

            color: #6a6a7a;

            color: #10b981;
        }

    </style>
</head>
<body>
    <div class="grid-container">
        <!-- 返回按钮 -->
        <a class="back-btn" href="index.html" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </a>

        <!-- 顶部标题 -->
        <div class="page-header">
            <span class="title">📊 网格量化交易策略</span>
            <div class="current-price-info">
                <span class="price" id="gridCurrentPrice">$65,432.10</span>
                <span class="change" id="gridPriceChange" style="color:#10b981;">+3.21%</span>
            </div>
        </div>

        <!-- 策略选择标签 -->
        <div class="strategy-tabs" id="strategyTabs">
            <span class="strategy-tab active" data-strategy="rsi" onclick="switchStrategy('rsi')">RSI网格</span>
            <span class="strategy-tab" data-strategy="bollinger" onclick="switchStrategy('bollinger')">布林带网格</span>
            <span class="strategy-tab" data-strategy="ema" onclick="switchStrategy('ema')">EMA趋势网格</span>
            <span class="strategy-tab" data-strategy="kdj" onclick="switchStrategy('kdj')">KDJ网格</span>
            <span class="strategy-tab" data-strategy="macd" onclick="switchStrategy('macd')">MACD网格</span>
            <span class="strategy-tab" data-strategy="multi" onclick="switchStrategy('multi')">多周期网格</span>
        </div>

        <!-- 策略内容区域 -->
        <div id="strategyContent">
            <!-- 由JS动态渲染 -->
        </div>

        <!-- 交易日志 -->
        <div class="card">
            <div class="card-title">📋 交易日志</div>
            <div class="log-box" id="gridLogBox">[系统] 网格策略已初始化，等待价格数据...</div>
        </div>
    </div>

    <script>
        // ============================================================
        //  网格策略核心逻辑
        // ============================================================
        
        // 全局状态
        let currentStrategy = 'rsi';
        let gridUsdtBalance = 10000;
        let gridBtcBalance = 0;
        let gridBtcPrice = 65432.10;
        let gridRunning = false;
        let gridInterval = null;
        let gridLogEntries = [];
        let priceHistory = [];
        let gridOrders = [];
        let strategyParams = {};

        // 策略参数配置
        const strategyConfigs = {
            rsi: {
                name: 'RSI网格策略',
                description: '基于RSI超买超卖信号的网格交易',
                params: {
                    rsiPeriod: { label: 'RSI周期', value: 14, min: 5, max: 30 },
                    oversold: { label: '超卖阈值', value: 30, min: 10, max: 40 },
                    overbought: { label: '超买阈值', value: 70, min: 60, max: 90 },
                    gridSpacing: { label: '网格间距(%)', value: 2, min: 0.5, max: 5 },
                    positionSize: { label: '单格仓位(%)', value: 10, min: 5, max: 20 }
                },
                signals: ['超卖买入', '超买卖出', '中性持有']
            },
            bollinger: {
                name: '布林带网格策略',
                description: '基于布林带上下轨的均值回归网格',
                params: {
                    bbPeriod: { label: '布林带周期', value: 20, min: 10, max: 50 },
                    stdDev: { label: '标准差倍数', value: 2, min: 1, max: 3 },
                    gridSpacing: { label: '网格间距(%)', value: 1.5, min: 0.5, max: 4 },
                    positionSize: { label: '单格仓位(%)', value: 8, min: 5, max: 15 }
                },
                signals: ['下轨买入', '上轨卖出', '中轨平仓']
            },
            ema: {
                name: 'EMA趋势网格策略',
                description: 'EMA趋势过滤+动态网格',
                params: {
                    emaShort: { label: 'EMA短期', value: 20, min: 5, max: 50 },
                    emaLong: { label: 'EMA长期', value: 50, min: 20, max: 200 },
                    gridSpacing: { label: '网格间距(%)', value: 2, min: 0.5, max: 5 },
                    positionSize: { label: '单格仓位(%)', value: 10, min: 5, max: 20 },
                    stopLoss: { label: '止损(%)', value: 5, min: 2, max: 10 }
                },
                signals: ['金叉买入', '死叉卖出', '趋势过滤']
            },
            kdj: {
                name: 'KDJ网格策略',
                description: 'KDJ指标+网格交易',
                params: {
                    kdjPeriod: { label: 'KDJ周期', value: 9, min: 5, max: 20 },
                    kParam: { label: 'K值参数', value: 3, min: 2, max: 5 },
                    dParam: { label: 'D值参数', value: 3, min: 2, max: 5 },
                    gridSpacing: { label: '网格间距(%)', value: 2, min: 0.5, max: 5 },
                    positionSize: { label: '单格仓位(%)', value: 8, min: 5, max: 15 }
                },
                signals: ['K上穿D买入', 'K下穿D卖出', 'J值超买超卖']
            },
            macd: {
                name: 'MACD网格策略',
                description: 'MACD趋势判断+网格执行',
                params: {
                    fastPeriod: { label: '快线周期', value: 12, min: 5, max: 30 },
                    slowPeriod: { label: '慢线周期', value: 26, min: 10, max: 50 },
                    signalPeriod: { label: '信号周期', value: 9, min: 3, max: 20 },
                    gridSpacing: { label: '网格间距(%)', value: 2, min: 0.5, max: 5 },
                    positionSize: { label: '单格仓位(%)', value: 10, min: 5, max: 20 }
                },
                signals: ['MACD金叉买入', 'MACD死叉卖出', '柱状图缩量']
            },
            multi: {
                name: '多周期网格策略',
                description: '多重时间框架+网格交易',
                params: {
                    trendPeriod: { label: '趋势周期(小时)', value: 4, min: 1, max: 24 },
                    gridPeriod: { label: '网格周期(分钟)', value: 15, min: 5, max: 60 },
                    gridSpacing: { label: '网格间距(%)', value: 1.5, min: 0.5, max: 4 },
                    positionSize: { label: '单格仓位(%)', value: 8, min: 5, max: 15 },
                    maxPositions: { label: '最大持仓(%)', value: 60, min: 30, max: 80 }
                },
                signals: ['4H趋势判断', '1H网格区间', '15M执行']
            }
        };

        // 计算RSI
        function calculateRSI(data, period) {
            if (data.length < period + 1) return null;
            let gains = 0;
            let losses = 0;
            for (let i = data.length - period; i < data.length; i++) {
                const diff = data[i] - data[i - 1];
                if (diff > 0) gains += diff;
                else losses -= diff;
            }
            if (losses === 0) return 100;
            const rs = gains / losses;
            return 100 - (100 / (1 + rs));
        }

        // 计算EMA
        function calculateEMA(data, period) {
            if (data.length < period) return null;
            const k = 2 / (period + 1);
            let ema = data[0];
            for (let i = 1; i < data.length; i++) {
                ema = data[i] * k + ema * (1 - k);
            }
            return ema;
        }

        // 计算布林带
        function calculateBollinger(data, period, stdDev) {
            if (data.length < period) return null;
            const slice = data.slice(-period);
            const mean = slice.reduce((a, b) => a + b, 0) / period;
            const variance = slice.reduce((a, b) => a + (b - mean) ** 2, 0) / period;
            const std = Math.sqrt(variance);
            return {
                upper: mean + stdDev * std,
                middle: mean,
                lower: mean - stdDev * std
            };
        }

        // 计算KDJ
        function calculateKDJ(data, period) {
            if (data.length < period) return null;
            const highs = data.slice(-period);
            const lows = data.slice(-period);
            const highest = Math.max(...highs);
            const lowest = Math.min(...lows);
            const current = data[data.length - 1];
            const rsv = ((current - lowest) / (highest - lowest)) * 100;
            return {
                k: rsv,
                d: rsv * 0.7,
                j: rsv * 3 - rsv * 0.7 * 2
            };
        }

        // 计算MACD
        function calculateMACD(data, fast, slow, signal) {
            if (data.length < slow + signal) return null;
            const fastEMA = calculateEMA(data, fast);
            const slowEMA = calculateEMA(data, slow);
            const macdLine = fastEMA - slowEMA;
            const signalLine = macdLine * 0.8;
            return {
                macd: macdLine,
                signal: signalLine,
                histogram: macdLine - signalLine
            };
        }

        // 生成网格订单
        function generateGridOrders(spacing, count, currentPrice) {
            const orders = [];
            for (let i = 0; i < count; i++) {
                const buyPrice = currentPrice * (1 - (i + 1) * spacing / 100);
                const sellPrice = currentPrice * (1 + (i + 1) * spacing / 100);
                orders.push({
                    type: 'buy',
                    price: buyPrice,
                    status: 'pending',
                    amount: 0
                });
                orders.push({
                    type: 'sell',
                    price: sellPrice,
                    status: 'pending',
                    amount: 0
                });
            }
            return orders;
        }

        // 添加日志
        function gridAddLog(msg) {
            const time = new Date().toLocaleTimeString();
            const entry = `[${time}] ${msg}`;
            gridLogEntries.push(entry);
            if (gridLogEntries.length > 100) gridLogEntries.shift();
            const box = document.getElementById('gridLogBox');
            if (box) box.textContent = gridLogEntries.join('\n');
            if (box) box.scrollTop = box.scrollHeight;
        }

        // 切换策略
        function switchStrategy(strategy) {
            currentStrategy = strategy;
            document.querySelectorAll('.strategy-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.strategy === strategy);
            });
            renderStrategyContent();
            gridAddLog(`📊 切换至${strategyConfigs[strategy].name}`);
        }

        // 渲染策略内容
        function renderStrategyContent() {
            const config = strategyConfigs[currentStrategy];
            const container = document.getElementById('strategyContent');
            
            let html = `
                <!-- 策略说明 -->
                <div class="card">
                    <div class="card-title">
                        <span>${config.name}</span>
                        <span class="badge">${currentStrategy.toUpperCase()}</span>
                    </div>
                    <p style="font-size:13px;color:#9ca3af;margin-bottom:12px;">${config.description}</p>
                    <div class="signal-indicator">
                        ${config.signals.map(s => `<span class="signal-badge">${s}</span>`).join('')}
                    </div>
                </div>

                <!-- 参数设置 -->
                <div class="card">
                    <div class="card-title">⚙️ 参数设置</div>
                    ${Object.entries(config.params).map(([key, param]) => `
                        <div class="param-row">
                            <span class="param-label">${param.label}</span>
                            <input type="number" class="param-input" 
                                id="param_${key}" 
                                value="${param.value}" 
                                min="${param.min}" 
                                max="${param.max}" 
                                step="0.1">
                        </div>
                    `).join('')}
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="startGridStrategy()">▶ 启动策略</button>
                        <button class="btn btn-secondary" onclick="stopGridStrategy()">⏹ 停止</button>
                    </div>
                </div>

                <!-- 账户信息 -->
                <div class="card">
                    <div class="card-title">💰 账户信息</div>
                    <div class="account-row">
                        <span class="label">总资产</span>
                        <span class="value" id="gridTotalBalance">$10,000.00</span>
                    </div>
                    <div class="account-row">
                        <span class="label">USDT 余额</span>
                        <span class="value" id="gridUsdtBalance">10,000.00</span>
                    </div>
                    <div class="account-row">
                        <span class="label">BTC 持仓</span>
                        <span class="value" id="gridBtcBalance">0.0000</span>
                    </div>
                    <div class="account-row">
                        <span class="label">总盈亏</span>
                        <span class="value green" id="gridTotalPnl">+$0.00</span>
                    </div>
                    <div class="status-indicator" style="margin-top:12px;">

                    </div>
                </div>

                <!-- 价格图表 -->
                <div class="card">
                    <div class="card-title">📈 价格走势</div>
                    <div class="chart-wrapper">
                        <canvas id="gridPriceChart"></canvas>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            
            // 初始化图表
            initGridChart();
            updateGridDisplay();
        }

        // 生成网格可视化
        function generateGridVisual() {
            const config = strategyConfigs[currentStrategy];
            const spacing = config.params.gridSpacing ? config.params.gridSpacing.value : 2;
            const currentPrice = gridBtcPrice;
            let html = '';
            
            for (let i = 4; i >= 1; i--) {
                const sellPrice = currentPrice * (1 + i * spacing / 100);
                html += `
                    <div class="grid-row sell">
                        <span style="color:#ef4444;font-size:10px;">卖出${i}</span>
                        <span class="grid-price">$${sellPrice.toFixed(2)}</span>
                        <span class="grid-status pending">待触发</span>
                    </div>
                `;
            }
            
            html += `
                <div class="grid-row" style="border-left:3px solid #3b82f6;">
                    <span style="color:#3b82f6;font-size:10px;">当前</span>
                    <span class="grid-price">$${currentPrice.toFixed(2)}</span>
                    <span class="grid-status" style="background:#1a2a3a;color:#3b82f6;">基准价</span>
                </div>
            `;
            
            for (let i = 1; i <= 4; i++) {
                const buyPrice = currentPrice * (1 - i * spacing / 100);
                html += `
                    <div class="grid-row buy">
                        <span style="color:#10b981;font-size:10px;">买入${i}</span>
                        <span class="grid-price">$${buyPrice.toFixed(2)}</span>
                        <span class="grid-status pending">待触发</span>
                    </div>
                `;
            }
            
            return html;
        }

        // 初始化图表
        function initGridChart() {
            const canvas = document.getElementById('gridPriceChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const initialData = [];
            let current = gridBtcPrice * 0.97;
            for (let i = 0; i < 30; i++) {
                current += (Math.random() - 0.5) * 200;
                initialData.push(Math.round(current * 100) / 100);
            }
            
            if (window.gridChart) {
                window.gridChart.destroy();
            }
            
            window.gridChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(30).fill(''),
                    datasets: [{
                        label: '价格',
                        data: initialData,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59,130,246,0.1)',
                        fill: true,
                        tension: 0.2,
                        pointRadius: 0,
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return '$' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            ticks: {
                                color: '#6a6a7a',
                                callback: function(value) { return '$' + value.toFixed(0); }
                            },
                            grid: { color: '#1a1a2a' }
                        }
                    }
                }
            });
        }

        // 更新显示
        function updateGridDisplay() {
            const total = gridUsdtBalance + gridBtcBalance * gridBtcPrice;
            const pnl = total - 10000;
            
            document.getElementById('gridCurrentPrice').textContent = '$' + gridBtcPrice.toFixed(2);
            document.getElementById('gridTotalBalance').textContent = '$' + total.toFixed(2);
            document.getElementById('gridUsdtBalance').textContent = gridUsdtBalance.toFixed(2);
            document.getElementById('gridBtcBalance').textContent = gridBtcBalance.toFixed(4);
            
            const pnlEl = document.getElementById('gridTotalPnl');
            if (pnlEl) {
                pnlEl.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
                pnlEl.className = 'value ' + (pnl >= 0 ? 'green' : 'red');
            }
        }

        // 启动策略
        function startGridStrategy() {
            if (gridRunning) return;
            gridRunning = true;
            
            const dot = document.getElementById('gridStatusDot');
            const statusText = document.getElementById('gridStatusText');
            if (dot) dot.classList.add('active');
            if (statusText) statusText.textContent = '策略运行中';
            
            gridAddLog(`▶️ ${strategyConfigs[currentStrategy].name}已启动`);
            
            // 模拟价格更新
            gridInterval = setInterval(() => {
                const volatility = 100;
                const change = (Math.random() - 0.5) * volatility * 2;
                gridBtcPrice = Math.max(10000, gridBtcPrice + change);
                gridBtcPrice = Math.round(gridBtcPrice * 100) / 100;
                
                priceHistory.push(gridBtcPrice);
                if (priceHistory.length > 200) priceHistory.shift();
                
                updateGridDisplay();
                executeGridLogic();
                
                // 更新图表
                if (window.gridChart) {
                    window.gridChart.data.datasets[0].data.push(gridBtcPrice);
                    window.gridChart.data.datasets[0].data.shift();
                    window.gridChart.update();
                }
            }, 3000);
        }

        // 停止策略
        function stopGridStrategy() {
            if (!gridRunning) return;
            gridRunning = false;
            
            if (gridInterval) {
                clearInterval(gridInterval);
                gridInterval = null;
            }
            
            const dot = document.getElementById('gridStatusDot');
            const statusText = document.getElementById('gridStatusText');
            if (dot) dot.classList.remove('active');
            if (statusText) statusText.textContent = '策略已停止';
            
            gridAddLog('⏹️ 策略已停止');
        }

        // 执行网格逻辑
        function executeGridLogic() {
            const config = strategyConfigs[currentStrategy];
            
            switch (currentStrategy) {
                case 'rsi':
                    executeRSIGrid(config.params);
                    break;
                case 'bollinger':
                    executeBollingerGrid(config.params);
                    break;
                case 'ema':
                    executeEMAGrid(config.params);
                    break;
                case 'kdj':
                    executeKDJGrid(config.params);
                    break;
                case 'macd':
                    executeMACDGrid(config.params);
                    break;
                case 'multi':
                    executeMultiGrid(config.params);
                    break;
            }
        }

        // RSI网格执行
        function executeRSIGrid(params) {
            const rsiPeriod = parseInt(document.getElementById('param_rsiPeriod')?.value || params.rsiPeriod.value);
            const oversold = parseFloat(document.getElementById('param_oversold')?.value || params.oversold.value);
            const overbought = parseFloat(document.getElementById('param_overbought')?.value || params.overbought.value);
            const spacing = parseFloat(document.getElementById('param_gridSpacing')?.value || params.gridSpacing.value);
            const positionSize = parseFloat(document.getElementById('param_positionSize')?.value || params.positionSize.value);
            
            const rsi = calculateRSI(priceHistory, rsiPeriod);
            if (rsi === null) return;
            
            if (rsi < oversold && gridUsdtBalance > 100) {
                const buyAmount = Math.min(gridUsdtBalance * positionSize / 100, 500);
                const quantity = buyAmount / gridBtcPrice;
                if (quantity > 0.001) {
                    gridBtcBalance += quantity;
                    gridUsdtBalance -= buyAmount;
                    gridAddLog(`📈 RSI=${rsi.toFixed(1)} 超卖，买入 ${quantity.toFixed(6)} BTC`);
                }
            } else if (rsi > overbought && gridBtcBalance > 0.001) {
                const sellQuantity = gridBtcBalance * positionSize / 100;
                if (sellQuantity > 0.001) {
                    const sellAmount = sellQuantity * gridBtcPrice;
                    gridBtcBalance -= sellQuantity;
                    gridUsdtBalance += sellAmount;
                    gridAddLog(`📉 RSI=${rsi.toFixed(1)} 超买，卖出 ${sellQuantity.toFixed(6)} BTC`);
                }
            }
        }

        // 布林带网格执行
        function executeBollingerGrid(params) {
            const bbPeriod = parseInt(document.getElementById('param_bbPeriod')?.value || params.bbPeriod.value);
            const stdDev = parseFloat(document.getElementById('param_stdDev')?.value || params.stdDev.value);
            const spacing = parseFloat(document.getElementById('param_gridSpacing')?.value || params.gridSpacing.value);
            const positionSize = parseFloat(document.getElementById('param_positionSize')?.value || params.positionSize.value);
            
            const bb = calculateBollinger(priceHistory, bbPeriod, stdDev);
            if (bb === null) return;
            
            if (gridBtcPrice <= bb.lower && gridUsdtBalance > 100) {
                const buyAmount = Math.min(gridUsdtBalance * positionSize / 100, 500);
                const quantity = buyAmount / gridBtcPrice;
                if (quantity > 0.001) {
                    gridBtcBalance += quantity;
                    gridUsdtBalance -= buyAmount;
                    gridAddLog(`📈 触及布林带下轨($${bb.lower.toFixed(2)})，买入`);
                }
            } else if (gridBtcPrice >= bb.upper && gridBtcBalance > 0.001) {
                const sellQuantity = gridBtcBalance * positionSize / 100;
                if (sellQuantity > 0.001) {
                    const sellAmount = sellQuantity * gridBtcPrice;
                    gridBtcBalance -= sellQuantity;
                    gridUsdtBalance += sellAmount;
                    gridAddLog(`📉 触及布林带上轨($${bb.upper.toFixed(2)})，卖出`);
                }
            }
        }

        // EMA趋势网格执行
        function executeEMAGrid(params) {
            const emaShort = parseInt(document.getElementById('param_emaShort')?.value || params.emaShort.value);
            const emaLong = parseInt(document.getElementById('param_emaLong')?.value || params.emaLong.value);
            const spacing = parseFloat(document.getElementById('param_gridSpacing')?.value || params.gridSpacing.value);
            const positionSize = parseFloat(document.getElementById('param_positionSize')?.value || params.positionSize.value);
            const stopLoss = parseFloat(document.getElementById('param_stopLoss')?.value || params.stopLoss.value);
            
            const shortEMA = calculateEMA(priceHistory, emaShort);
            const longEMA = calculateEMA(priceHistory, emaLong);
            if (shortEMA === null || longEMA === null) return;
            
            const diffPercent = Math.abs(shortEMA - longEMA) / longEMA * 100;
            
            if (diffPercent < 0.5) {
                // 震荡市，双向网格
                if (gridUsdtBalance > 100 && gridBtcBalance < 0.1) {
                    const buyAmount = Math.min(gridUsdtBalance * positionSize / 100, 500);
                    const quantity = buyAmount / gridBtcPrice;
                    if (quantity > 0.001) {
                        gridBtcBalance += quantity;
                        gridUsdtBalance -= buyAmount;
                        gridAddLog(`📈 震荡市网格买入`);
                    }
                } else if (gridBtcBalance > 0.001) {
                    const sellQuantity = gridBtcBalance * positionSize / 100;
                    if (sellQuantity > 0.001) {
                        const sellAmount = sellQuantity * gridBtcPrice;
                        gridBtcBalance -= sellQuantity;
                        gridUsdtBalance += sellAmount;
                        gridAddLog(`📉 震荡市网格卖出`);
                    }
                }
            } else if (shortEMA > longEMA) {
                // 上升趋势，只做多
                if (gridBtcPrice <= shortEMA * 1.01 && gridUsdtBalance > 100) {
                    const buyAmount = Math.min(gridUsdtBalance * positionSize / 100, 500);
                    const quantity = buyAmount / gridBtcPrice;
                    if (quantity > 0.001) {
                        gridBtcBalance += quantity;
                        gridUsdtBalance -= buyAmount;
                        gridAddLog(`📈 上升趋势回调买入`);
                    }
                }
            } else {
                // 下降趋势，只做空（清仓）
                if (gridBtcBalance > 0.001) {
                    const sellQuantity = gridBtcBalance;
                    const sellAmount = sellQuantity * gridBtcPrice;
                    gridBtcBalance = 0;
                    gridUsdtBalance += sellAmount;
                    gridAddLog(`📉 下降趋势清仓卖出`);
                }
            }
        }

        // KDJ网格执行
        function executeKDJGrid(params) {
            const kdjPeriod = parseInt(document.getElementById('param_kdjPeriod')?.value || params.kdjPeriod.value);
            const spacing = parseFloat(document.getElementById('param_gridSpacing')?.value || params.gridSpacing.value);
            const positionSize = parseFloat(document.getElementById('param_positionSize')?.value || params.positionSize.value);
            
            const kdj = calculateKDJ(priceHistory, kdjPeriod);
            if (kdj === null) return;
            
            if (kdj.j < 10 && gridUsdtBalance > 100) {
                const buyAmount = Math.min(gridUsdtBalance * positionSize / 100, 500);
                const quantity = buyAmount / gridBtcPrice;
                if (quantity > 0.001) {
                    gridBtcBalance += quantity;
                    gridUsdtBalance -= buyAmount;
                    gridAddLog(`📈 J值=${kdj.j.toFixed(1)} 超卖，买入`);
                }
            } else if (kdj.j > 90 && gridBtcBalance > 0.001) {
                const sellQuantity = gridBtcBalance * positionSize / 100;
                if (sellQuantity > 0.001) {
                    const sellAmount = sellQuantity * gridBtcPrice;
                    gridBtcBalance -= sellQuantity;
                    gridUsdtBalance += sellAmount;
                    gridAddLog(`📉 J值=${kdj.j.toFixed(1)} 超买，卖出`);
                }
            }
        }

        // MACD网格执行
        function executeMACDGrid(params) {
            const fastPeriod = parseInt(document.getElementById('param_fastPeriod')?.value || params.fastPeriod.value);
            const slowPeriod = parseInt(document.getElementById('param_slowPeriod')?.value || params.slowPeriod.value);
            const signalPeriod = parseInt(document.getElementById('param_signalPeriod')?.value || params.signalPeriod.value);
            const spacing = parseFloat(document.getElementById('param_gridSpacing')?.value || params.gridSpacing.value);
            const positionSize = parseFloat(document.getElementById('param_positionSize')?.value || params.positionSize.value);
            
            const macd = calculateMACD(priceHistory, fastPeriod, slowPeriod, signalPeriod);
            if (macd === null) return;
            
            if (macd.histogram > 0 && macd.histogram > macd.signal * 0.1 && gridUsdtBalance > 100) {
                const buyAmount = Math.min(gridUsdtBalance * positionSize / 100, 500);
                const quantity = buyAmount / gridBtcPrice;
                if (quantity > 0.001) {
                    gridBtcBalance += quantity;
                    gridUsdtBalance -= buyAmount;
                    gridAddLog(`📈 MACD柱状图放大，买入`);
                }
            } else if (macd.histogram < 0 && Math.abs(macd.histogram) > macd.signal * 0.1 && gridBtcBalance > 0.001) {
                const sellQuantity = gridBtcBalance * positionSize / 100;
                if (sellQuantity > 0.001) {
                    const sellAmount = sellQuantity * gridBtcPrice;
                    gridBtcBalance -= sellQuantity;
                    gridUsdtBalance += sellAmount;
                    gridAddLog(`📉 MACD柱状图缩小，卖出`);
                }
            }
        }

        // 多周期网格执行
        function executeMultiGrid(params) {
            const spacing = parseFloat(document.getElementById('param_gridSpacing')?.value || params.gridSpacing.value);
            const positionSize = parseFloat(document.getElementById('param_positionSize')?.value || params.positionSize.value);
            const maxPositions = parseFloat(document.getElementById('param_maxPositions')?.value || params.maxPositions.value);
            
            const totalValue = gridUsdtBalance + gridBtcBalance * gridBtcPrice;
            const currentPositionPercent = (gridBtcBalance * gridBtcPrice / totalValue) * 100;
            
            if (currentPositionPercent < maxPositions && gridUsdtBalance > 100) {
                const buyAmount = Math.min(gridUsdtBalance * positionSize / 100, 500);
                const quantity = buyAmount / gridBtcPrice;
                if (quantity > 0.001) {
                    gridBtcBalance += quantity;
                    gridUsdtBalance -= buyAmount;
                    gridAddLog(`📈 多周期网格买入，仓位${currentPositionPercent.toFixed(1)}%`);
                }
            } else if (currentPositionPercent > maxPositions && gridBtcBalance > 0.001) {
                const sellQuantity = gridBtcBalance * positionSize / 100;
                if (sellQuantity > 0.001) {
                    const sellAmount = sellQuantity * gridBtcPrice;
                    gridBtcBalance -= sellQuantity;
                    gridUsdtBalance += sellAmount;
                    gridAddLog(`📉 多周期网格卖出，仓位${currentPositionPercent.toFixed(1)}%`);
                }
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化价格历史
            for (let i = 0; i < 60; i++) {
                priceHistory.push(gridBtcPrice + (Math.random() - 0.5) * 200);
            }
            
            // 渲染默认策略
            renderStrategyContent();
            updateGridDisplay();
            
            gridAddLog('✅ 网格策略面板已就绪');
            gridAddLog(`📊 当前BTC价格: $${gridBtcPrice.toFixed(2)}`);
            
            // 暴露全局函数
            window.switchStrategy = switchStrategy;
            window.startGridStrategy = startGridStrategy;
            window.stopGridStrategy = stopGridStrategy;
        });
    </script>
</body>
</html>
