<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>网格策略卡片 - AI 金融助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
            overflow-y: auto;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            margin-bottom: 16px;
            color: #8a8a9a;
            text-decoration: none;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #8a8a9a;
            fill: none;
            stroke-width: 2;
        }

        /* 页面标题 */
        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
            text-align: center;
            margin-bottom: 20px;
        }

        /* 策略卡片网格 */
        .strategy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* 独立策略卡片 */
        .strategy-card {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .strategy-card:hover {
            border-color: #2a3a4a;
        }
        .strategy-card.running {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        /* 卡片头部 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #1a1a2a;
            padding-bottom: 10px;
        }
        .card-header .strategy-icon {
            font-size: 24px;
        }
        .card-header .strategy-name {
            font-size: 14px;
            font-weight: 700;
            color: #60a5fa;
        }
        .card-header .strategy-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #1a2a3a;
            color: #60a5fa;
            font-weight: 600;
        }
        .card-header .strategy-badge.running {
            background: #1a3a2a;
            color: #10b981;
        }

        /* 策略描述 */
        .strategy-desc {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.5;
        }

        /* 信号指示 */
        .signals {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .signal-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            background: #1a1a2a;
            color: #6a6a7a;
            font-weight: 500;
        }

        /* 状态指示器 */
        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #9ca3af;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6a6a7a;
        }
        .status-dot.active {
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
        }

        /* 账户信息 */
        .account-info {
            background: #0a0a12;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .account-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }
        .account-row .label {
            color: #6a6a7a;
        }
        .account-row .value {
            color: #e8e8f0;
            font-weight: 600;
        }

        /* 操作按钮 */
        .card-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .btn-toggle {
            background: #3b82f6;
            color: white;
        }
        .btn-toggle.running {
            background: #f59e0b;
            color: #0a0a0f;
        }
        .btn-reset {
            background: #1a1a2a;
            color: #8a8a9a;
        }
        .btn-reset:hover {
            background: #2a2a3a;
        }
        .btn-params {
            background: transparent;
            border: 1px solid #1a1a2a;
            color: #6a6a7a;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-params:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        /* 参数设置弹窗 */
        .params-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .params-modal-overlay.show {
            display: flex;
        }
        .params-modal {
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
        }
        .params-modal .modal-title {
            color: #60a5fa;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }
        .params-modal .param-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .params-modal .param-row label {
            font-size: 12px;
            color: #6a6a7a;
        }
        .params-modal .param-row input {
            width: 100px;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
            color: #e8e8f0;
            outline: none;
            text-align: right;
        }
        .params-modal .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .params-modal .modal-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-confirm {
            background: #3b82f6;
            color: white;
        }
        .btn-cancel {
            background: #1a1a2a;
            color: #6a6a7a;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回按钮 -->
        <a class="back-btn" href="grid-strategy.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </a>

        <!-- 页面标题 -->
        <h1 class="page-title">📊 网格策略卡片</h1>

        <!-- 策略卡片网格 -->
        <div class="strategy-grid" id="strategyCardsContainer">
            <!-- 由JS动态渲染 -->
        </div>
    </div>

    <!-- 参数设置弹窗 -->
    <div class="params-modal-overlay" id="paramsModalOverlay" onclick="closeParamsModal(event)">
        <div class="params-modal" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle">⚙️ 参数设置</div>
            <div id="modalContent"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeParamsModal()">取消</button>
                <button class="btn-confirm" onclick="saveParams()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  策略卡片数据
        // ============================================================
        
        const strategies = [
            {
                id: 'rsi',
                icon: '📈',
                name: 'RSI网格策略',
                badge: 'RSI',
                description: '基于RSI超买超卖信号的网格交易，在极端点位自动买卖',
                signals: ['超卖买入', '超买卖出', '中性持有'],
                params: {
                    rsiPeriod: { label: 'RSI周期', value: 14 },
                    oversold: { label: '超卖阈值', value: 30 },
                    overbought: { label: '超买阈值', value: 70 },
                    gridSpacing: { label: '网格间距(%)', value: 2 },
                    positionSize: { label: '单格仓位(%)', value: 10 }
                }
            },
            {
                id: 'bollinger',
                icon: '📊',
                name: '布林带网格策略',
                badge: 'BOLL',
                description: '基于布林带上下轨的均值回归网格，触及轨道自动交易',
                signals: ['下轨买入', '上轨卖出', '中轨平仓'],
                params: {
                    bbPeriod: { label: '布林带周期', value: 20 },
                    stdDev: { label: '标准差倍数', value: 2 },
                    gridSpacing: { label: '网格间距(%)', value: 1.5 },
                    positionSize: { label: '单格仓位(%)', value: 8 }
                }
            },
            {
                id: 'ema',
                icon: '📉',
                name: 'EMA趋势网格策略',
                badge: 'EMA',
                description: 'EMA趋势过滤+动态网格，趋势明确时只做单边',
                signals: ['金叉买入', '死叉卖出', '趋势过滤'],
                params: {
                    emaShort: { label: 'EMA短期', value: 20 },
                    emaLong: { label: 'EMA长期', value: 50 },
                    gridSpacing: { label: '网格间距(%)', value: 2 },
                    positionSize: { label: '单格仓位(%)', value: 10 },
                    stopLoss: { label: '止损(%)', value: 5 }
                }
            },
            {
                id: 'kdj',
                icon: '📐',
                name: 'KDJ网格策略',
                badge: 'KDJ',
                description: 'KDJ指标+网格交易，J值极端时触发买卖',
                signals: ['K上穿D买入', 'K下穿D卖出', 'J值超买超卖'],
                params: {
                    kdjPeriod: { label: 'KDJ周期', value: 9 },
                    kParam: { label: 'K值参数', value: 3 },
                    dParam: { label: 'D值参数', value: 3 },
                    gridSpacing: { label: '网格间距(%)', value: 2 },
                    positionSize: { label: '单格仓位(%)', value: 8 }
                }
            },
            {
                id: 'macd',
                icon: '📋',
                name: 'MACD网格策略',
                badge: 'MACD',
                description: 'MACD趋势判断+网格执行，柱状图变化触发交易',
                signals: ['MACD金叉买入', 'MACD死叉卖出', '柱状图缩量'],
                params: {
                    fastPeriod: { label: '快线周期', value: 12 },
                    slowPeriod: { label: '慢线周期', value: 26 },
                    signalPeriod: { label: '信号周期', value: 9 },
                    gridSpacing: { label: '网格间距(%)', value: 2 },
                    positionSize: { label: '单格仓位(%)', value: 10 }
                }
            },
            {
                id: 'multi',
                icon: '🔄',
                name: '多周期网格策略',
                badge: 'MULTI',
                description: '多重时间框架+网格交易，4H判断趋势，15M执行',
                signals: ['4H趋势判断', '1H网格区间', '15M执行'],
                params: {
                    trendPeriod: { label: '趋势周期(小时)', value: 4 },
                    gridPeriod: { label: '网格周期(分钟)', value: 15 },
                    gridSpacing: { label: '网格间距(%)', value: 1.5 },
                    positionSize: { label: '单格仓位(%)', value: 8 },
                    maxPositions: { label: '最大持仓(%)', value: 60 }
                }
            }
        ];

        // 每个策略的独立状态
        const strategyStates = {};
        strategies.forEach(s => {
            strategyStates[s.id] = {
                running: false,
                usdtBalance: 10000,
                assetBalance: 0,
                interval: null,
                params: JSON.parse(JSON.stringify(s.params))
            };
        });

        // 当前编辑的策略ID
        let currentEditingStrategy = null;

        // 渲染策略卡片
        function renderStrategyCards() {
            const container = document.getElementById('strategyCardsContainer');
            
            let html = '';
            strategies.forEach(strategy => {
                const state = strategyStates[strategy.id];
                
                html += `
                    <div class="strategy-card ${state.running ? 'running' : ''}" id="card_${strategy.id}">
                        <!-- 卡片头部 -->
                        <div class="card-header">
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span class="strategy-icon">${strategy.icon}</span>
                                <span class="strategy-name">${strategy.name}</span>
                            </div>
                            <span class="strategy-badge ${state.running ? 'running' : ''}">${strategy.badge}${state.running ? ' · 运行中' : ''}</span>
                        </div>
                        
                        <!-- 策略描述 -->
                        <div class="strategy-desc">${strategy.description}</div>
                        
                        <!-- 信号指示 -->
                        <div class="signals">
                            ${strategy.signals.map(s => `<span class="signal-tag">${s}</span>`).join('')}
                        </div>
                        
                        <!-- 状态指示器 -->
                        <div class="status-row">
                            <span class="status-dot ${state.running ? 'active' : ''}" id="dot_${strategy.id}"></span>
                            <span id="status_${strategy.id}">${state.running ? '运行中' : '已停止'}</span>
                        </div>
                        
                        <!-- 账户信息 -->
                        <div class="account-info">
                            <div class="account-row">
                                <span class="label">USDT余额</span>
                                <span class="value" id="usdt_${strategy.id}">${state.usdtBalance.toFixed(2)}</span>
                            </div>
                            <div class="account-row">
                                <span class="label">持仓数量</span>
                                <span class="value" id="asset_${strategy.id}">${state.assetBalance.toFixed(4)}</span>
                            </div>
                            <div class="account-row">
                                <span class="label">盈亏</span>
                                <span class="value" id="pnl_${strategy.id}" style="color:#10b981;">+$0.00</span>
                            </div>
                        </div>
                        
                        <!-- 操作按钮 -->
                        <div class="card-actions">
                            <button class="action-btn btn-toggle ${state.running ? 'running' : ''}" 
                                id="toggleBtn_${strategy.id}" 
                                onclick="toggleStrategy('${strategy.id}')">
                                ${state.running ? '⏸ 暂停' : '▶ 启动'}
                            </button>
                            <button class="action-btn btn-reset" onclick="resetStrategy('${strategy.id}')">
                                🔄 撤销
                            </button>
                        </div>
                        
                        <!-- 参数设置按钮 -->
                        <button class="btn-params" onclick="openParamsModal('${strategy.id}')">
                            ⚙️ 参数设置
                        </button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 切换策略运行状态
        function toggleStrategy(id) {
            const state = strategyStates[id];
            
            if (state.running) {
                // 暂停策略
                state.running = false;
                if (state.interval) {
                    clearInterval(state.interval);
                    state.interval = null;
                }
            } else {
                // 启动策略
                state.running = true;
                state.interval = setInterval(() => {
                    simulateTrade(id);
                }, 3000);
            }
            
            renderStrategyCards();
        }

        // 模拟交易
        function simulateTrade(id) {
            const state = strategyStates[id];
            const strategy = strategies.find(s => s.id === id);
            
            // 模拟价格
            const currentPrice = 65432.10 + (Math.random() - 0.5) * 200;
            const positionSize = state.params.positionSize.value / 100;
            
            if (Math.random() > 0.5) {
                // 买入
                if (state.usdtBalance > 100) {
                    const buyAmount = Math.min(state.usdtBalance * positionSize, 500);
                    const quantity = buyAmount / currentPrice;
                    state.assetBalance += quantity;
                    state.usdtBalance -= buyAmount;
                }
            } else {
                // 卖出
                if (state.assetBalance > 0.001) {
                    const sellQuantity = state.assetBalance * positionSize;
                    const sellAmount = sellQuantity * currentPrice;
                    state.assetBalance -= sellQuantity;
                    state.usdtBalance += sellAmount;
                }
            }
            
            updateCardDisplay(id);
        }

        // 更新卡片显示
        function updateCardDisplay(id) {
            const state = strategyStates[id];
            
            const usdtEl = document.getElementById(`usdt_${id}`);
            const assetEl = document.getElementById(`asset_${id}`);
            const pnlEl = document.getElementById(`pnl_${id}`);
            
            if (usdtEl) usdtEl.textContent = state.usdtBalance.toFixed(2);
            if (assetEl) assetEl.textContent = state.assetBalance.toFixed(4);
            
            if (pnlEl) {
                const totalValue = state.usdtBalance + state.assetBalance * 65432.10;
                const pnl = totalValue - 10000;
                pnlEl.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
                pnlEl.style.color = pnl >= 0 ? '#10b981' : '#ef4444';
            }
        }

        // 撤销策略
        function resetStrategy(id) {
            const state = strategyStates[id];
            
            if (state.running) {
                state.running = false;
                if (state.interval) {
                    clearInterval(state.interval);
                    state.interval = null;
                }
            }
            
            state.usdtBalance = 10000;
            state.assetBalance = 0;
            
            renderStrategyCards();
        }

        // 打开参数设置弹窗
        function openParamsModal(id) {
            currentEditingStrategy = id;
            const state = strategyStates[id];
            const strategy = strategies.find(s => s.id === id);
            
            document.getElementById('modalTitle').textContent = `⚙️ ${strategy.name} - 参数设置`;
            
            let html = '';
            Object.entries(state.params).forEach(([key, param]) => {
                html += `
                    <div class="param-row">
                        <label>${param.label}</label>
                        <input type="number" id="modalParam_${key}" value="${param.value}" step="0.1">
                    </div>
                `;
            });
            
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('paramsModalOverlay').classList.add('show');
        }

        // 关闭参数设置弹窗
        function closeParamsModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('paramsModalOverlay').classList.remove('show');
        }

        // 保存参数
        function saveParams() {
            if (!currentEditingStrategy) return;
            
            const state = strategyStates[currentEditingStrategy];
            
            Object.keys(state.params).forEach(key => {
                const input = document.getElementById(`modalParam_${key}`);
                if (input) {
                    const value = parseFloat(input.value);
                    if (!isNaN(value)) {
                        state.params[key].value = value;
                    }
                }
            });
            
            closeParamsModal();
            renderStrategyCards();
        }

        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderStrategyCards();
            
            document.getElementById('paramsModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeParamsModal();
                }
            });
        });
    </script>
</body>
</html>
