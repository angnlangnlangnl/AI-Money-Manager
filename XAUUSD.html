<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD 交易界面 (全量缩放版)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app { width: 100%; max-width: 100%; height: 100vh; background-color: #181a20; color: #eaecef; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .header { display: flex; align-items: center; padding: 0 20px; height: 38px; flex-shrink: 0; background: #1e2329; border-bottom: 1px solid #2b3139; }
        .header-left { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: bold; }
        .header-left .pair-selector { cursor: pointer; color: #eaecef; padding: 2px 6px; border-radius: 4px; }
        .header-left .base-asset { font-size: 11px; color: #848e9c; font-weight: normal; margin-right: 15px; }
        .header-tabs { display: flex; align-items: center; height: 100%; gap: 20px; }
        .header-tab { color: #848e9c; font-size: 13px; height: 100%; display: flex; align-items: center; cursor: pointer; position: relative; }
        .header-tab.active { color: #eaecef; font-weight: bold; }
        .header-tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: #f0b90b; }
        .header-icons { margin-left: auto; display: flex; gap: 15px; font-size: 15px; color: #848e9c; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .trade-panel { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .quote-section { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 20px; flex-shrink: 0; }
        .quote-left { display: flex; flex-direction: column; }
        .price-main { font-size: 26px; font-weight: bold; line-height: 1.1; }
        .price-sub { font-size: 12px; color: #848e9c; margin-top: 4px; }
        .price-sub span.green { color: #0ecb81; }
        .price-sub span.red { color: #f6465d; }
        .quote-details { font-size: 11px; color: #848e9c; text-align: right; display: flex; gap: 25px; padding-top: 4px; }
        .quote-details div { display: flex; flex-direction: column; align-items: flex-end; }
        .quote-details b { color: #eaecef; font-weight: normal; font-size: 12px; margin-top: 2px; }
        .timeframes { display: flex; gap: 15px; padding: 0 20px 8px; font-size: 12px; color: #848e9c; flex-shrink: 0; align-items: center; }
        .timeframes span.active { color: #eaecef; font-weight: bold; border-bottom: 2px solid #eaecef; padding-bottom: 2px; }
        .timeframes span { cursor: pointer; }
        .chart-container { flex: 1; min-height: 300px; position: relative; background: #181a20; display: flex; flex-direction: column; padding-bottom: 5px; }
        #kline { width: 100%; flex: 1; }
        .indicators { display: flex; gap: 15px; padding: 8px 20px; font-size: 11px; color: #848e9c; border-top: 1px solid #2b3139; flex-shrink: 0; margin-bottom: 10px; }
        .indicators span { cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s; }
        .indicators span.active { color: #f0b90b; background: rgba(240,185,11,0.1); }
        .right-drawer { width: 300px; background: #1e2329; border-left: 1px solid #2b3139; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s ease; overflow: hidden; position: relative; }
        .right-drawer.collapsed { width: 0; border-left: none; }
        .drawer-content { width: 300px; display: flex; flex-direction: column; height: 100%; }
        .toggle-btn { position: absolute; right: 300px; top: 0; width: 20px; height: 32px; background: #1e2329; border: 1px solid #2b3139; border-top: none; border-right: none; border-radius: 0 0 0 4px; color: #848e9c; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 20; font-size: 10px; transition: right 0.3s ease; }
        .toggle-btn:hover { background: #2b3139; color: #fff; }
        .order-book-panel { padding: 10px 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
        .order-book-bar { display: flex; align-items: center; font-size: 11px; font-weight: bold; }
        .sell-bar { width: 50%; background: rgba(246,70,93,0.2); color: #f6465d; text-align: left; padding: 6px 10px; border-radius: 4px 0 0 4px; border: 1px solid #f6465d; border-right: none; }
        .buy-bar { width: 50%; background: rgba(14,203,129,0.2); color: #0ecb81; text-align: right; padding: 6px 10px; border-radius: 0 4px 4px 0; border: 1px solid #0ecb81; border-left: none; }
        .order-tabs { display: flex; gap: 15px; font-size: 11px; color: #848e9c; border-bottom: 1px solid #2b3139; padding-bottom: 5px; }
        .order-tabs span { cursor: pointer; padding: 2px 0; border-bottom: 2px solid transparent; }
        .order-tabs span.active { color: #eaecef; border-bottom-color: #f0b90b; }
        .order-data-container { flex: 1; overflow-y: auto; }
        .order-data-content { font-size: 11px; color: #aaa; }
        .drawer-actions { padding: 10px; background: #181a20; border-top: 1px solid #2b3139; display: flex; gap: 8px; flex-shrink: 0; }
        .drawer-actions button { flex: 1; padding: 8px 0; border-radius: 4px; font-size: 13px; font-weight: bold; color: #fff; cursor: pointer; border: none; }
        .drawer-actions .buy-btn { background: #0ecb81; }
        .drawer-actions .sell-btn { background: #f6465d; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #1e2329; border-radius: 8px; width: 90%; max-width: 350px; padding: 15px; border: 1px solid #2b3139; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: bold; color: #fff; }
        .modal-close { cursor: pointer; color: #848e9c; font-size: 18px; }
        .trade-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .trade-row label { width: 70px; font-size: 12px; color: #848e9c; }
        .trade-row input, .trade-row select { flex: 1; background: #0a0a12; border: 1px solid #2a2a3a; border-radius: 4px; padding: 8px 10px; color: #eaecef; font-size: 13px; outline: none; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-left">
            <span style="color:#f0b90b; font-size:18px;">Gate</span>
            <span class="pair-selector">XAUUSD ▾</span>
            <span class="base-asset">黄金 Gold</span>
            <div class="header-tabs">
                <div class="header-tab active">图表</div>
                <div class="header-tab">合约信息</div>
                <div class="header-tab">资讯</div>
            </div>
        </div>
        <div class="header-icons"><span>✨</span><span>★</span><span>🔔</span></div>
    </div>

    <div class="main-content">
        <div class="trade-panel">
            <div class="quote-section">
                <div class="quote-left">
                    <div class="price-main" id="last-price">--</div>
                    <div class="price-sub" id="cn-price">-- <span class="green">+0.00%</span></div>
                </div>
                <div class="quote-details">
                    <div>今日最高价 <b id="high-24">--</b></div>
                    <div>今日最低价 <b id="low-24">--</b></div>
                    <div>今日开盘价 <b id="open-price">--</b></div>
                </div>
            </div>

            <div class="timeframes" id="timeframes">
                <span data-interval="1m">1分</span><span data-interval="5m">5分</span><span data-interval="15m" class="active">15分</span><span data-interval="30m">30分</span><span data-interval="1h">1小时</span><span data-interval="4h">4小时</span><span data-interval="1d">1日</span>
            </div>
            
            <div class="chart-container"><div id="kline"></div></div>
            
            <div class="indicators" id="indicator-buttons">
                <span class="active" data-indicator="MA">MA</span><span data-indicator="EMA">EMA</span><span data-indicator="BOLL">BOLL</span><span data-indicator="VOL">VOL</span><span data-indicator="MACD">MACD</span>
            </div>
        </div>

        <div class="right-drawer" id="rightDrawer">
            <div class="drawer-content">
                <div class="order-book-panel">
                    <div class="order-book-bar">
                        <div class="sell-bar" id="sell-bar">卖一 --</div>
                        <div class="buy-bar" id="buy-bar">买一 --</div>
                    </div>
                    <div class="order-tabs">
                        <span class="active" onclick="switchOrderTab('depth')">深度</span>
                        <span onclick="switchOrderTab('trades')">最新成交</span>
                    </div>
                    <div class="order-data-container">
                        <div class="order-data-content" id="orderDataContent">加载中...</div>
                    </div>
                </div>
                <div class="drawer-actions">
                    <button class="buy-btn" onclick="openTradeModal('buy')">买入/做多</button>
                    <button class="sell-btn" onclick="openTradeModal('sell')">卖出/做空</button>
                </div>
            </div>
        </div>
        <div class="toggle-btn" onclick="toggleDrawer()" id="drawerToggleBtn">▶</div>
    </div>

    <div class="modal-overlay" id="tradeModalOverlay">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title" id="tradeModalTitle">买入 XAUUSD</span><span class="modal-close" onclick="closeTradeModal()">✕</span></div>
            <div class="trade-row"><label>订单类型</label><select id="tradeOrderType"><option value="market">市价单</option><option value="limit">限价单</option></select></div>
            <div class="trade-row" id="tradePriceRow" style="display:none;"><label>价格</label><input type="number" id="tradePrice" placeholder="限价 (美元)" step="0.01"></div>
            <div class="trade-row"><label>手数</label><input type="number" id="tradeAmount" placeholder="最小 0.01 手" step="0.01" min="0.01"></div>
            <div style="display:flex;gap:10px;margin-top:15px;">
                <button class="sell-btn" onclick="closeTradeModal()" style="background:#2a2a3a;flex:1;padding:8px 0;border-radius:4px;color:#fff;border:none;">取消</button>
                <button class="buy-btn" onclick="confirmTrade()" style="background:#f0b90b;color:#181a20;flex:1;padding:8px 0;border-radius:4px;border:none;font-weight:bold;">确认下单</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://cfd.heimi888.com'; 
    const WS_URL = 'wss://cfd.heimi888.com';

    let currentInterval = '15m';
    let rawKlines = [];
    let chartData = { dates: [], klines: [], volumes: [], timestamps: [], alignedCloses: [] };
    const indicatorState = { MA: true, EMA: false, BOLL: false, VOL: false, MACD: false };
    let currentPrice = 0;
    let isDrawerOpen = true;
    let wsConnection = null;
    let chartInitialized = false;

    // ===== 缩放状态：绝对索引（相对 rawKlines），彻底解耦"显示根数"与"跟随最新" =====
    // 用户视窗左端/右端的 rawKlines 索引
    let userZoomStartIdx = 0;
    let userZoomEndIdx = 0;
    // 用户是否手动缩放过（未缩放过则用默认显示最后N根）
    let isUserZoomed = false;
    // 右端是否贴在最右（数据增长时是否跟随右移）。只控制"右端是否自动跟随"，绝不控制"显示根数"
    let followLatest = true;

    const DEFAULT_VISIBLE_BARS = 70;
    const MIN_VISIBLE_BARS = 10;
    const PADDING_BARS = 15;

    // ===== 指标计算（行业标准）=====
    class Indicators {
        static SMA(data, period) {
            const result = new Array(data.length).fill(null);
            for (let i = period - 1; i < data.length; i++) {
                let sum = 0, valid = true;
                for (let j = i - period + 1; j <= i; j++) {
                    if (data[j] === null || data[j] === undefined) { valid = false; break; }
                    sum += data[j];
                }
                result[i] = valid ? sum / period : null;
            }
            return result;
        }
        static EMA(data, period) {
            const result = new Array(data.length).fill(null);
            let prev = null, count = 0;
            const k = 2 / (period + 1);
            for (let i = 0; i < data.length; i++) {
                const v = data[i];
                if (v === null || v === undefined) { result[i] = null; continue; }
                if (prev === null) {
                    result[i] = v; prev = v; count = 1;
                } else {
                    count++;
                    if (count <= period) {
                        prev = prev + (v - prev) / count;
                    } else {
                        prev = v * k + prev * (1 - k);
                    }
                    result[i] = prev;
                }
            }
            return result;
        }
        static BOLL(data, period = 20, stdDev = 2) {
            const middle = this.SMA(data, period);
            const upper = new Array(data.length).fill(null);
            const lower = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) {
                if (middle[i] === null) continue;
                let sum = 0, valid = true;
                for (let j = i - period + 1; j <= i; j++) {
                    if (data[j] === null || data[j] === undefined) { valid = false; break; }
                    sum += Math.pow(data[j] - middle[i], 2);
                }
                if (!valid) continue;
                const std = Math.sqrt(sum / period);
                upper[i] = middle[i] + stdDev * std;
                lower[i] = middle[i] - stdDev * std;
            }
            return { upper, middle, lower };
        }
        static MACD(data, fast = 12, slow = 26, signal = 9) {
            const emaFast = this.EMA(data, fast);
            const emaSlow = this.EMA(data, slow);
            const dif = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) {
                if (emaFast[i] !== null && emaSlow[i] !== null) dif[i] = emaFast[i] - emaSlow[i];
            }
            const dea = this.EMA(dif, signal);
            const macd = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) {
                if (dif[i] !== null && dea[i] !== null) macd[i] = (dif[i] - dea[i]) * 2;
            }
            return { dif, dea, macd };
        }
    }

    function formatNum(num, decimals = 2) { const n = parseFloat(num); if (isNaN(n)) return '--'; return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
    function formatKlineDate(timestamp, interval) {
        const d = new Date(timestamp);
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const date = d.getDate().toString().padStart(2, '0');
        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');
        if (interval === '1d') return `${month}-${date}`;
        if (interval === '4h') return `${month}-${date} ${hours}:00`;
        return `${hours}:${minutes}`;
    }
    function getIntervalMs(interval) {
        const map = { '1m': 60000, '5m': 300000, '15m': 900000, '30m': 1800000, '1h': 3600000, '4h': 14400000, '1d': 86400000 };
        return map[interval] || 900000;
    }

    const chartDom = document.getElementById('kline');
    const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

    // ===== 重建数据：绝对索引，数据增长时旧索引天然不变 =====
    function rebuildChartDataFromRaw() {
        const intervalMs = getIntervalMs(currentInterval);
        const dates = [], klines = [], volumes = [], timestamps = [], alignedCloses = [];
        rawKlines.forEach(item => {
            timestamps.push(item.t);
            dates.push(formatKlineDate(item.t, currentInterval));
            klines.push([item.o, item.c, item.l, item.h]);
            volumes.push(item.v != null ? item.v : 1000);
            alignedCloses.push(item.c);
        });
        if (timestamps.length > 0) {
            const lastTs = timestamps[timestamps.length - 1];
            for (let i = 1; i <= PADDING_BARS; i++) {
                const ts = lastTs + i * intervalMs;
                timestamps.push(ts);
                dates.push(formatKlineDate(ts, currentInterval));
                klines.push(['-', '-', '-', '-']);
                volumes.push('-');
                alignedCloses.push(null);
            }
        }
        chartData = { dates, klines, volumes, timestamps, alignedCloses };

        const realLen = rawKlines.length;

        if (!isUserZoomed) {
            // 首次初始化：显示最后 DEFAULT_VISIBLE_BARS 根真实K线
            const visible = Math.min(DEFAULT_VISIBLE_BARS, realLen);
            userZoomStartIdx = Math.max(0, realLen - visible);
            userZoomEndIdx = realLen - 1;
            followLatest = true;
        } else if (followLatest) {
            // ✅ 用户贴在最右端：右端跟最新，左端保持"显示根数"不变
            const visibleCount = userZoomEndIdx - userZoomStartIdx + 1;
            userZoomEndIdx = realLen - 1;
            userZoomStartIdx = Math.max(0, userZoomEndIdx - visibleCount + 1);
        } else {
            // ✅ 用户在看历史：索引完全不动（新数据追加在末尾，不影响前面的索引）
            if (userZoomEndIdx >= realLen) userZoomEndIdx = realLen - 1;
            if (userZoomStartIdx < 0) userZoomStartIdx = 0;
            if (userZoomEndIdx - userZoomStartIdx + 1 < MIN_VISIBLE_BARS) {
                userZoomStartIdx = Math.max(0, userZoomEndIdx - MIN_VISIBLE_BARS + 1);
            }
        }
    }

    function updateKlineFromTick(price, tickTimestamp) {
        if (rawKlines.length === 0) return;
        const intervalMs = getIntervalMs(currentInterval);
        const lastItem = rawKlines[rawKlines.length - 1];
        const lastBarStartTs = Math.floor(lastItem.t / intervalMs) * intervalMs;
        const currentBarStartTs = Math.floor(tickTimestamp / intervalMs) * intervalMs;
        if (currentBarStartTs === lastBarStartTs) {
            lastItem.c = price;
            if (price > lastItem.h) lastItem.h = price;
            if (price < lastItem.l) lastItem.l = price;
            if (lastItem.v != null) lastItem.v += 1;
        } else if (currentBarStartTs > lastBarStartTs) {
            rawKlines.push({ t: currentBarStartTs, o: price, h: price, l: price, c: price, v: 1 });
        } else return;

        rebuildChartDataFromRaw();
        updateTickerUI();
        if (chartInitialized) updateChart();
    }

    async function loadRealData(interval) {
        try {
            const res = await fetch(`${API_BASE}/api/kline?interval=${interval}&limit=500`);
            const json = await res.json();
            if (!json.success || !json.data) throw new Error('K线获取失败');
            rawKlines = json.data.map(item => ({
                t: item.t,
                o: parseFloat(item.o),
                h: parseFloat(item.h),
                l: parseFloat(item.l),
                c: parseFloat(item.c),
                v: item.v != null ? parseFloat(item.v) : null
            }));
            currentPrice = rawKlines[rawKlines.length - 1].c;

            // 切换周期：重置缩放状态，允许重新初始化
            isUserZoomed = false;
            followLatest = true;
            userZoomStartIdx = 0;
            userZoomEndIdx = 0;

            rebuildChartDataFromRaw();
            chartInitialized = true;
            updateTickerUI();
            updateChart();
        } catch (e) {
            console.error('获取 K 线失败:', e);
            alert('数据加载失败: ' + e.message);
        }
    }

    function initWebSocket() {
        if (wsConnection) wsConnection.close();
        wsConnection = new WebSocket(WS_URL);
        wsConnection.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'ticker') {
                const tick = msg.data;
                const price = parseFloat(tick.last);
                const change = parseFloat(tick.change);
                const tickTimestamp = msg.timestamp || Date.now();
                document.getElementById('last-price').innerText = formatNum(price);
                document.getElementById('high-24').innerText = formatNum(tick.high);
                document.getElementById('low-24').innerText = formatNum(tick.low);
                document.getElementById('open-price').innerText = formatNum(tick.open);
                document.getElementById('cn-price').innerHTML = `$${formatNum(price)} <span class="${change >= 0 ? 'green' : 'red'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;
                document.getElementById('sell-bar').innerText = `卖 ${formatNum(tick.ask)}`;
                document.getElementById('buy-bar').innerText = `买 ${formatNum(tick.bid)}`;
                if (chartInitialized && rawKlines.length > 0) updateKlineFromTick(price, tickTimestamp);
                currentPrice = price;
            }
        };
        wsConnection.onclose = () => setTimeout(initWebSocket, 5000);
    }

    function updateTickerUI() {
        if (!rawKlines.length) return;
        const last = rawKlines[rawKlines.length - 1];
        const open = last.o, close = last.c;
        const change = ((close - open) / open) * 100;
        document.getElementById('last-price').innerText = formatNum(close);
        document.getElementById('open-price').innerText = formatNum(open);
        const recent = rawKlines.slice(Math.max(0, rawKlines.length - 24));
        if (recent.length) {
            document.getElementById('high-24').innerText = formatNum(Math.max(...recent.map(k => k.h)));
            document.getElementById('low-24').innerText = formatNum(Math.min(...recent.map(k => k.l)));
        }
        document.getElementById('cn-price').innerHTML = `$${formatNum(close)} <span class="${change >= 0 ? 'green' : 'red'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;
    }

    let cachedClosesRef = null;
    let cachedIndicators = {};

    function getIndicators(closesForIndicator) {
        if (cachedClosesRef === closesForIndicator) return cachedIndicators;
        cachedClosesRef = closesForIndicator;
        cachedIndicators = {
            ma5: Indicators.SMA(closesForIndicator, 5),
            ma10: Indicators.SMA(closesForIndicator, 10),
            ma20: Indicators.SMA(closesForIndicator, 20),
            ema12: Indicators.EMA(closesForIndicator, 12),
            ema26: Indicators.EMA(closesForIndicator, 26),
            boll: Indicators.BOLL(closesForIndicator, 20, 2),
            macd: Indicators.MACD(closesForIndicator)
        };
        return cachedIndicators;
    }

    function updateChart() {
        if (!chartInitialized || !chartData.dates.length) return;
        const { dates, klines, volumes, alignedCloses } = chartData;
        const realLen = rawKlines.length;
        const totalLen = dates.length;

        // ===== 关键：把绝对索引映射到含 padding 的 category 轴索引 =====
        // 用户在 rawKlines 上的视窗 [userZoomStartIdx, userZoomEndIdx]
        // 在 category 轴（含 padding）上仍然是 [userZoomStartIdx, userZoomEndIdx]（因为 padding 在后面）
        let zoomStartIdx = Math.max(0, Math.min(userZoomStartIdx, totalLen - 1));
        let zoomEndIdx = Math.max(0, Math.min(userZoomEndIdx, totalLen - 1));
        if (zoomEndIdx - zoomStartIdx + 1 < MIN_VISIBLE_BARS) {
            zoomEndIdx = Math.min(totalLen - 1, zoomStartIdx + MIN_VISIBLE_BARS - 1);
        }

        // ★ 百分比 = 索引 / (totalLen - 1)，保证 ECharts 在含 padding 的轴上定位正确
        const startPct = (zoomStartIdx / Math.max(1, totalLen - 1)) * 100;
        const endPct = (zoomEndIdx / Math.max(1, totalLen - 1)) * 100;

        const showVol = indicatorState.VOL, showMacd = indicatorState.MACD;
        let mainHeight = 100, volHeight = 0, macdHeight = 0;
        const gap = 6;
        if (showVol && showMacd) { mainHeight = 60; volHeight = 15; macdHeight = 15; }
        else if (showVol || showMacd) { mainHeight = 75; volHeight = showVol ? 20 : 0; macdHeight = showMacd ? 20 : 0; }

        const grids = [], xAxes = [], yAxes = [], series = [];
        let currentTop = 2;
        const rightMargin = '8%';
        const xSplitInterval = Math.max(1, Math.floor((zoomEndIdx - zoomStartIdx) / 25));

        // 主图 grid0
        grids.push({ left: 10, right: rightMargin, top: currentTop + '%', height: mainHeight + '%', containLabel: true });
        xAxes.push({
            type: 'category', data: dates, gridIndex: 0,
            axisLine: { show: false }, axisTick: { show: false },
            splitLine: { show: true, lineStyle: { color: '#2b3139', type: 'dashed', opacity: 0.5 } },
            axisLabel: { show: false }, interval: xSplitInterval
        });
        yAxes.push({
            scale: true, position: 'right', gridIndex: 0,
            splitLine: { show: true, lineStyle: { color: '#2b3139', type: 'dashed', opacity: 0.5 } },
            axisLabel: { color: '#848e9c', fontSize: 10, inside: false, margin: 6, formatter: v => formatNum(v, 1), showMinLabel: true, showMaxLabel: true }
        });

        // 主图 grid1
        grids.push({ left: 10, right: rightMargin, top: currentTop + '%', height: mainHeight + '%', containLabel: true });
        xAxes.push({
            type: 'category', data: dates, gridIndex: 1,
            axisLine: { show: false }, axisTick: { show: false },
            axisLabel: { show: true, color: '#848e9c', fontSize: 10, margin: 6, hideOverlap: true, position: 'bottom' }
        });
        yAxes.push({ scale: true, position: 'right', gridIndex: 1, splitLine: { show: false }, axisLabel: { show: false } });

        // K 线
        const klineSeries = {
            id: 'klineMain', name: 'K线', type: 'candlestick', data: klines, xAxisIndex: 1, yAxisIndex: 1, z: 10,
            barMaxWidth: 18,
            itemStyle: { color: '#0ecb81', color0: '#f6465d', borderColor: '#0ecb81', borderColor0: '#f6465d' },
            markLine: { symbol: 'none', animation: false, lineStyle: { type: 'dashed', width: 1 }, label: { position: 'end', distance: 2, color: '#848e9c', fontSize: 10, formatter: '{c}' }, data: [] }
        };
        if (currentPrice) {
            klineSeries.markLine.data.push({
                yAxis: currentPrice, lineStyle: { color: '#0ecb81', type: 'dashed', width: 1 },
                label: { formatter: formatNum(currentPrice), color: '#181a20', backgroundColor: '#0ecb81', padding: [2, 4], borderRadius: 2, fontSize: 11, distance: 0 }
            });
        }
        series.push(klineSeries);

        const closesForIndicator = alignedCloses;
        const validCloseCount = closesForIndicator.filter(v => v !== null).length;
        const ind = getIndicators(closesForIndicator);

        if (indicatorState.MA && validCloseCount > 20) {
            series.push({ name: 'MA5', type: 'line', data: ind.ma5, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'MA10', type: 'line', data: ind.ma10, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f7931a', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'MA20', type: 'line', data: ind.ma20, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#00d4aa', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
        }
        if (indicatorState.EMA && validCloseCount > 26) {
            series.push({ name: 'EMA12', type: 'line', data: ind.ema12, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'EMA26', type: 'line', data: ind.ema26, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#a78bfa', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
        }
        if (indicatorState.BOLL && validCloseCount > 20) {
            series.push({ name: 'BOLL上轨', type: 'line', data: ind.boll.upper, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#e879f9', width: 0.8, type: 'dashed' }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'BOLL中轨', type: 'line', data: ind.boll.middle, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'BOLL下轨', type: 'line', data: ind.boll.lower, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#0ecb81', width: 0.8, type: 'dashed' }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
        }

        let currentSeriesIndex = 2;
        const zoomAxes = [0, 1];

        if (showVol) {
            currentTop += mainHeight + gap;
            grids.push({ left: 10, right: rightMargin, top: currentTop + '%', height: volHeight + '%', containLabel: true });
            xAxes.push({ type: 'category', data: dates, gridIndex: currentSeriesIndex, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: currentSeriesIndex, scale: true, splitLine: { show: false }, axisLabel: { show: false } });
            const volColors = klines.map(k => {
                if (k[0] === '-' || k[1] === '-') return 'transparent';
                return k[1] >= k[0] ? '#0ecb81' : '#f6465d';
            });
            series.push({ name: 'VOL', type: 'bar', data: volumes.map((v, i) => ({ value: (v == null || v === '-') ? null : v, itemStyle: { color: volColors[i] } })), xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, z: 20, barMinWidth: 1 });
            zoomAxes.push(currentSeriesIndex);
            currentSeriesIndex++;
        }

        if (showMacd) {
            if (!showVol) currentTop += mainHeight + gap;
            if (showVol) currentTop += volHeight + gap;
            grids.push({ left: 10, right: rightMargin, top: currentTop + '%', height: macdHeight + '%', containLabel: true });
            xAxes.push({ type: 'category', data: dates, gridIndex: currentSeriesIndex, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: currentSeriesIndex, scale: true, splitLine: { show: false }, axisLabel: { show: false } });

            if (validCloseCount >= 26) {
                const macdResult = ind.macd;
                const macdData = macdResult.macd.map((v, i) => ({
                    value: v == null ? null : v,
                    itemStyle: { color: v == null ? 'transparent' : (v >= 0 ? '#0ecb81' : '#f6465d') }
                }));
                series.push({ name: 'MACD柱', type: 'bar', data: macdData, xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, z: 20, barMinWidth: 1 });
                series.push({ name: 'DIF', type: 'line', data: macdResult.dif, xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, lineStyle: { color: '#00d4aa', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
                series.push({ name: 'DEA', type: 'line', data: macdResult.dea, xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            }
            zoomAxes.push(currentSeriesIndex);
            currentSeriesIndex++;
        }

        // 主图 y 轴范围（纳入 K 线和主图 line 系列）
        let minLow = Infinity, maxHigh = -Infinity;
        for (let i = zoomStartIdx; i <= zoomEndIdx; i++) {
            if (klines[i][0] === '-') continue;
            if (klines[i][2] < minLow) minLow = klines[i][2];
            if (klines[i][3] > maxHigh) maxHigh = klines[i][3];
        }
        series.forEach(s => {
            if (s.type === 'line' && s.yAxisIndex === 1) {
                for (let i = zoomStartIdx; i <= zoomEndIdx; i++) {
                    const v = s.data && s.data[i];
                    if (v == null) continue;
                    const num = parseFloat(v);
                    if (isNaN(num)) continue;
                    if (num < minLow) minLow = num;
                    if (num > maxHigh) maxHigh = num;
                }
            }
        });
        if (currentPrice) { minLow = Math.min(minLow, currentPrice); maxHigh = Math.max(maxHigh, currentPrice); }
        if (!isFinite(minLow)) minLow = 0;
        if (!isFinite(maxHigh)) maxHigh = 100;
        const padding = (maxHigh - minLow) * 0.08 || 5;
        const yMin = minLow - padding, yMax = maxHigh + padding;
        const yInterval = (yMax - yMin) / 23;
        yAxes[0].min = yMin; yAxes[0].max = yMax; yAxes[0].interval = yInterval;
        yAxes[1].min = yMin; yAxes[1].max = yMax; yAxes[1].interval = yInterval;

        // ★ 关键修复：dataZoom 的 start/end 用索引换算的百分比（含 padding 的 totalLen 基准）
        const dzConfig = {
            type: 'inside',
            xAxisIndex: zoomAxes,
            minValueSpan: MIN_VISIBLE_BARS,
            moveOnMouseMove: true,
            moveOnMouseWheel: false,
            start: startPct,
            end: endPct
        };

        // ★ notMerge=true 全量重绘，彻底清除旧结构（指标关闭时能真正消失）
        myChart.setOption({
            animation: false, grid: grids, xAxis: xAxes, yAxis: yAxes, series: series,
            legend: { show: false },
            dataZoom: [dzConfig],
            tooltip: {
                trigger: 'axis', triggerOn: 'mousemove|click', confine: true, backgroundColor: 'rgba(0,0,0,0.8)', borderColor: '#333', borderWidth: 1,
                textStyle: { color: '#fff', fontSize: 10 }, padding: [8, 10],
                axisPointer: { type: 'cross', lineStyle: { color: '#555', type: 'dashed', width: 1 }, crossStyle: { color: '#555', type: 'dashed', width: 1 } },
                formatter: function(params) {
                    if (!params || params.length === 0) return '';
                    const idx = params[0].dataIndex;
                    if (idx == null || idx >= dates.length) return '';
                    const kline = klines[idx];
                    if (kline[0] === '-') return '';
                    const d = dates[idx], o = kline[0], c = kline[1], l = kline[2], h = kline[3];
                    const chg = c - o, pct = o !== 0 ? (chg / o) * 100 : 0, col = chg >= 0 ? '#0ecb81' : '#f6465d';
                    let html = `<div style="font-size:10px;line-height:1.6;"><div style="color:#aaa;">时间：${d}</div><div>开：${formatNum(o)}</div><div>高：${formatNum(h)}</div><div>低：${formatNum(l)}</div><div>收：${formatNum(c)}</div><div style="color:${col};">涨跌幅：${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</div>`;
                    if (volumes[idx] !== '-') html += `<div>成交量：${volumes[idx]}</div>`;
                    html += `</div>`;
                    return html;
                }
            }
        }, true);

        // ★ 关键修复：dataZoom 事件里直接保存绝对索引，不再用百分比
        myChart.off('dataZoom');
        myChart.on('dataZoom', function(params) {
            if (!params.batch) return;
            const dz = params.batch[0];
            let startIdx = Math.floor(dz.start / 100 * (totalLen - 1));
            let endIdx = Math.ceil(dz.end / 100 * (totalLen - 1));
            if (startIdx < 0) startIdx = 0;
            if (endIdx >= totalLen) endIdx = totalLen - 1;
            if (endIdx - startIdx + 1 < MIN_VISIBLE_BARS) {
                startIdx = Math.max(0, endIdx - MIN_VISIBLE_BARS + 1);
            }

            // ★ 关键：索引直接映射到 rawKlines（因为 padding 在后面，索引对应关系不变）
            userZoomStartIdx = startIdx;
            userZoomEndIdx = Math.min(endIdx, realLen - 1);   // 右端不超过最后真实K线
            if (userZoomEndIdx < userZoomStartIdx) userZoomEndIdx = userZoomStartIdx;
            if (userZoomEndIdx - userZoomStartIdx + 1 < MIN_VISIBLE_BARS) {
                userZoomStartIdx = Math.max(0, userZoomEndIdx - MIN_VISIBLE_BARS + 1);
            }

            isUserZoomed = true;
            // followLatest 只表示"右端是否贴最后真实K线"
            followLatest = (realLen - 1 - userZoomEndIdx) <= 2;

            // 只更新 y 轴范围，不改视窗
            let minL = Infinity, maxH = -Infinity;
            for (let i = startIdx; i <= endIdx; i++) {
                if (klines[i][0] === '-') continue;
                if (klines[i][2] < minL) minL = klines[i][2];
                if (klines[i][3] > maxH) maxH = klines[i][3];
            }
            series.forEach(s => {
                if (s.type === 'line' && s.yAxisIndex === 1) {
                    for (let i = startIdx; i <= endIdx; i++) {
                        const v = s.data && s.data[i];
                        if (v == null) continue;
                        const num = parseFloat(v);
                        if (isNaN(num)) continue;
                        if (num < minL) minL = num;
                        if (num > maxH) maxH = num;
                    }
                }
            });
            if (currentPrice) { minL = Math.min(minL, currentPrice); maxH = Math.max(maxH, currentPrice); }
            if (!isFinite(minL)) minL = 0;
            if (!isFinite(maxH)) maxH = 100;
            const pad = (maxH - minL) * 0.08 || 5;
            const newYMin = minL - pad, newYMax = maxH + pad;
            const newYInterval = (newYMax - newYMin) / 23;
            const newXSplitInterval = Math.max(1, Math.floor((endIdx - startIdx) / 25));

            const newYAxes = yAxes.map((ax, i) => {
                if (i === 0 || i === 1) return { min: newYMin, max: newYMax, interval: newYInterval };
                return {};
            });
            const newXAxes = xAxes.map((ax, i) => {
                if (i === 0 || i === 1) return { interval: newXSplitInterval, axisLabel: i === 1 ? { hideOverlap: true } : {} };
                return {};
            });
            myChart.setOption({ yAxis: newYAxes, xAxis: newXAxes });
        });
    }

    function toggleDrawer() {
        isDrawerOpen = !isDrawerOpen;
        const drawer = document.getElementById('rightDrawer');
        const btn = document.getElementById('drawerToggleBtn');
        if (isDrawerOpen) { drawer.classList.remove('collapsed'); btn.innerText = '▶'; btn.style.right = '300px'; }
        else { drawer.classList.add('collapsed'); btn.innerText = '◀'; btn.style.right = '0px'; }
        setTimeout(() => myChart.resize(), 350);
    }
    function switchOrderTab(tab) {
        document.querySelectorAll('.order-tabs span').forEach(s => s.classList.toggle('active', s.innerText.includes(tab === 'depth' ? '深度' : '成交')));
        document.getElementById('orderDataContent').innerHTML = tab === 'depth'
            ? '<div style="color:#888;padding:20px;text-align:center;">盘口深度（演示占位）</div>'
            : '<div style="color:#888;padding:20px;text-align:center;">最新成交（演示占位）</div>';
    }
    function openTradeModal(side) {
        document.getElementById('tradeModalTitle').innerText = (side === 'buy' ? '买入' : '卖出') + ' XAUUSD';
        document.getElementById('tradeModalOverlay').classList.add('show');
    }
    function closeTradeModal() { document.getElementById('tradeModalOverlay').classList.remove('show'); }
    function confirmTrade() { alert('模拟下单已提交（演示环境）'); closeTradeModal(); }

    document.getElementById('indicator-buttons').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-indicator]');
        if (!span) return;
        indicatorState[span.dataset.indicator] = !indicatorState[span.dataset.indicator];
        span.classList.toggle('active', indicatorState[span.dataset.indicator]);
        updateChart();
    });

    document.getElementById('timeframes').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-interval]');
        if (!span || span.dataset.interval === currentInterval) return;
        document.querySelectorAll('#timeframes span[data-interval]').forEach(s => s.classList.remove('active'));
        span.classList.add('active');
        currentInterval = span.dataset.interval;
        chartInitialized = false;
        cachedClosesRef = null;
        loadRealData(currentInterval);
    });

    loadRealData(currentInterval);
    initWebSocket();
    window.addEventListener('resize', () => myChart.resize());
</script>
</body>
</html>
