<script>
    const API_BASE = 'https://cfd.heimi888.com'; 
    const WS_URL = 'wss://cfd.heimi888.com';

    let currentInterval = '15m';
    let rawKlines = [];
    let chartData = { dates: [], klines: [], volumes: [], timestamps: [], alignedCloses: [] };
    const indicatorState = { MA: true, EMA: false, BOLL: false, VOL: false, MACD: false };
    let currentPrice = 0;
    let isDrawerOpen = true;
    let wsConnection = null;
    let chartInitialized = false;

    let userZoomStartIdx = 0;
    let userZoomEndIdx = 0;
    let isUserZoomed = false;
    let followLatest = true;

    const DEFAULT_VISIBLE_BARS = 70;
    const MIN_VISIBLE_BARS = 10;
    const PADDING_BARS = 10; 

    let dailyStats = { open: 0, high: 0, low: 0, prevClose: 0, timestamp: 0 };

    const structState = { fvg: true, msb: true, plan: true };
    const PLAN_CONFIG = { buffer: 5, minRR: 2.0, msbLookback: 20, fvgScanBack: 60, swingLookback: 2, atrPeriod: 14, atrMultiplier: 1.5 };
    let structResult = { fvg: null, fvgs: [], msb: null, plan: null, support: null, resistance: null };

    let tickBufferPrice = null;
    let tickBufferTs = null;
    let lastRenderTime = 0;
    const RENDER_THROTTLE_MS = 250; 

    let dataZoomTimer = null;

    function showToast(msg, type = 'error') {
        const el = document.createElement('div');
        el.textContent = msg;
        el.style.cssText = `position:fixed;top:50px;left:50%;transform:translateX(-50%);
            background:${type==='error'?'#f6465d':'#0ecb81'};color:#fff;padding:8px 16px;
            border-radius:6px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;
            box-shadow:0 4px 16px rgba(0,0,0,.6);`;
        document.body.appendChild(el);
        requestAnimationFrame(() => el.style.opacity = '1');
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 3000);
    }

    function processTickUpdate() {
        if (tickBufferPrice === null) return;
        const price = tickBufferPrice;
        const ts = tickBufferTs;
        
        if (chartInitialized && rawKlines.length > 0) {
            executeKlineUpdateFromTick(price, ts);
        } else {
            updateHeaderUI(price); 
        }

        tickBufferPrice = null;
        tickBufferTs = null;
    }

    class Indicators {
        static SMA(data, period) {
            const result = new Array(data.length).fill(null);
            for (let i = period - 1; i < data.length; i++) {
                let sum = 0, valid = true;
                for (let j = i - period + 1; j <= i; j++) {
                    if (data[j] === null || data[j] === undefined) { valid = false; break; }
                    sum += data[j];
                }
                result[i] = valid ? sum / period : null;
            }
            return result;
        }
        static EMA(data, period) {
            const result = new Array(data.length).fill(null);
            let prev = null, count = 0;
            const k = 2 / (period + 1);
            for (let i = 0; i < data.length; i++) {
                const v = data[i];
                if (v === null || v === undefined) { result[i] = null; continue; }
                if (prev === null) { result[i] = v; prev = v; count = 1; }
                else {
                    count++;
                    if (count <= period) { prev = prev + (v - prev) / count; } else { prev = v * k + prev * (1 - k); }
                    result[i] = prev;
                }
            }
            return result;
        }
        static BOLL(data, period = 20, stdDev = 2) {
            const middle = this.SMA(data, period);
            const upper = new Array(data.length).fill(null);
            const lower = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) {
                if (middle[i] === null) continue;
                let sum = 0, valid = true;
                for (let j = i - period + 1; j <= i; j++) {
                    if (data[j] === null || data[j] === undefined) { valid = false; break; }
                    sum += Math.pow(data[j] - middle[i], 2);
                }
                if (!valid) continue;
                const std = Math.sqrt(sum / period);
                upper[i] = middle[i] + stdDev * std;
                lower[i] = middle[i] - stdDev * std;
            }
            return { upper, middle, lower };
        }
        static MACD(data, fast = 12, slow = 26, signal = 9) {
            const emaFast = this.EMA(data, fast);
            const emaSlow = this.EMA(data, slow);
            const dif = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) {
                if (emaFast[i] !== null && emaSlow[i] !== null) dif[i] = emaFast[i] - emaSlow[i];
            }
            const dea = this.EMA(dif, signal);
            const macd = new Array(data.length).fill(null);
            for (let i = 0; i < data.length; i++) {
                if (dif[i] !== null && dea[i] !== null) macd[i] = (dif[i] - dea[i]) * 2;
            }
            return { dif, dea, macd };
        }
        static ATR(klines, period = 14) {
            const result = new Array(klines.length).fill(null);
            for (let i = 1; i < klines.length; i++) {
                const high = klines[i].h;
                const low = klines[i].l;
                const prevClose = klines[i - 1].c;
                const tr = Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
                if (i === 1) result[i] = tr;
                else result[i] = (result[i - 1] * (period - 1) + tr) / period;
            }
            return result;
        }
    }

    function detectFVGs(klines, opts = {}) {
        const n = klines.length;
        if (n < 5) return [];
        const atrArr = Indicators.ATR(klines, PLAN_CONFIG.atrPeriod);
        const atr = atrArr[n - 1] || 1;
        const ema20 = Indicators.EMA(klines.map(k => k.c), 20);
        const emaSlope = (ema20[n - 1] && ema20[Math.max(0, n - 5)])
            ? (ema20[n - 1] - ema20[Math.max(0, n - 5)]) / atr : 0;

        const scanBack = opts.scanBack || PLAN_CONFIG.fvgScanBack;
        const start = Math.max(2, n - scanBack);
        const results = [];

        for (let i = n - 1; i >= start; i--) {
            const cur = klines[i], prev2 = klines[i - 2];
            if (!prev2 || !cur) continue;
            const mid = klines[i - 1];
            const body = Math.abs(mid.c - mid.o);

            let type = null, top = 0, bottom = 0;
            if (cur.l > prev2.h) { type = 'bull'; top = cur.l; bottom = prev2.h; }
            else if (cur.h < prev2.l) { type = 'bear'; top = prev2.l; bottom = cur.h; }
            if (!type) continue;

            const displacement = Math.min(1, body / (atr * 1.0));
            if (displacement < 0.3) continue;

            let filled = 0, invalidated = false;
            const gapSize = top - bottom;
            for (let j = i + 1; j < n; j++) {
                const k = klines[j];
                if (type === 'bull') {
                    if (k.c < bottom) { invalidated = true; break; }
                    if (k.l < top) filled = Math.max(filled, (top - k.l) / gapSize);
                } else {
                    if (k.c > top) { invalidated = true; break; }
                    if (k.h > bottom) filled = Math.max(filled, (k.h - bottom) / gapSize);
                }
            }
            if (invalidated) continue;

            const freshness = 1 - (n - 1 - i) / scanBack;
            const trendAligned = (type === 'bull' && emaSlope > 0) || (type === 'bear' && emaSlope < 0) ? 1 : 0;

            const score = Math.round(displacement * 40 + freshness * 25 + (1 - filled) * 20 + trendAligned * 15);
            if (score < 50) continue;

            results.push({
                type, top, bottom, index: i, startIndex: i - 2,
                score, filled: +filled.toFixed(2), displacement: +displacement.toFixed(2),
                freshness: +freshness.toFixed(2), trendAligned
            });
        }
        return results.sort((a, b) => b.score - a.score).slice(0, 5);
    }

    function findSwingPoints(klines, lookback = 2) {
        const highs = [], lows = [];
        for (let i = lookback; i < klines.length - lookback; i++) {
            let isHigh = true, isLow = true;
            for (let j = 1; j <= lookback; j++) {
                if (klines[i].h <= klines[i - j].h || klines[i].h <= klines[i + j].h) isHigh = false;
                if (klines[i].l >= klines[i - j].l || klines[i].l >= klines[i + j].l) isLow = false;
            }
            if (isHigh) highs.push({ price: klines[i].h, index: i });
            if (isLow)  lows.push({ price: klines[i].l, index: i });
        }
        return { highs, lows };
    }

    function detectMSB(klines) {
        const n = klines.length;
        if (n < PLAN_CONFIG.msbLookback + 5) return null;
        const atrArr = Indicators.ATR(klines, PLAN_CONFIG.atrPeriod);
        const atr = atrArr[n - 1] || 1;

        const { highs, lows } = findSwingPoints(klines, PLAN_CONFIG.swingLookback);
        const validHighs = highs.filter((h, i) => {
            const prev = highs[i - 1];
            return !prev || Math.abs(h.price - prev.price) >= atr * 0.5;
        });
        const validLows = lows.filter((l, i) => {
            const prev = lows[i - 1];
            return !prev || Math.abs(l.price - prev.price) >= atr * 0.5;
        });

        if (!validHighs.length && !validLows.length) return null;

        const lastHigh = validHighs[validHighs.length - 1];
        const lastLow  = validLows[validLows.length - 1];
        const latest = klines[n - 1];
        const latestBody = Math.abs(latest.c - latest.o);

        const bullBroken = lastHigh && latest.c > lastHigh.price && latestBody >= atr * 0.3;
        const bearBroken = lastLow  && latest.c < lastLow.price  && latestBody >= atr * 0.3;

        function classify(kind, swingArr) {
            if (swingArr.length < 2) return 'BOS';
            const a = swingArr[swingArr.length - 2], b = swingArr[swingArr.length - 1];
            const rising = b.price > a.price;
            if (kind === 'bull') return rising ? 'BOS' : 'CHoCH';
            return rising ? 'CHoCH' : 'BOS';
        }

        let result = null;
        if (bullBroken) {
            result = {
                type: 'bull', price: lastHigh.price, index: lastHigh.index,
                broken: true, kind: classify('bull', validHighs),
                strength: +((latest.c - lastHigh.price) / atr).toFixed(2)
            };
        } else if (bearBroken) {
            result = {
                type: 'bear', price: lastLow.price, index: lastLow.index,
                broken: true, kind: classify('bear', validLows),
                strength: +((lastLow.price - latest.c) / atr).toFixed(2)
            };
        } else {
            const useHigh = lastHigh && (!lastLow || lastHigh.index > lastLow.index);
            const sw = useHigh ? lastHigh : lastLow;
            if (!sw) return null;
            result = {
                type: useHigh ? 'bull' : 'bear', price: sw.price, index: sw.index,
                broken: false, kind: 'BOS', strength: 0
            };
        }
        return result;
    }

    function buildPlan(klines, fvg, msb) {
        if (!klines.length) return null;
        const latest = klines[klines.length - 1];
        const lastClose = latest.c;
        const isBull = !fvg || fvg.type === 'bull';

        let entry, sl, tp, risk, reward;
        
        const atrArr = Indicators.ATR(klines, PLAN_CONFIG.atrPeriod);
        const currentAtr = atrArr[klines.length - 1] || 5; 
        
        const { highs, lows } = findSwingPoints(klines, PLAN_CONFIG.swingLookback);

        if (isBull) {
            if (fvg && lastClose > fvg.top) entry = fvg.top;
            else if (fvg && lastClose <= fvg.top && lastClose >= fvg.bottom) entry = lastClose;
            else entry = lastClose;
            
            const atrSL = entry - currentAtr * PLAN_CONFIG.atrMultiplier;
            const fvgSL = fvg ? fvg.bottom - PLAN_CONFIG.buffer : atrSL;
            sl = Math.min(atrSL, fvgSL);
            risk = entry - sl;

            let naturalTP = entry + (risk * 2);
            for (let i = highs.length - 1; i >= 0; i--) {
                if (highs[i].price > entry + (risk * 1.8)) {
                    naturalTP = highs[i].price;
                    break; 
                }
            }
            tp = Math.max(naturalTP, entry + (risk * PLAN_CONFIG.minRR));
            reward = tp - entry;
        } else {
            if (fvg && lastClose < fvg.bottom) entry = fvg.bottom;
            else if (fvg && lastClose <= fvg.top && lastClose >= fvg.bottom) entry = lastClose;
            else entry = lastClose;
            
            const atrSL = entry + currentAtr * PLAN_CONFIG.atrMultiplier;
            const fvgSL = fvg ? fvg.top + PLAN_CONFIG.buffer : atrSL;
            sl = Math.max(atrSL, fvgSL);
            risk = sl - entry;

            let naturalTP = entry - (risk * 2);
            for (let i = lows.length - 1; i >= 0; i--) {
                if (lows[i].price < entry - (risk * 1.8)) {
                    naturalTP = lows[i].price;
                    break;
                }
            }
            tp = Math.min(naturalTP, entry - (risk * PLAN_CONFIG.minRR));
            reward = entry - tp;
        }

        const rr = risk > 0 ? +(reward / risk).toFixed(2) : 0;
        
        let status = 'invalid';
        if (rr >= PLAN_CONFIG.minRR) {
            if (isBull) {
                if (lastClose < sl) status = 'fail';
                else if (lastClose <= entry) status = 'ready';
                else status = 'wait';
            } else {
                if (lastClose > sl) status = 'fail';
                else if (lastClose >= entry) status = 'ready';
                else status = 'wait';
            }
        }

        return {
            type: isBull ? 'bull' : 'bear',
            entry: +entry.toFixed(2), sl: +sl.toFixed(2), tp: +tp.toFixed(2),
            risk: +risk.toFixed(2), reward: +reward.toFixed(2), rr: rr, status: status,
            pnlPercent: entry > 0 ? +((reward / entry) * 100).toFixed(2) : 0,
            valid: status !== 'invalid' && status !== 'fail', latest: +lastClose.toFixed(2), fvg, msb
        };
    }

    function getLatestSupportResistance(klines) {
        const { highs, lows } = findSwingPoints(klines, PLAN_CONFIG.swingLookback);
        const latestPrice = klines[klines.length - 1].c;
        
        let resistance = null;
        for (let i = highs.length - 1; i >= 0; i--) {
            if (highs[i].price > latestPrice) {
                resistance = highs[i];
                break;
            }
        }
        
        let support = null;
        for (let i = lows.length - 1; i >= 0; i--) {
            if (lows[i].price < latestPrice) {
                support = lows[i];
                break;
            }
        }
        return { support, resistance };
    }

    function runStructAnalysis() {
        if (!rawKlines.length) {
            structResult = { fvg: null, fvgs: [], msb: null, plan: null, support: null, resistance: null };
            updateRRPanel();
            updateOrderDataPanel();
            return;
        }
        const fvgs = detectFVGs(rawKlines);
        const fvg = fvgs[0] || null;
        const msb = detectMSB(rawKlines);
        const plan = buildPlan(rawKlines, fvg, msb);
        const { support, resistance } = getLatestSupportResistance(rawKlines);
        
        structResult = { fvg, fvgs, msb, plan, support, resistance };
        updateRRPanel();
        updateOrderDataPanel();
    }

    function formatNum(num, decimals = 2) { const n = parseFloat(num); if (isNaN(n)) return '--'; return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
    function formatKlineDate(timestamp, interval) {
        const d = new Date(timestamp);
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const date = d.getDate().toString().padStart(2, '0');
        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');
        if (interval === '1d') return `${month}-${date}`;
        if (interval === '4h') return `${month}-${date} ${hours}:00`;
        return `${hours}:${minutes}`;
    }
    function getIntervalMs(interval) {
        const map = { '1m': 60000, '5m': 300000, '15m': 900000, '30m': 1800000, '1h': 3600000, '4h': 14400000, '1d': 86400000 };
        return map[interval] || 900000;
    }

    const chartDom = document.getElementById('kline');
    const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

    function rebuildChartDataFromRaw() {
        const intervalMs = getIntervalMs(currentInterval);
        const dates = [], klines = [], volumes = [], timestamps = [], alignedCloses = [];
        rawKlines.forEach(item => {
            timestamps.push(item.t);
            dates.push(formatKlineDate(item.t, currentInterval));
            klines.push([item.o, item.c, item.l, item.h]);
            volumes.push(item.v != null ? item.v : 1000);
            alignedCloses.push(item.c);
        });
        
        if (timestamps.length > 0) {
            const lastTs = timestamps[timestamps.length - 1];
            for (let i = 1; i <= PADDING_BARS; i++) {
                const ts = lastTs + i * intervalMs;
                timestamps.push(ts);
                dates.push(formatKlineDate(ts, currentInterval));
                klines.push(['-', '-', '-', '-']);
                volumes.push('-');
                alignedCloses.push(null);
            }
        }
        chartData = { dates, klines, volumes, timestamps, alignedCloses };

        const realLen = rawKlines.length;
        if (realLen === 0) return;

        if (!isUserZoomed) {
            const visible = Math.min(DEFAULT_VISIBLE_BARS, realLen);
            userZoomStartIdx = Math.max(0, realLen - visible);
            userZoomEndIdx = realLen + PADDING_BARS - 1;
            followLatest = true;
        } else if (followLatest) {
            const visibleCount = userZoomEndIdx - userZoomStartIdx + 1;
            userZoomEndIdx = realLen + PADDING_BARS - 1;
            userZoomStartIdx = Math.max(0, userZoomEndIdx - visibleCount + 1);
        } else {
            if (userZoomEndIdx >= realLen) userZoomEndIdx = realLen + PADDING_BARS - 1;
            if (userZoomStartIdx < 0) userZoomStartIdx = 0;
            if (userZoomEndIdx - userZoomStartIdx + 1 < MIN_VISIBLE_BARS) {
                userZoomStartIdx = Math.max(0, userZoomEndIdx - MIN_VISIBLE_BARS + 1);
            }
        }
    }

    async function loadDailyStats() {
        try {
            const res = await fetch(`${API_BASE}/api/kline?interval=1d&limit=5`);
            const json = await res.json();
            if (json.success && json.data && json.data.length > 0) {
                const data = json.data;
                const lastK = data[data.length - 1];
                const now = new Date();
                const todayStr = now.toDateString();
                const lastKDate = new Date(lastK.t).toDateString();
                
                if (todayStr === lastKDate) {
                    dailyStats = {
                        open: parseFloat(lastK.o), high: parseFloat(lastK.h), low: parseFloat(lastK.l),
                        prevClose: data.length > 1 ? parseFloat(data[data.length - 2].c) : parseFloat(lastK.o), timestamp: lastK.t
                    };
                } else {
                    const prevK = data[data.length - 1];
                    dailyStats = {
                        open: parseFloat(prevK.c), high: parseFloat(prevK.c), low: parseFloat(prevK.c),
                        prevClose: parseFloat(prevK.c), timestamp: prevK.t
                    };
                }
            }
        } catch (e) {
            console.error('获取日线基准数据失败:', e);
        }
    }

    function updateHeaderUI(currentTickPrice = null) {
        if (!rawKlines.length) return;
        const last = rawKlines[rawKlines.length - 1];
        const close = currentTickPrice || last.c;
        
        let todayHigh = dailyStats.high;
        let todayLow = dailyStats.low;
        if (todayHigh === dailyStats.prevClose || todayLow === dailyStats.prevClose) {
            todayHigh = Math.max(todayHigh, close);
            todayLow = Math.min(todayLow, close);
        } else {
            todayHigh = Math.max(todayHigh, close);
            todayLow = Math.min(todayLow, close);
        }
        
        const todayOpen = dailyStats.open;
        const change = ((close - todayOpen) / todayOpen) * 100;

        document.getElementById('last-price').innerText = formatNum(close);
        document.getElementById('open-price').innerText = formatNum(todayOpen);
        document.getElementById('high-24').innerText = formatNum(todayHigh);
        document.getElementById('low-24').innerText = formatNum(todayLow);
        document.getElementById('prev-close').innerText = formatNum(dailyStats.prevClose);
        
        const changeHtml = `<span class="${change >= 0 ? 'green' : 'red'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;
        document.getElementById('cn-price').innerHTML = `$${formatNum(close)} ${changeHtml}`;
    }

    function estimateTickVolume(prevPrice, price) {
        if (!isFinite(prevPrice) || !isFinite(price)) return 1;
        const delta = Math.abs(price - prevPrice);
        return Math.max(1, delta / 0.01 * 0.5);
    }

    function executeKlineUpdateFromTick(price, tickTimestamp) {
        if (rawKlines.length === 0) return;
        const intervalMs = getIntervalMs(currentInterval);
        const lastItem = rawKlines[rawKlines.length - 1];
        const lastBarStartTs = Math.floor(lastItem.t / intervalMs) * intervalMs;
        const currentBarStartTs = Math.floor(tickTimestamp / intervalMs) * intervalMs;
        
        let isNewBar = false;
        if (currentBarStartTs === lastBarStartTs) {
            lastItem.c = price;
            if (price > lastItem.h) lastItem.h = price;
            if (price < lastItem.l) lastItem.l = price;
            if (lastItem.v != null) {
                lastItem.v += estimateTickVolume(lastItem._prevPrice ?? price, price);
            }
            lastItem._prevPrice = price;
        } else if (currentBarStartTs > lastBarStartTs) {
            rawKlines.push({ t: currentBarStartTs, o: price, h: price, l: price, c: price, v: 1, _prevPrice: price });
            isNewBar = true;
        } else return;

        cachedClosesRef = null;
        cachedIndicators = {};

        runStructAnalysis();
        updateHeaderUI(price);
        
        updateChartIncremental(price, isNewBar);
    }

    function updateChartIncremental(price, isNewBar) {
        if (!chartInitialized) return;
        
        if (isNewBar) {
            rebuildChartDataFromRaw();
            updateChart();
            return;
        }
        
        const realLen = rawKlines.length;
        const lastItem = rawKlines[realLen - 1];
        
        chartData.klines[realLen - 1] = [lastItem.o, lastItem.c, lastItem.l, lastItem.h];
        chartData.volumes[realLen - 1] = lastItem.v;
        
        const lastKline = chartData.klines[realLen - 1];
        let isUp = true;
        if (lastKline && lastKline[0] !== '-') isUp = lastKline[1] >= lastKline[0];
        const activeColor = isUp ? '#0ecb81' : '#f6465d';

        myChart.setOption({
            series: [{
                id: 'klineMain',
                data: chartData.klines,
                markLine: {
                    symbol: 'none', animation: false, lineStyle: { type: 'dashed', width: 1 }, 
                    label: { position: 'end', distance: 2, color: '#181a20', backgroundColor: activeColor, padding: [2, 4], borderRadius: 2, fontSize: 11, formatter: function(params) { return formatNum(params.value, 2); } }, 
                    data: [
                        { yAxis: price, lineStyle: { color: activeColor, type: 'dashed', width: 1 }, label: { formatter: formatNum(price, 2), color: '#181a20', backgroundColor: activeColor, padding: [2, 4], borderRadius: 2, fontSize: 11, distance: 2 } }
                    ]
                }
            }]
        });
    }

    async function loadRealData(interval) {
        try {
            rawKlines = [];
            structResult = { fvg: null, fvgs: [], msb: null, plan: null, support: null, resistance: null };
            cachedClosesRef = null;
            cachedIndicators = {};
            updateRRPanel();
            updateOrderDataPanel();

            const res = await fetch(`${API_BASE}/api/kline?interval=${interval}&limit=500`);
            const json = await res.json();
            if (!json.success || !json.data) throw new Error('K线获取失败');
            rawKlines = json.data.map(item => ({
                t: item.t, o: parseFloat(item.o), h: parseFloat(item.h), l: parseFloat(item.l), c: parseFloat(item.c), v: item.v != null ? parseFloat(item.v) : null
            }));
            currentPrice = rawKlines[rawKlines.length - 1].c;

            isUserZoomed = false;
            followLatest = true;
            userZoomStartIdx = 0;
            userZoomEndIdx = 0;

            loadDailyStats().then(() => { updateHeaderUI(); });
            
            rebuildChartDataFromRaw();
            runStructAnalysis();
            chartInitialized = true;
            updateHeaderUI(); 
            updateChart();
        } catch (e) {
            console.error('获取 K 线失败:', e);
            showToast('数据加载失败: ' + e.message);
        }
    }

    let wsRetry = 0;
    function initWebSocket() {
        if (wsConnection) wsConnection.close();
        wsConnection = new WebSocket(WS_URL);
        wsConnection.onopen = () => { wsRetry = 0; };
        wsConnection.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'ticker') {
                const tick = msg.data;
                const price = parseFloat(tick.last);
                const tickTimestamp = msg.timestamp || Date.now();
                
                currentPrice = price;
                document.getElementById('sell-bar').innerText = `卖 ${formatNum(tick.ask)}`;
                document.getElementById('buy-bar').innerText = `买 ${formatNum(tick.bid)}`;

                tickBufferPrice = price;
                tickBufferTs = tickTimestamp;

                const now = Date.now();
                if (now - lastRenderTime >= RENDER_THROTTLE_MS) {
                    lastRenderTime = now;
                    processTickUpdate();
                } else {
                    if (!window._tickTimer) {
                        window._tickTimer = setTimeout(() => {
                            window._tickTimer = null;
                            lastRenderTime = Date.now();
                            processTickUpdate();
                        }, RENDER_THROTTLE_MS - (now - lastRenderTime));
                    }
                }
            }
        };
        wsConnection.onclose = () => {
            const delay = Math.min(30000, 1000 * Math.pow(2, wsRetry++));
            showToast(`连接断开，${(delay/1000).toFixed(0)}s 后重连（第 ${wsRetry} 次）`, 'error');
            setTimeout(initWebSocket, delay);
        };
    }

    let cachedClosesRef = null;
    let cachedIndicators = {};

    function getIndicators(closesForIndicator) {
        if (cachedClosesRef === closesForIndicator) return cachedIndicators;
        cachedClosesRef = closesForIndicator;
        cachedIndicators = {
            ma5: Indicators.SMA(closesForIndicator, 5),
            ma10: Indicators.SMA(closesForIndicator, 10),
            ma20: Indicators.SMA(closesForIndicator, 20),
            ema12: Indicators.EMA(closesForIndicator, 12),
            ema26: Indicators.EMA(closesForIndicator, 26),
            boll: Indicators.BOLL(closesForIndicator, 20, 2),
            macd: Indicators.MACD(closesForIndicator)
        };
        return cachedIndicators;
    }

    // ====== 核心修改：多等待区 + 固定宽度 FVG ======
    function buildStructMarks(klines, dates) {
        const marks = { markAreas: [], markLines: [], markPoints: [] };
        const p = structResult.plan;
        
        if (structResult.support) {
            marks.markLines.push({
                name: '支撑结构',
                xAxis: dates[structResult.support.index], yAxis: structResult.support.price,
                lineStyle: { color: '#0ecb81', type: 'dashed', width: 1.5, opacity: 0.7 },
                label: { show: true, position: 'insideEndTop', color: '#0ecb81', fontSize: 10, fontWeight: 'bold', formatter: `支撑结构 ${structResult.support.price.toFixed(1)}` }
            });
        }
        if (structResult.resistance) {
            marks.markLines.push({
                name: '阻力结构',
                xAxis: dates[structResult.resistance.index], yAxis: structResult.resistance.price,
                lineStyle: { color: '#f6465d', type: 'dashed', width: 1.5, opacity: 0.7 },
                label: { show: true, position: 'insideEndTop', color: '#f6465d', fontSize: 10, fontWeight: 'bold', formatter: `阻力结构 ${structResult.resistance.price.toFixed(1)}` }
            });
        }

        if (!p) return marks;

        // 绘制多个 FVG 和 等待区
        if (structState.fvg && structResult.fvgs.length) {
            structResult.fvgs.forEach((f, rank) => {
                const isBull = f.type === 'bull';
                const startX = dates[f.startIndex];
                // 修改：FVG 宽度固定为 7 根 K 线
                const endIdx = Math.min(klines.length - 1, f.startIndex + 6);
                const endX = dates[endIdx];
                
                const isPrimary = rank === 0;
                const baseColor = isBull ? '#26a69a' : '#ef5350';
                const fillAlpha = isPrimary ? 0.18 : 0.08;
                const fillColor = isBull ? `rgba(38,166,154,${fillAlpha})` : `rgba(239,83,80,${fillAlpha})`;

                // 1. FVG 矩形
                marks.markAreas.push([
                    {
                        name: `${isBull ? '看涨' : '看跌'} FVG #${rank + 1}`,
                        xAxis: startX, yAxis: f.bottom,
                        itemStyle: { color: fillColor, borderColor: baseColor, borderWidth: isPrimary ? 1.5 : 1, borderType: 'dashed', opacity: isPrimary ? 1 : 0.7 },
                        label: { show: true, position: 'insideTopLeft', color: baseColor, fontSize: isPrimary ? 10 : 9, fontWeight: isPrimary ? 'bold' : 'normal', formatter: `${isPrimary ? '★ ' : ''}FVG${rank + 1} ${f.bottom.toFixed(1)}~${f.top.toFixed(1)}` }
                    },
                    { xAxis: endX, yAxis: f.top }
                ]);

                // 2. 等待入场区阴影（为每个有效 FVG 绘制）
                // 以 FVG 的上沿/下沿为基准，加上一定缓冲画出黄色等待区
                const entryLevel = isBull ? f.top : f.bottom;
                const buffer = isBull ? (f.top - f.bottom) * 0.2 : (f.top - f.bottom) * 0.2;
                
                marks.markAreas.push([
                    { 
                        name: '等待回踩区', 
                        xAxis: startX, 
                        yAxis: isBull ? entryLevel - buffer : entryLevel - buffer, 
                        itemStyle: { color: 'rgba(240,185,11,0.10)', borderColor: '#f0b90b', borderWidth: 1, borderType: 'dotted' },
                        label: { show: isPrimary, position: 'insideCenter', color: '#f0b90b', fontSize: 10, fontWeight: 'bold', formatter: `等待区` } 
                    },
                    { xAxis: endX, yAxis: isBull ? entryLevel + buffer : entryLevel + buffer }
                ]);
            });
        }

        // MSB 和 整体计划不变
        if (structState.msb && p.msb) {
            const m = p.msb;
            const isBull = m.type === 'bull';
            const color = m.kind === 'CHoCH' ? '#ff9800' : '#2962ff';
            
            marks.markLines.push({
                name: 'MSB',
                xAxis: dates[m.index], yAxis: m.price,
                lineStyle: { color, type: m.broken ? 'solid' : 'dashed', width: m.broken ? 2 : 1.2 },
                label: { show: true, position: 'insideEndTop', color, fontSize: 10, fontWeight: 'bold', backgroundColor: 'rgba(24,26,32,0.85)', padding: [2, 4], borderRadius: 3, formatter: `MSB ${m.kind}` }
            });

            if (m.broken) {
                marks.markPoints.push({
                    coord: [dates[m.index], m.price],
                    symbol: isBull ? 'pin' : 'pin',
                    symbolRotate: isBull ? 0 : 180,
                    symbolSize: 45,
                    symbolOffset: isBull ? [0, '-50%'] : [0, '50%'],
                    itemStyle: { color: isBull ? '#0ecb81' : '#f6465d', borderColor: '#181a20', borderWidth: 2 },
                    label: { show: true, position: 'inside', color: '#fff', fontSize: 11, fontWeight: 'bold', formatter: isBull ? '🟢 买涨' : '🔴 买跌' }
                });
            }
        }

        if (structState.plan && p.valid) {
            // 主计划的色块保留（原有的利润/风险空间）
            const startIdx = p.fvg ? p.fvg.startIndex : Math.max(0, klines.length - 5);
            const endIdx = klines.length - 1;
            const startX = dates[startIdx];
            const endX = dates[endIdx];
            const isBull = p.type === 'bull';

            marks.markAreas.push([
                { name: '利润空间', xAxis: startX, yAxis: p.entry, itemStyle: { color: 'rgba(14,203,129,0.06)' },
                  label: { show: true, position: 'insideTop', color: '#0ecb81', fontSize: 10, formatter: `目标 +${p.reward.toFixed(1)}` } },
                { xAxis: endX, yAxis: p.tp }
            ]);
            marks.markAreas.push([
                { name: '风险空间', xAxis: startX, yAxis: p.sl, itemStyle: { color: 'rgba(246,70,93,0.06)' },
                  label: { show: true, position: isBull ? 'insideBottom' : 'insideTop', color: '#f6465d', fontSize: 10, formatter: `止损 -${p.risk.toFixed(1)}` } },
                { xAxis: endX, yAxis: p.entry }
            ]);

            marks.markLines.push(
                { name: '入场', yAxis: p.entry, lineStyle: { color: '#f0b90b', type: 'solid', width: 1.5 },
                  label: { show: true, position: 'end', color: '#181a20', backgroundColor: '#f0b90b', padding: [4,6], borderRadius: 2, fontSize: 11, fontWeight: 'bold', formatter: `入场区域 ${p.entry.toFixed(1)}` } },
                { name: '止损', yAxis: p.sl, lineStyle: { color: '#f6465d', type: 'solid', width: 2 },
                  label: { show: true, position: 'end', color: '#fff', backgroundColor: '#f6465d', padding: [4,6], borderRadius: 2, fontSize: 11, fontWeight: 'bold', formatter: `🛑 止损 ${p.sl.toFixed(1)}` } },
                { name: '止盈', yAxis: p.tp, lineStyle: { color: '#0ecb81', type: 'dashed', width: 1.5 },
                  label: { show: true, position: 'end', color: '#181a20', backgroundColor: '#0ecb81', padding: [2,4], borderRadius: 2, fontSize: 10, formatter: `止盈 ${p.tp.toFixed(1)}` } }
            );

            if (p.status === 'ready') {
                marks.markPoints.push({
                    coord: [dates[klines.length - 1], p.entry],
                    symbol: 'triangle',
                    symbolRotate: p.type === 'bull' ? 0 : 180,
                    symbolSize: 18,
                    itemStyle: { color: '#f0b90b', borderColor: '#181a20', borderWidth: 2 },
                    label: { show: true, position: isBull ? 'bottom' : 'top', color: '#f0b90b', fontSize: 12, fontWeight: 'bold', formatter: '进场' }
                });
            }
        }
        return marks;
    }

    function calculateYRange(startIdx, endIdx, klines, series, plan) {
        let minLow = Infinity, maxHigh = -Infinity;
        for (let i = startIdx; i <= endIdx; i++) {
            if (klines[i][0] === '-') continue;
            if (klines[i][2] < minLow) minLow = klines[i][2];
            if (klines[i][3] > maxHigh) maxHigh = klines[i][3];
        }
        if (plan && plan.valid) {
            minLow = Math.min(minLow, plan.sl);
            maxHigh = Math.max(maxHigh, plan.tp);
        }
        series.forEach(s => {
            if (s.type === 'line' && s.yAxisIndex === 1) {
                for (let i = startIdx; i <= endIdx; i++) {
                    const v = s.data && s.data[i];
                    if (v == null) continue;
                    const num = parseFloat(v);
                    if (isNaN(num)) continue;
                    if (num < minLow) minLow = num;
                    if (num > maxHigh) maxHigh = num;
                }
            }
        });
        if (currentPrice) { 
            minLow = Math.min(minLow, currentPrice); 
            maxHigh = Math.max(maxHigh, currentPrice); 
        }
        if (!isFinite(minLow)) minLow = 0;
        if (!isFinite(maxHigh)) maxHigh = 100;
        const padding = (maxHigh - minLow) * 0.08 || 5;
        
        let yInterval;
        if (['1m', '5m', '15m', '30m'].includes(currentInterval)) {
            yInterval = 5; 
        } else {
            yInterval = (maxHigh + padding - (minLow - padding)) / 23;
        }

        return {
            yMin: minLow - padding,
            yMax: maxHigh + padding,
            yInterval: yInterval
        };
    }

    function updateChart() {
        if (!chartInitialized || !chartData.dates.length) return;
        const { dates, klines, volumes, alignedCloses } = chartData;
        const realLen = rawKlines.length;
        const totalLen = dates.length;

        let zoomStartIdx = Math.max(0, Math.min(userZoomStartIdx, totalLen - 1));
        let zoomEndIdx = Math.max(0, Math.min(userZoomEndIdx, totalLen - 1)); 
        if (zoomEndIdx - zoomStartIdx + 1 < MIN_VISIBLE_BARS) {
            zoomEndIdx = Math.min(totalLen - 1, zoomStartIdx + MIN_VISIBLE_BARS - 1);
        }

        const startPct = (zoomStartIdx / Math.max(1, totalLen - 1)) * 100;
        const endPct = (zoomEndIdx / Math.max(1, totalLen - 1)) * 100;

        const showVol = indicatorState.VOL, showMacd = indicatorState.MACD;
        let mainHeight = 100, volHeight = 0, macdHeight = 0;
        const gap = 6;
        if (showVol && showMacd) { mainHeight = 60; volHeight = 15; macdHeight = 15; }
        else if (showVol || showMacd) { mainHeight = 75; volHeight = showVol ? 20 : 0; macdHeight = showMacd ? 20 : 0; }

        const grids = [], xAxes = [], yAxes = [], series = [];
        let currentTop = 2;
        
        const rightMarginPx = 65; 
        const xSplitInterval = Math.max(1, Math.floor((zoomEndIdx - zoomStartIdx) / 25));

        grids.push({ left: 10, right: rightMarginPx, top: currentTop + '%', height: mainHeight + '%', containLabel: false });
        xAxes.push({
            type: 'category', data: dates, gridIndex: 0,
            axisLine: { show: false }, axisTick: { show: false },
            splitLine: { show: true, lineStyle: { color: '#2b3139', type: 'dashed', opacity: 0.5 } },
            axisLabel: { show: false }, interval: xSplitInterval
        });
        yAxes.push({
            scale: true, position: 'right', gridIndex: 0,
            splitLine: { show: true, lineStyle: { color: '#2b3139', type: 'dashed', opacity: 0.5 } },
            axisLabel: { color: '#848e9c', fontSize: 10, inside: false, margin: 0, width: 70, align: 'left', formatter: v => formatNum(v, 2), showMinLabel: true, showMaxLabel: true }
        });

        grids.push({ left: 10, right: rightMarginPx, top: currentTop + '%', height: mainHeight + '%', containLabel: false });
        xAxes.push({
            type: 'category', data: dates, gridIndex: 1,
            axisLine: { show: false }, axisTick: { show: false },
            axisLabel: { show: true, color: '#848e9c', fontSize: 10, margin: 6, hideOverlap: true, position: 'bottom' }
        });
        yAxes.push({ scale: true, position: 'right', gridIndex: 1, splitLine: { show: false }, axisLabel: { show: false } });

        const lastRealIdx = realLen > 0 ? realLen - 1 : 0;
        const lastKline = klines[lastRealIdx];
        let isUp = true;
        if (lastKline && lastKline[0] !== '-') {
            isUp = lastKline[1] >= lastKline[0];
        }
        const activeColor = isUp ? '#0ecb81' : '#f6465d';

        const structMarks = buildStructMarks(klines, dates);

        const klineSeries = {
            id: 'klineMain', name: 'K线', type: 'candlestick', data: klines, xAxisIndex: 1, yAxisIndex: 1, z: 10,
            barMaxWidth: 18,
            itemStyle: { color: '#0ecb81', color0: '#f6465d', borderColor: '#0ecb81', borderColor0: '#f6465d' },
            markLine: { 
                symbol: 'none', animation: false, lineStyle: { type: 'dashed', width: 1 }, 
                label: { position: 'end', distance: 2, color: '#181a20', backgroundColor: activeColor, padding: [2, 4], borderRadius: 2, fontSize: 11, formatter: function(params) { return formatNum(params.value, 2); } }, 
                data: [] 
            },
            markArea: { silent: true, data: structMarks.markAreas },
            markPoint: { silent: true, data: structMarks.markPoints || [] }
        };
        if (currentPrice) {
            klineSeries.markLine.data.push({
                yAxis: currentPrice, lineStyle: { color: activeColor, type: 'dashed', width: 1 },
                label: { formatter: formatNum(currentPrice, 2), color: '#181a20', backgroundColor: activeColor, padding: [2, 4], borderRadius: 2, fontSize: 11, distance: 2 }
            });
        }
        structMarks.markLines.forEach(line => klineSeries.markLine.data.push(line));
        series.push(klineSeries);

        const closesForIndicator = alignedCloses;
        const validCloseCount = closesForIndicator.filter(v => v !== null).length;
        const ind = getIndicators(closesForIndicator);

        if (indicatorState.MA && validCloseCount > 20) {
            series.push({ name: 'MA5', type: 'line', data: ind.ma5, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'MA10', type: 'line', data: ind.ma10, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f7931a', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'MA20', type: 'line', data: ind.ma20, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#00d4aa', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
        }
        if (indicatorState.EMA && validCloseCount > 26) {
            series.push({ name: 'EMA12', type: 'line', data: ind.ema12, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'EMA26', type: 'line', data: ind.ema26, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#a78bfa', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
        }
        if (indicatorState.BOLL && validCloseCount > 20) {
            series.push({ name: 'BOLL上轨', type: 'line', data: ind.boll.upper, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#e879f9', width: 0.8, type: 'dashed' }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'BOLL中轨', type: 'line', data: ind.boll.middle, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            series.push({ name: 'BOLL下轨', type: 'line', data: ind.boll.lower, xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#0ecb81', width: 0.8, type: 'dashed' }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
        }

        let currentSeriesIndex = 2;
        const zoomAxes = [0, 1];

        if (showVol) {
            currentTop += mainHeight + gap;
            grids.push({ left: 10, right: rightMarginPx, top: currentTop + '%', height: volHeight + '%', containLabel: false });
            xAxes.push({ type: 'category', data: dates, gridIndex: currentSeriesIndex, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: currentSeriesIndex, scale: true, splitLine: { show: false }, axisLabel: { show: false } });
            const volColors = klines.map(k => {
                if (k[0] === '-' || k[1] === '-') return 'transparent';
                return k[1] >= k[0] ? '#0ecb81' : '#f6465d';
            });
            series.push({ name: 'VOL', type: 'bar', data: volumes.map((v, i) => ({ value: (v == null || v === '-') ? null : v, itemStyle: { color: volColors[i] } })), xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, z: 20, barMinWidth: 1 });
            zoomAxes.push(currentSeriesIndex);
            currentSeriesIndex++;
        }

        if (showMacd) {
            if (!showVol) currentTop += mainHeight + gap;
            if (showVol) currentTop += volHeight + gap;
            grids.push({ left: 10, right: rightMarginPx, top: currentTop + '%', height: macdHeight + '%', containLabel: false });
            xAxes.push({ type: 'category', data: dates, gridIndex: currentSeriesIndex, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: currentSeriesIndex, scale: true, splitLine: { show: false }, axisLabel: { show: false } });

            if (validCloseCount >= 26) {
                const macdResult = ind.macd;
                const macdData = macdResult.macd.map((v, i) => ({
                    value: v == null ? null : v,
                    itemStyle: { color: v == null ? 'transparent' : (v >= 0 ? '#0ecb81' : '#f6465d') }
                }));
                series.push({ name: 'MACD柱', type: 'bar', data: macdData, xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, z: 20, barMinWidth: 1 });
                series.push({ name: 'DIF', type: 'line', data: macdResult.dif, xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, lineStyle: { color: '#00d4aa', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
                series.push({ name: 'DEA', type: 'line', data: macdResult.dea, xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: false, z: 20, connectNulls: false });
            }
            zoomAxes.push(currentSeriesIndex);
            currentSeriesIndex++;
        }

        const initYRange = calculateYRange(zoomStartIdx, zoomEndIdx, klines, series, structResult.plan);
        yAxes[0].min = initYRange.yMin; 
        yAxes[0].max = initYRange.yMax; 
        yAxes[0].interval = initYRange.yInterval;
        yAxes[1].min = initYRange.yMin; 
        yAxes[1].max = initYRange.yMax; 
        yAxes[1].interval = initYRange.yInterval;

        const dzConfig = {
            type: 'inside',
            xAxisIndex: zoomAxes,
            minValueSpan: MIN_VISIBLE_BARS,
            moveOnMouseMove: true, 
            moveOnMouseWheel: false, 
            zoomOnMouseWheel: true, 
            start: startPct,
            end: endPct
        };

        const dzYConfig = {
            type: 'inside',
            yAxisIndex: [0, 1],
            moveOnMouseMove: true,
            moveOnMouseWheel: false,
            zoomOnMouseWheel: false,
            startValue: initYRange.yMin,
            endValue: initYRange.yMax
        };

        myChart.setOption({
            animation: false, grid: grids, xAxis: xAxes, yAxis: yAxes, series: series,
            legend: { show: false },
            dataZoom: [dzConfig, dzYConfig],
            tooltip: {
                trigger: 'axis', triggerOn: 'mousemove|click', confine: true, backgroundColor: 'rgba(0,0,0,0.8)', borderColor: '#333', borderWidth: 1,
                textStyle: { color: '#fff', fontSize: 10 }, padding: [8, 10], hideDelay: 15000,
                position: function (point, params, dom, rect, size) { return [10, 10]; },
                axisPointer: { 
                    type: 'cross', 
                    lineStyle: { color: '#555', type: 'dashed', width: 1 }, 
                    crossStyle: { color: '#555', type: 'dashed', width: 1 },
                    label: { formatter: function (params) { return formatNum(params.value, 2); } }
                },
                formatter: function(params) {
                    if (!params || params.length === 0) return '';
                    const idx = params[0].dataIndex;
                    if (idx == null || idx >= dates.length) return '';
                    const kline = klines[idx];
                    if (kline[0] === '-') return '';
                    const d = dates[idx], o = kline[0], c = kline[1], l = kline[2], h = kline[3];
                    const chg = c - o, pct = o !== 0 ? (chg / o) * 100 : 0, col = chg >= 0 ? '#0ecb81' : '#f6465d';
                    let html = `<div style="font-size:10px;line-height:1.6;"><div style="color:#aaa;">时间：${d}</div><div>开：${formatNum(o)}</div><div>高：${formatNum(h)}</div><div>低：${formatNum(l)}</div><div>收：${formatNum(c)}</div><div style="color:${col};">涨跌幅：${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</div>`;
                    if (volumes[idx] !== '-') html += `<div>成交量：${typeof volumes[idx] === 'number' ? volumes[idx].toFixed(1) : volumes[idx]}</div>`;
                    html += `</div>`;
                    return html;
                }
            }
        }, true);

        myChart.off('dataZoom');
        myChart.on('dataZoom', function(params) {
            if (!params.batch || !params.batch[0]) return;
            const dz = params.batch[0];
            if (dz.startValue !== undefined && dz.endValue !== undefined) return;
            
            let startIdx = Math.floor(dz.start / 100 * (totalLen - 1));
            let endIdx = Math.ceil(dz.end / 100 * (totalLen - 1));
            if (startIdx < 0) startIdx = 0;
            if (endIdx >= totalLen) endIdx = totalLen - 1;
            if (endIdx - startIdx + 1 < MIN_VISIBLE_BARS) {
                startIdx = Math.max(0, endIdx - MIN_VISIBLE_BARS + 1);
            }

            userZoomStartIdx = startIdx;
            userZoomEndIdx = Math.min(endIdx, totalLen - 1);
            if (userZoomEndIdx < userZoomStartIdx) userZoomEndIdx = userZoomStartIdx;
            
            isUserZoomed = true;
            followLatest = (realLen - 1 - userZoomEndIdx) <= 2;

            if (dataZoomTimer) clearTimeout(dataZoomTimer);
            dataZoomTimer = setTimeout(() => {
                dataZoomTimer = null;
                const newYRange = calculateYRange(startIdx, endIdx, klines, series, structResult.plan);
                const newXSplitInterval = Math.max(1, Math.floor((endIdx - startIdx) / 25));

                const newYAxes = yAxes.map((ax, i) => {
                    if (i === 0 || i === 1) return { min: newYRange.yMin, max: newYRange.yMax, interval: newYRange.yInterval };
                    return {};
                });
                const newXAxes = xAxes.map((ax, i) => {
                    if (i === 0 || i === 1) return { interval: newXSplitInterval, axisLabel: i === 1 ? { hideOverlap: true } : {} };
                    return {};
                });
                
                myChart.setOption({ yAxis: newYAxes, xAxis: newXAxes });
            }, 16);
        });
    }

    function toggleDrawer() {
        isDrawerOpen = !isDrawerOpen;
        const drawer = document.getElementById('rightDrawer');
        const btn = document.getElementById('drawerToggleBtn');
        if (isDrawerOpen) { drawer.classList.remove('collapsed'); btn.innerText = '▶'; btn.style.right = '300px'; }
        else { drawer.classList.add('collapsed'); btn.innerText = '◀'; btn.style.right = '0px'; }
        setTimeout(() => myChart.resize(), 350);
    }
    function switchOrderTab(tab) {
        document.querySelectorAll('.order-tabs span').forEach(s => s.classList.toggle('active', s.innerText.includes(tab === 'depth' ? '深度' : '成交')));
        document.getElementById('orderDataContent').innerHTML = tab === 'depth'
            ? '<div style="color:#888;padding:20px;text-align:center;">盘口深度（演示占位）</div>'
            : '<div style="color:#888;padding:20px;text-align:center;">最新成交（演示占位）</div>';
        if (tab === 'depth') updateOrderDataPanel();
    }
    function openTradeModal(side) {
        document.getElementById('tradeModalTitle').innerText = (side === 'buy' ? '买入' : '卖出') + ' XAUUSD';
        document.getElementById('tradeModalOverlay').classList.add('show');
    }
    function closeTradeModal() { document.getElementById('tradeModalOverlay').classList.remove('show'); }
    function confirmTrade() { showToast('模拟下单已提交（演示环境）', 'success'); closeTradeModal(); }

    document.getElementById('indicator-buttons').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-indicator]');
        if (!span) return;
        indicatorState[span.dataset.indicator] = !indicatorState[span.dataset.indicator];
        span.classList.toggle('active', indicatorState[span.dataset.indicator]);
        updateChart();
    });

    document.getElementById('timeframes').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-interval]');
        if (!span || span.dataset.interval === currentInterval) return;
        document.querySelectorAll('#timeframes span[data-interval]').forEach(s => s.classList.remove('active'));
        span.classList.add('active');
        currentInterval = span.dataset.interval;
        chartInitialized = false;
        cachedClosesRef = null;
        loadRealData(currentInterval);
    });

    document.getElementById('toggleFVG').addEventListener('click', function() {
        structState.fvg = !structState.fvg;
        this.classList.toggle('active', structState.fvg);
        updateChart();
    });
    document.getElementById('toggleMSB').addEventListener('click', function() {
        structState.msb = !structState.msb;
        this.classList.toggle('active', structState.msb);
        updateChart();
    });
    document.getElementById('togglePlan').addEventListener('click', function() {
        structState.plan = !structState.plan;
        this.classList.toggle('active', structState.plan);
        updateChart();
    });

    loadRealData(currentInterval);
    initWebSocket();
    window.addEventListener('resize', () => myChart.resize());
</script>
</body>
</html>
