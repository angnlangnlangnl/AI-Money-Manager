<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD 交易界面 (Gate官方真实数据版)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app { width: 100%; max-width: 100%; height: 100vh; background-color: #181a20; color: #eaecef; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 9px 30px; height: 55px; flex-shrink: 0; background: #1e2329; border-bottom: 1px solid #2b3139; }
        .header-left { display: flex; align-items: center; gap: 20px; font-size: 18px; font-weight: bold; }
        .header-left .pair-selector { cursor: pointer; color: #eaecef; padding: 5px 10px; border-radius: 4px; }
        .header-icons { display: flex; gap: 20px; font-size: 18px; color: #848e9c; }
        
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .trade-panel { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        
        .tabs { display: flex; gap: 30px; padding: 0 30px; border-bottom: 1px solid #2b3139; flex-shrink: 0; }
        .tab { color: #848e9c; font-size: 14px; padding: 15px 0; cursor: pointer; position: relative; }
        .tab.active { color: #eaecef; }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: #f0b90b; }
        
        .quote-section { display: flex; justify-content: space-between; padding: 15px 30px; flex-shrink: 0; }
        .price-main { font-size: 32px; font-weight: bold; }
        .price-sub { font-size: 14px; color: #848e9c; margin-top: 5px; }
        .price-sub span.green { color: #0ecb81; }
        .price-sub span.red { color: #f6465d; }
        .quote-details { font-size: 12px; color: #848e9c; text-align: right; line-height: 1.8; display: flex; gap: 40px; }
        .quote-details div { display: flex; flex-direction: column; }
        .quote-details b { color: #eaecef; font-weight: normal; font-size: 14px; margin-top: 2px; }
        
        .timeframes { display: flex; gap: 20px; padding: 0 30px 10px; font-size: 13px; color: #848e9c; flex-shrink: 0; align-items: center; }
        .timeframes span.active { color: #eaecef; font-weight: bold; border-bottom: 2px solid #eaecef; padding-bottom: 4px; }
        .timeframes span { cursor: pointer; }
        
        .chart-container { flex: 1; min-height: 400px; position: relative; background: #181a20; display: flex; flex-direction: column; padding-bottom: 10px; }
        #kline { width: 100%; flex: 1; }
        
        .indicators { display: flex; gap: 20px; padding: 10px 30px; font-size: 12px; color: #848e9c; border-top: 1px solid #2b3139; flex-shrink: 0; margin-bottom: 20px; }
        .indicators span { cursor: pointer; padding: 4px 10px; border-radius: 4px; transition: all 0.2s; }
        .indicators span.active { color: #f0b90b; background: rgba(240,185,11,0.1); }

        .right-drawer { width: 320px; background: #1e2329; border-left: 1px solid #2b3139; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s ease; overflow: hidden; position: relative; }
        .right-drawer.collapsed { width: 0; border-left: none; }
        .drawer-content { width: 320px; display: flex; flex-direction: column; height: 100%; }
        
        .toggle-btn { position: absolute; right: 320px; top: 50%; transform: translateY(-50%); width: 24px; height: 60px; background: #2b3139; border: 1px solid #383e46; border-right: none; border-radius: 6px 0 0 6px; color: #848e9c; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 20; font-size: 12px; transition: right 0.3s ease; }

        .order-book-panel { padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; flex: 1; overflow-y: auto; }
        .order-book-bar { display: flex; align-items: center; font-size: 13px; font-weight: bold; }
        .sell-bar { width: 50%; background: rgba(246,70,93,0.2); color: #f6465d; text-align: left; padding: 10px 15px; border-radius: 4px 0 0 4px; border: 1px solid #f6465d; border-right: none; }
        .buy-bar { width: 50%; background: rgba(14,203,129,0.2); color: #0ecb81; text-align: right; padding: 10px 15px; border-radius: 0 4px 4px 0; border: 1px solid #0ecb81; border-left: none; }

        .order-tabs { display: flex; gap: 20px; font-size: 13px; color: #848e9c; border-bottom: 1px solid #2b3139; padding-bottom: 10px; }
        .order-tabs span { cursor: pointer; padding: 5px 0; border-bottom: 2px solid transparent; }
        .order-tabs span.active { color: #eaecef; border-bottom-color: #f0b90b; }
        
        .order-data-container { flex: 1; overflow-y: auto; }
        .order-data-content { font-size: 12px; color: #aaa; }

        .drawer-actions { padding: 15px; background: #181a20; border-top: 1px solid #2b3139; display: flex; gap: 10px; flex-shrink: 0; }
        .drawer-actions button { flex: 1; padding: 12px 0; border-radius: 4px; font-size: 15px; font-weight: bold; color: #fff; cursor: pointer; border: none; }
        .drawer-actions .buy-btn { background: #0ecb81; }
        .drawer-actions .sell-btn { background: #f6465d; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #1e2329; border-radius: 8px; width: 90%; max-width: 400px; padding: 20px; border: 1px solid #2b3139; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: bold; color: #fff; }
        .modal-close { cursor: pointer; color: #848e9c; font-size: 20px; }
        .trade-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .trade-row label { width: 80px; font-size: 13px; color: #848e9c; }
        .trade-row input, .trade-row select { flex: 1; background: #0a0a12; border: 1px solid #2a2a3a; border-radius: 6px; padding: 10px 12px; color: #eaecef; font-size: 14px; outline: none; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-left">
            <span style="color:#f0b90b; font-size:22px;">Gate</span>
            <span class="pair-selector">XAUUSD ▾</span>
            <span style="font-size:12px; color:#848e9c; font-weight:normal;">黄金 Gold</span>
        </div>
        <div class="header-icons"><span>✨</span><span>★</span><span>🔔</span></div>
    </div>

    <div class="main-content">
        <div class="trade-panel">
            <div class="tabs"><div class="tab active">图表</div><div class="tab">合约信息</div><div class="tab">资讯</div></div>
            
            <div class="quote-section">
                <div>
                    <div class="price-main" id="last-price">--</div>
                    <div class="price-sub" id="cn-price">-- <span class="green">+0.00%</span></div>
                </div>
                <div class="quote-details">
                    <div>今日最高价 <b id="high-24">--</b></div>
                    <div>今日最低价 <b id="low-24">--</b></div>
                    <div>今日开盘价 <b id="open-price">--</b></div>
                </div>
            </div>

            <div class="timeframes" id="timeframes">
                <span data-interval="1m">1分</span><span data-interval="5m">5分</span><span data-interval="15m">15分</span><span data-interval="30m">30分</span><span data-interval="1h" class="active">1小时</span><span data-interval="4h">4小时</span><span data-interval="1d">1日</span>
            </div>
            
            <div class="chart-container"><div id="kline"></div></div>
            
            <div class="indicators" id="indicator-buttons">
                <span class="active" data-indicator="MA">MA</span><span data-indicator="EMA">EMA</span><span data-indicator="BOLL">BOLL</span><span data-indicator="VOL">VOL</span><span data-indicator="MACD">MACD</span>
            </div>
        </div>

        <div class="right-drawer" id="rightDrawer">
            <div class="drawer-content">
                <div class="order-book-panel">
                    <div class="order-book-bar">
                        <div class="sell-bar" id="sell-bar">卖一 --</div>
                        <div class="buy-bar" id="buy-bar">买一 --</div>
                    </div>
                    <div class="order-tabs">
                        <span class="active" onclick="switchOrderTab('depth')">深度</span>
                        <span onclick="switchOrderTab('trades')">最新成交</span>
                    </div>
                    <div class="order-data-container">
                        <div class="order-data-content" id="orderDataContent">加载中...</div>
                    </div>
                </div>
                <div class="drawer-actions">
                    <button class="buy-btn" onclick="openTradeModal('buy')">买入/做多</button>
                    <button class="sell-btn" onclick="openTradeModal('sell')">卖出/做空</button>
                </div>
            </div>
        </div>
        <div class="toggle-btn" onclick="toggleDrawer()" id="drawerToggleBtn">▶</div>
    </div>

    <div class="modal-overlay" id="tradeModalOverlay">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title" id="tradeModalTitle">买入 XAUUSD</span><span class="modal-close" onclick="closeTradeModal()">✕</span></div>
            <div class="trade-row"><label>订单类型</label><select id="tradeOrderType"><option value="market">市价单</option><option value="limit">限价单</option></select></div>
            <div class="trade-row" id="tradePriceRow" style="display:none;"><label>价格</label><input type="number" id="tradePrice" placeholder="限价 (美元)" step="0.01"></div>
            <div class="trade-row"><label>手数</label><input type="number" id="tradeAmount" placeholder="最小 0.01 手" step="0.01" min="0.01"></div>
            <div style="display:flex;gap:10px;margin-top:20px;">
                <button class="sell-btn" onclick="closeTradeModal()" style="background:#2a2a3a;">取消</button>
                <button class="buy-btn" onclick="confirmTrade()" style="background:#f0b90b;color:#181a20;">确认下单</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ 重要：这里填写你阿里云服务器的真实公网 IP
    const API_BASE = 'http://121.40.161.212:8080'; 

    // =================== 全局状态 ===================
    let currentInterval = '1h';
    let chartData = { dates: [], klines: [], volumes: [], timestamps: [] };
    const indicatorState = { MA: true, EMA: false, BOLL: false, VOL: false, MACD: false };
    let currentPrice = 0;
    let isDrawerOpen = true;
    let zoomStartIndex = 0;
    let zoomEndIndex = 0;
    let pricePollTimer = null;

    // =================== 技术指标计算库 ===================
    class Indicators {
        static SMA(data, period) { const result = new Array(data.length).fill(null); for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = i - period + 1; j <= i; j++) sum += data[j]; result[i] = sum / period; } return result; }
        static EMA(data, period) { const result = new Array(data.length).fill(null); if (data.length === 0) return result; const multiplier = 2 / (period + 1); result[0] = data[0]; for (let i = 1; i < data.length; i++) result[i] = (data[i] - result[i - 1]) * multiplier + result[i - 1]; return result; }
        static BOLL(data, period = 20, stdDev = 2) { const middle = this.SMA(data, period); const upper = new Array(data.length).fill(null); const lower = new Array(data.length).fill(null); for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = i - period + 1; j <= i; j++) sum += Math.pow(data[j] - middle[i], 2); const std = Math.sqrt(sum / period); upper[i] = middle[i] + stdDev * std; lower[i] = middle[i] - stdDev * std; } return { upper, middle, lower }; }
        static MACD(data, fast = 12, slow = 26, signal = 9) { const emaFast = this.EMA(data, fast); const emaSlow = this.EMA(data, slow); const dif = new Array(data.length).fill(null); for (let i = 0; i < data.length; i++) if (emaFast[i] !== null && emaSlow[i] !== null) dif[i] = emaFast[i] - emaSlow[i]; const validDif = dif.filter(v => v !== null); const deaValid = this.EMA(validDif, signal); const dea = new Array(data.length).fill(null); const offset = dif.length - deaValid.length; for (let i = 0; i < deaValid.length; i++) dea[offset + i] = deaValid[i]; const macd = new Array(data.length).fill(null); for (let i = 0; i < data.length; i++) if (dif[i] !== null && dea[i] !== null) macd[i] = (dif[i] - dea[i]) * 2; return { dif, dea, macd }; }
    }

    // =================== 工具函数 ===================
    function formatNum(num, decimals = 2) { const n = parseFloat(num); if (isNaN(n)) return '--'; return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
    function formatKlineDate(timestamp, interval) {
        const d = new Date(timestamp); 
        const year = d.getFullYear(); const month = d.getMonth() + 1; const date = d.getDate();
        const hours = d.getHours().toString().padStart(2, '0'); const minutes = d.getMinutes().toString().padStart(2, '0');
        if (interval === '1d') return `${year}-${month}-${date}`; return `${month}-${date} ${hours}:${minutes}`;
    }

    // =================== 数据加载与图表渲染 ===================
    const chartDom = document.getElementById('kline');
    const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

    async function loadRealData(interval) {
        try {
            const res = await fetch(`${API_BASE}/api/kline?interval=${interval}&limit=500`);
            const json = await res.json();
            if (!json.success || !json.data) throw new Error('K线获取失败');

            const rawData = json.data; // 后端已经排好序（旧->新）并转成毫秒
            const dates = [], klines = [], volumes = [], timestamps = [];

            rawData.forEach(item => {
                const ts = item.t; // 毫秒
                const open = item.o;
                const high = item.h;
                const low = item.l;
                const close = item.c;

                timestamps.push(ts);
                dates.push(formatKlineDate(ts, interval));
                klines.push([open, close, low, high]);
                volumes.push(1000); // Gate 此接口无成交量，用占位符
            });

            chartData = { dates, klines, volumes, timestamps };
            currentPrice = klines[klines.length - 1][1];

            zoomStartIndex = Math.max(0, chartData.dates.length - 80);
            zoomEndIndex = chartData.dates.length - 1;

            updateTickerUI();
            updateChart();
        } catch (e) {
            console.error('获取 K 线失败:', e);
            alert('数据加载失败: ' + e.message);
        }
    }

    async function fetchRealTicker() {
        try {
            const res = await fetch(`${API_BASE}/api/ticker`);
            const json = await res.json();
            if (json.success && json.data) {
                const tick = json.data;
                const price = parseFloat(tick.last);
                const change = parseFloat(tick.change) * 100; // Gate 返回的是小数，需要 *100

                document.getElementById('last-price').innerText = formatNum(price);
                document.getElementById('high-24').innerText = formatNum(tick.high);
                document.getElementById('low-24').innerText = formatNum(tick.low);
                document.getElementById('open-price').innerText = formatNum(tick.open);
                document.getElementById('cn-price').innerHTML = `$${formatNum(price)} <span class="${change >= 0 ? 'green' : 'red'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;

                document.getElementById('sell-bar').innerText = `卖 ${formatNum(tick.ask)}`;
                document.getElementById('buy-bar').innerText = `买 ${formatNum(tick.bid)}`;

                if (Math.abs(price - currentPrice) > 0.01) {
                    currentPrice = price;
                    updateChart();
                }
            }
        } catch (e) { console.error('Ticker 获取失败:', e); }
    }

    function startPricePolling() {
        fetchRealTicker();
        pricePollTimer = setInterval(fetchRealTicker, 5000); 
    }

    function updateTickerUI() {
        if (!chartData.klines.length) return;
        const last = chartData.klines[chartData.klines.length - 1];
        const open = last[0], close = last[1];
        const change = ((close - open) / open) * 100;

        document.getElementById('last-price').innerText = formatNum(close);
        document.getElementById('open-price').innerText = formatNum(open);
        
        const recent = chartData.klines.slice(-24);
        document.getElementById('high-24').innerText = formatNum(Math.max(...recent.map(k => k[3])));
        document.getElementById('low-24').innerText = formatNum(Math.min(...recent.map(k => k[2])));
        document.getElementById('cn-price').innerHTML = `$${formatNum(close)} <span class="${change >= 0 ? 'green' : 'red'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;
    }

    function updateChart() {
        if (!chartData.klines.length) return;
        const { dates, klines, volumes } = chartData;
        const closes = klines.map(k => k[1]);
        const highs = klines.map(k => k[3]);
        const lows = klines.map(k => k[2]);

        const totalLen = dates.length;

        let minLow = Infinity, maxHigh = -Infinity;
        for (let i = zoomStartIndex; i <= zoomEndIndex; i++) { 
            if (lows[i] < minLow) minLow = lows[i];
            if (highs[i] > maxHigh) maxHigh = highs[i];
        }
        if (currentPrice) { minLow = Math.min(minLow, currentPrice); maxHigh = Math.max(maxHigh, currentPrice); }
        
        const padding = (maxHigh - minLow) * 0.1 || 5;
        const yMin = minLow - padding, yMax = maxHigh + padding;

        const series = []; const grids = []; const xAxes = []; const yAxes = [];
        const showVol = indicatorState.VOL, showMacd = indicatorState.MACD;
        let mainHeight = 100, volHeight = 0, macdHeight = 0;
        const gap = 5;
        if (showVol && showMacd) { mainHeight = 60; volHeight = 15; macdHeight = 15; }
        else if (showVol || showMacd) { mainHeight = 75; volHeight = showVol ? 20 : 0; macdHeight = showMacd ? 20 : 0; }

        let currentTop = 5;

        grids.push({ left: 15, right: '12%', top: currentTop + '%', height: mainHeight + '%' });
        xAxes.push({ type: 'category', data: dates, gridIndex: 0, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false } });
        yAxes.push({ scale: false, min: yMin, max: yMax, splitNumber: 5, position: 'right', gridIndex: 0, splitLine: { lineStyle: { color: '#2b3139', type: 'dashed' } }, axisLabel: { color: '#848e9c', fontSize: 10, inside: true, formatter: v => formatNum(v, 1) } });

        grids.push({ left: 15, right: '12%', top: currentTop + '%', height: mainHeight + '%' });
        xAxes.push({ type: 'category', data: dates, gridIndex: 1, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
        yAxes.push({ scale: false, min: yMin, max: yMax, splitNumber: 5, position: 'right', gridIndex: 1, splitLine: { show: false }, axisLabel: { show: false } });

        const klineSeries = {
            id: 'klineMain', type: 'candlestick', data: klines, xAxisIndex: 1, yAxisIndex: 1, z: 10,
            barMinWidth: 1, 
            itemStyle: { color: '#0ecb81', color0: '#f6465d', borderColor: '#0ecb81', borderColor0: '#f6465d' },
            markLine: { symbol: 'none', animation: false, lineStyle: { type: 'dashed', width: 1 }, label: { position: 'end', distance: 2, color: '#848e9c', fontSize: 10, formatter: '{c}' }, data: [] }
        };
        if (currentPrice) {
            klineSeries.markLine.data.push({ yAxis: currentPrice, lineStyle: { color: '#f0b90b' }, label: { formatter: formatNum(currentPrice), color: '#f0b90b', distance: 0 } });
        }
        series.push(klineSeries);

        const cleanData = (arr) => arr.map(v => v === null ? '-' : v);

        if (indicatorState.MA && closes.length > 20) {
            series.push({ type: 'line', data: cleanData(Indicators.SMA(closes, 5)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(Indicators.SMA(closes, 10)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f7931a', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(Indicators.SMA(closes, 20)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#00d4aa', width: 1 }, symbol: 'none', smooth: true, z: 20 });
        }
        if (indicatorState.EMA && closes.length > 26) {
            series.push({ type: 'line', data: cleanData(Indicators.EMA(closes, 12)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(Indicators.EMA(closes, 26)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#a78bfa', width: 1 }, symbol: 'none', smooth: true, z: 20 });
        }
        if (indicatorState.BOLL && closes.length > 20) {
            const boll = Indicators.BOLL(closes, 20, 2);
            series.push({ type: 'line', data: cleanData(boll.upper), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f6465d', width: 0.8, type: 'dashed' }, symbol: 'none', z: 20 });
            series.push({ type: 'line', data: cleanData(boll.middle), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 0.8 }, symbol: 'none', z: 20 });
            series.push({ type: 'line', data: cleanData(boll.lower), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#0ecb81', width: 0.8, type: 'dashed' }, symbol: 'none', z: 20 });
        }

        let currentSeriesIndex = 2;
        const zoomAxes = [1];

        if (showVol) {
            currentTop += mainHeight + gap;
            grids.push({ left: 15, right: '12%', top: currentTop + '%', height: volHeight + '%' });
            xAxes.push({ type: 'category', data: dates, gridIndex: currentSeriesIndex, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: currentSeriesIndex, splitLine: { show: false }, axisLabel: { show: false } });
            const volColors = klines.map(k => k[1] >= k[0] ? '#0ecb81' : '#f6465d');
            series.push({ type: 'bar', data: volumes.map((v, i) => ({ value: v, itemStyle: { color: volColors[i] } })), xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, z: 20, barMinWidth: 1 });
            zoomAxes.push(currentSeriesIndex);
            currentSeriesIndex++;
        }

        if (showMacd && closes.length > 26) {
            if (!showVol) currentTop += mainHeight + gap;
            if (showVol) currentTop += volHeight + gap;
            grids.push({ left: 15, right: '12%', top: currentTop + '%', height: macdHeight + '%' });
            xAxes.push({ type: 'category', data: dates, gridIndex: currentSeriesIndex, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: currentSeriesIndex, splitLine: { show: false }, axisLabel: { show: false } });
            const macdResult = Indicators.MACD(closes);
            const macdColors = macdResult.macd.map(v => v === null ? 'transparent' : v >= 0 ? '#0ecb81' : '#f6465d');
            series.push({ type: 'bar', data: macdResult.macd.map((v, i) => ({ value: v, itemStyle: { color: macdColors[i] } })), xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, z: 20, barMinWidth: 1 });
            series.push({ type: 'line', data: cleanData(macdResult.dif), xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(macdResult.dea), xAxisIndex: currentSeriesIndex, yAxisIndex: currentSeriesIndex, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            zoomAxes.push(currentSeriesIndex);
        }

        myChart.setOption({
            animation: false, grid: grids, xAxis: xAxes, yAxis: yAxes, series: series,
            dataZoom: [
                { 
                    type: 'inside', 
                    xAxisIndex: zoomAxes, 
                    start: (zoomStartIndex / totalLen) * 100, 
                    end: (zoomEndIndex / totalLen) * 100,
                    minValueSpan: 10
                }
            ],
            tooltip: {
                trigger: 'axis', triggerOn: 'mousemove|click', confine: true, backgroundColor: 'rgba(0,0,0,0.8)', borderColor: '#333', borderWidth: 1,
                textStyle: { color: '#fff', fontSize: 10 }, padding: [8, 10],
                axisPointer: { type: 'cross', lineStyle: { color: '#555', type: 'dashed', width: 1 }, crossStyle: { color: '#555', type: 'dashed', width: 1 } },
                formatter: function(params) {
                    if (!params || params.length === 0) return '';
                    const idx = params[0].dataIndex;
                    if (idx == null || idx >= chartData.dates.length) return '';
                    const d = chartData.dates[idx], o = chartData.klines[idx][0], c = chartData.klines[idx][1], l = chartData.klines[idx][2], h = chartData.klines[idx][3];
                    const chg = c - o, pct = o !== 0 ? (chg / o) * 100 : 0, col = chg >= 0 ? '#0ecb81' : '#f6465d';
                    return `<div style="font-size:10px;line-height:1.6;"><div style="color:#aaa;">时间：${d}</div><div>开：${formatNum(o)}</div><div>高：${formatNum(h)}</div><div>低：${formatNum(l)}</div><div>收：${formatNum(c)}</div><div style="color:${col};">涨跌幅：${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</div></div>`;
                }
            }
        }, true);

        myChart.off('dataZoom');
        myChart.on('dataZoom', function(params) {
            if (!params.batch) return;
            const dz = params.batch[0];
            const startIdx = Math.floor(dz.start / 100 * (totalLen - 1));
            const endIdx = Math.ceil(dz.end / 100 * (totalLen - 1));
            
            zoomStartIndex = startIdx;
            zoomEndIndex = endIdx;

            let minL = Infinity, maxH = -Infinity;
            for (let i = zoomStartIndex; i <= zoomEndIndex; i++) { 
                if (lows[i] < minL) minL = lows[i];
                if (highs[i] > maxH) maxH = highs[i];
            }
            if (currentPrice) {
                minL = Math.min(minL, currentPrice);
                maxH = Math.max(maxH, currentPrice);
            }
            const pad = (maxH - minL) * 0.1 || 5;
            const newYMin = minL - pad;
            const newYMax = maxH + pad;

            myChart.setOption({
                yAxis: [
                    { min: newYMin, max: newYMax },
                    { min: newYMin, max: newYMax }
                ]
            });
        });
    }

    // =================== 交互 ===================
    function toggleDrawer() {
        isDrawerOpen = !isDrawerOpen;
        const drawer = document.getElementById('rightDrawer');
        const btn = document.getElementById('drawerToggleBtn');
        if (isDrawerOpen) { drawer.classList.remove('collapsed'); btn.innerText = '▶'; btn.style.right = '320px'; }
        else { drawer.classList.add('collapsed'); btn.innerText = '◀'; btn.style.right = '0px'; }
        setTimeout(() => myChart.resize(), 350);
    }

    function switchOrderTab(tab) {
        document.querySelectorAll('.order-tabs span').forEach(s => s.classList.toggle('active', s.innerText.includes(tab === 'depth' ? '深度' : '成交')));
        document.getElementById('orderDataContent').innerHTML = tab === 'depth'
            ? '<div style="color:#888;padding:20px;text-align:center;">盘口深度（演示占位）</div>'
            : '<div style="color:#888;padding:20px;text-align:center;">最新成交（演示占位）</div>';
    }

    function openTradeModal(side) {
        document.getElementById('tradeModalTitle').innerText = (side === 'buy' ? '买入' : '卖出') + ' XAUUSD';
        document.getElementById('tradeModalOverlay').classList.add('show');
    }
    function closeTradeModal() { document.getElementById('tradeModalOverlay').classList.remove('show'); }
    function confirmTrade() { alert('模拟下单已提交（演示环境）'); closeTradeModal(); }

    document.getElementById('indicator-buttons').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-indicator]');
        if (!span) return;
        indicatorState[span.dataset.indicator] = !indicatorState[span.dataset.indicator];
        span.classList.toggle('active', indicatorState[span.dataset.indicator]);
        updateChart();
    });

    document.getElementById('timeframes').addEventListener('click', function(e) {
        const span = e.target.closest('span[data-interval]');
        if (!span || span.dataset.interval === currentInterval) return;
        document.querySelectorAll('#timeframes span[data-interval]').forEach(s => s.classList.remove('active'));
        span.classList.add('active');
        currentInterval = span.dataset.interval;
        loadRealData(currentInterval);
    });

    // 启动
    loadRealData(currentInterval);
    startPricePolling();
    window.addEventListener('resize', () => myChart.resize());
</script>
</body>
</html>
