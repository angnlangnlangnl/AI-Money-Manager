<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD 交易界面 (修复空白版)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .app { width: 100%; max-width: 100%; height: 100vh; background-color: #181a20; color: #eaecef; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 9px 30px; height: 55px; flex-shrink: 0; background: #1e2329; border-bottom: 1px solid #2b3139; }
        .header-left { display: flex; align-items: center; gap: 20px; font-size: 18px; font-weight: bold; }
        .header-left .pair-selector { cursor: pointer; color: #eaecef; padding: 5px 10px; border-radius: 4px; transition: background 0.2s; }
        .header-left .pair-selector:hover { background: #2b3139; color: #f0b90b; }
        .header-icons { display: flex; gap: 20px; font-size: 18px; color: #848e9c; }
        
        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        .trade-panel { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        
        .tabs { display: flex; gap: 30px; padding: 0 30px; border-bottom: 1px solid #2b3139; flex-shrink: 0; }
        .tab { color: #848e9c; font-size: 14px; padding: 15px 0; cursor: pointer; position: relative; }
        .tab.active { color: #eaecef; }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: #f0b90b; }
        
        .quote-section { display: flex; justify-content: space-between; padding: 15px 30px; flex-shrink: 0; }
        .price-main { font-size: 32px; font-weight: bold; }
        .price-sub { font-size: 14px; color: #848e9c; margin-top: 5px; }
        .price-sub span.green { color: #0ecb81; }
        .price-sub span.red { color: #f6465d; }
        .quote-details { font-size: 12px; color: #848e9c; text-align: right; line-height: 1.8; display: flex; gap: 40px; }
        .quote-details div { display: flex; flex-direction: column; }
        .quote-details b { color: #eaecef; font-weight: normal; font-size: 14px; margin-top: 2px; }
        
        .timeframes { display: flex; gap: 20px; padding: 0 30px 10px; font-size: 13px; color: #848e9c; flex-shrink: 0; align-items: center; }
        .timeframes span.active { color: #eaecef; font-weight: bold; border-bottom: 2px solid #eaecef; padding-bottom: 4px; }
        .timeframes span { cursor: pointer; }
        .timeframes span:hover { color: #eaecef; }
        
        .chart-container { flex: 1; min-height: 300px; position: relative; background: #181a20; margin-top: -4px; display: flex; flex-direction: column; }
        #kline { width: 100%; flex: 1; }
        
        .indicators { display: flex; gap: 20px; padding: 10px 30px; font-size: 12px; color: #848e9c; border-top: 1px solid #2b3139; flex-shrink: 0; margin-bottom: 20px; }
        .indicators span { cursor: pointer; padding: 4px 10px; border-radius: 4px; transition: all 0.2s; }
        .indicators span.active { color: #f0b90b; background: rgba(240,185,11,0.1); }
        .indicators span:hover { color: #eaecef; }

        .right-drawer {
            width: 320px; background: #1e2329; border-left: 1px solid #2b3139; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s ease, transform 0.3s ease; overflow: hidden; position: relative;
        }
        .right-drawer.collapsed { width: 0; border-left: none; }
        .drawer-content { width: 320px; display: flex; flex-direction: column; height: 100%; }
        .toggle-btn {
            position: absolute; left: -24px; top: 50%; transform: translateY(-50%); width: 24px; height: 60px; background: #2b3139; border: 1px solid #383e46; border-right: none; border-radius: 6px 0 0 6px; color: #848e9c; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; font-size: 12px; user-select: none; transition: background 0.2s;
        }
        .toggle-btn:hover { background: #383e46; color: #fff; }

        .order-book-panel { padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; flex: 1; overflow-y: auto; }
        .order-book-bar { display: flex; align-items: center; font-size: 13px; font-weight: bold; }
        .sell-bar { width: 50%; background: rgba(246,70,93,0.2); color: #f6465d; text-align: left; padding: 10px 15px; border-radius: 4px 0 0 4px; transition: width 0.5s; border: 1px solid #f6465d; border-right: none; }
        .buy-bar { width: 50%; background: rgba(14,203,129,0.2); color: #0ecb81; text-align: right; padding: 10px 15px; border-radius: 0 4px 4px 0; transition: width 0.5s; border: 1px solid #0ecb81; border-left: none; }

        .order-tabs { display: flex; gap: 20px; font-size: 13px; color: #848e9c; border-bottom: 1px solid #2b3139; padding-bottom: 10px; }
        .order-tabs span { cursor: pointer; padding: 5px 0; transition: all 0.2s; border-bottom: 2px solid transparent; }
        .order-tabs span.active { color: #eaecef; border-bottom-color: #f0b90b; }
        
        .order-data-container { flex: 1; overflow-y: auto; }
        .order-data-content { font-size: 12px; color: #aaa; }
        .order-list-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2a3a; }
        .ask-text { color: #f6465d; }
        .bid-text { color: #0ecb81; }

        .drawer-actions { padding: 15px; background: #181a20; border-top: 1px solid #2b3139; display: flex; gap: 10px; flex-shrink: 0; }
        .drawer-actions button { flex: 1; padding: 12px 0; border-radius: 4px; font-size: 15px; font-weight: bold; color: #fff; cursor: pointer; border: none; transition: opacity 0.2s; }
        .drawer-actions button:hover { opacity: 0.8; }
        .drawer-actions .buy-btn { background: #0ecb81; }
        .drawer-actions .sell-btn { background: #f6465d; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #1e2329; border-radius: 8px; width: 90%; max-width: 400px; padding: 20px; border: 1px solid #2b3139; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: bold; color: #fff; }
        .modal-close { cursor: pointer; color: #848e9c; font-size: 20px; }
        .trade-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .trade-row label { width: 80px; font-size: 13px; color: #848e9c; }
        .trade-row input, .trade-row select { flex: 1; background: #0a0a12; border: 1px solid #2a2a3a; border-radius: 6px; padding: 10px 12px; color: #eaecef; font-size: 14px; outline: none; }

        .pair-list { display: flex; flex-direction: column; max-height: 300px; overflow-y: auto; gap: 5px; }
        .pair-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #2b3139; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .pair-item:hover { background: #3b4149; }
        .pair-item.active { border-left: 3px solid #f0b90b; }
        .pair-item .sym { font-weight: bold; font-size: 14px; display: flex; flex-direction: column; }
        .pair-item .sym small { font-size: 11px; color: #848e9c; font-weight: normal; margin-top: 2px; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-left">
            <span style="color:#f0b90b; font-size:22px;">Gate</span>
            <span class="pair-selector" id="pairSelectorBtn" onclick="openPairModal()">XAUUSD ▾</span>
            <span style="font-size:12px; color:#848e9c; font-weight:normal;" id="pairBaseAsset">黄金 Gold</span>
        </div>
        <div class="header-icons"><span>✨</span><span>★</span><span>🔔</span></div>
    </div>

    <div class="main-content">
        <div class="trade-panel">
            <div class="tabs">
                <div class="tab">图表</div><div class="tab">合约信息</div><div class="tab">资讯</div>
            </div>
            
            <div class="quote-section">
                <div>
                    <div class="price-main" id="last-price">--</div>
                    <div class="price-sub" id="cn-price">-- <span class="green">+0.00%</span></div>
                </div>
                <div class="quote-details">
                    <div>今日最高价 <b id="high-24">--</b></div>
                    <div>今日最低价 <b id="low-24">--</b></div>
                    <div>今日开盘价 <b id="open-price">--</b></div>
                </div>
            </div>

            <div class="timeframes" id="timeframes">
                <span data-interval="1m">1分</span><span data-interval="5m">5分</span><span data-interval="15m">15分</span><span data-interval="30m">30分</span><span data-interval="1h" class="active">1小时</span><span data-interval="4h">4小时</span><span data-interval="1d">1日</span>
            </div>
            
            <div class="chart-container"><div id="kline"></div></div>
            
            <div class="indicators" id="indicator-buttons">
                <span class="active" data-indicator="MA">MA</span><span data-indicator="EMA">EMA</span><span data-indicator="BOLL">BOLL</span><span data-indicator="VOL">VOL</span><span data-indicator="MACD">MACD</span>
            </div>
        </div>

        <div class="right-drawer" id="rightDrawer">
            <div class="toggle-btn" onclick="toggleDrawer()" id="drawerToggleBtn">▶</div>
            <div class="drawer-content">
                <div class="order-book-panel">
                    <div class="order-book-bar">
                        <div class="sell-bar" id="sell-bar">卖一 --</div>
                        <div class="buy-bar" id="buy-bar">买一 --</div>
                    </div>
                    <div class="order-tabs">
                        <span class="active" onclick="switchOrderTab('depth')">深度</span>
                        <span onclick="switchOrderTab('trades')">最新成交</span>
                    </div>
                    <div class="order-data-container">
                        <div class="order-data-content" id="orderDataContent">等待 WebSocket 推送盘口数据...</div>
                    </div>
                </div>
                <div class="drawer-actions">
                    <button class="buy-btn" onclick="openTradeModal('buy')">买入/做多</button>
                    <button class="sell-btn" onclick="openTradeModal('sell')">卖出/做空</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="pairModalOverlay">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">选择交易品种</span><span class="modal-close" onclick="closePairModal()">✕</span></div>
            <div class="pair-list">
                <div class="pair-item active" onclick="switchSymbol('XAUUSD', '黄金 Gold', this)">
                    <div class="sym">XAUUSD <small>黄金</small></div>
                </div>
                <div class="pair-item" onclick="switchSymbol('NAS100', '纳斯达克 100', this)">
                    <div class="sym">NAS100 <small>纳斯达克 100</small></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="tradeModalOverlay">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title" id="tradeModalTitle">买入 XAUUSD</span><span class="modal-close" onclick="closeTradeModal()">✕</span></div>
            <div class="trade-row"><label>订单类型</label><select id="tradeOrderType" onchange="toggleTradePriceInput()"><option value="market">市价单</option><option value="limit">限价单</option></select></div>
            <div class="trade-row" id="tradePriceRow" style="display:none;"><label>价格</label><input type="number" id="tradePrice" placeholder="限价 (美元)" step="0.01"></div>
            <div class="trade-row"><label>手数</label><input type="number" id="tradeAmount" placeholder="最小 0.01 手" step="0.01" min="0.01"></div>
            <div style="display:flex;gap:10px;margin-top:20px;">
                <button class="sell-btn" onclick="closeTradeModal()" style="background:#2a2a3a;">取消</button>
                <button class="buy-btn" onclick="confirmTrade()" style="background:#f0b90b;color:#181a20;">确认下单</button>
            </div>
        </div>
    </div>
</div>

<script>
    // =================== 1. WebSocket 管理 ===================
    class GateTradFiWS {
        constructor(url = 'wss://fx-ws.gateio.ws/v4/ws/tradfi') {
            this.url = url; this.ws = null; this.callbacks = {}; this.reconnectTimer = null; this.subscriptions = [];
        }
        connect() {
            this.ws = new WebSocket(this.url);
            this.ws.onopen = () => { clearInterval(this.reconnectTimer); this.subscriptions.forEach(sub => this.ws.send(JSON.stringify(sub))); };
            this.ws.onmessage = (e) => this.handleMessage(e.data);
            this.ws.onclose = () => { this.reconnectTimer = setTimeout(() => this.connect(), 3000); };
        }
        subscribe(channel, payload, callback) {
            if (!this.callbacks[channel]) this.callbacks[channel] = [];
            if (callback) this.callbacks[channel].push(callback);
            const msg = { time: Math.floor(Date.now() / 1000), channel: channel, event: 'subscribe', payload: payload };
            if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify(msg)); this.subscriptions.push(msg); }
        }
        unsubscribe(channel, payload) {
            this.callbacks[channel] = [];
            this.subscriptions = this.subscriptions.filter(sub => sub.channel !== channel || JSON.stringify(sub.payload) !== JSON.stringify(payload));
            const msg = { time: Math.floor(Date.now() / 1000), channel: channel, event: 'unsubscribe', payload: payload };
            if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify(msg)); }
        }
        handleMessage(rawData) {
            try {
                const data = JSON.parse(rawData);
                if (data.channel === 'tradfi.pong') return;
                if (data.event === 'update' && this.callbacks[data.channel]) { this.callbacks[data.channel].forEach(cb => cb(data.result)); }
            } catch (err) { console.error('WS 解析失败:', err); }
        }
    }

    // =================== 2. 全局状态 ===================
    let currentInterval = '1h';
    let currentSymbol = 'XAUUSD';
    let chartData = { dates: [], klines: [], volumes: [] };
    const indicatorState = { MA: true, EMA: false, BOLL: false, VOL: false, MACD: false };
    let currentPrice = 0, currentBid = 0, currentAsk = 0;
    const wsClient = new GateTradFiWS();
    
    // =================== 3. 右侧抽屉逻辑 ===================
    let isDrawerOpen = true;
    function toggleDrawer() {
        isDrawerOpen = !isDrawerOpen;
        const drawer = document.getElementById('rightDrawer');
        const btn = document.getElementById('drawerToggleBtn');
        if (isDrawerOpen) { drawer.classList.remove('collapsed'); btn.innerText = '▶'; } 
        else { drawer.classList.add('collapsed'); btn.innerText = '◀'; }
        setTimeout(() => myChart.resize(), 350);
    }

    // =================== 4. 技术指标库 ===================
    class Indicators {
        static SMA(data, period) { const result = new Array(data.length).fill(null); for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = i - period + 1; j <= i; j++) sum += data[j]; result[i] = sum / period; } return result; }
        static EMA(data, period) { const result = new Array(data.length).fill(null); if (data.length === 0) return result; const multiplier = 2 / (period + 1); result[0] = data[0]; for (let i = 1; i < data.length; i++) result[i] = (data[i] - result[i - 1]) * multiplier + result[i - 1]; return result; }
        static BOLL(data, period = 20, stdDev = 2) { const middle = this.SMA(data, period); const upper = new Array(data.length).fill(null); const lower = new Array(data.length).fill(null); for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = i - period + 1; j <= i; j++) sum += Math.pow(data[j] - middle[i], 2); const std = Math.sqrt(sum / period); upper[i] = middle[i] + stdDev * std; lower[i] = middle[i] - stdDev * std; } return { upper, middle, lower }; }
        static MACD(data, fast = 12, slow = 26, signal = 9) { const emaFast = this.EMA(data, fast); const emaSlow = this.EMA(data, slow); const dif = new Array(data.length).fill(null); for (let i = 0; i < data.length; i++) if (emaFast[i] !== null && emaSlow[i] !== null) dif[i] = emaFast[i] - emaSlow[i]; const validDif = dif.filter(v => v !== null); const deaValid = this.EMA(validDif, signal); const dea = new Array(data.length).fill(null); const offset = dif.length - deaValid.length; for (let i = 0; i < deaValid.length; i++) dea[offset + i] = deaValid[i]; const macd = new Array(data.length).fill(null); for (let i = 0; i < data.length; i++) if (dif[i] !== null && dea[i] !== null) macd[i] = (dif[i] - dea[i]) * 2; return { dif, dea, macd }; }
    }

    // =================== 5. 内置基础历史数据生成 (解决空白问题) ===================
    function generateFallbackData(interval, count = 100) {
        const now = Date.now();
        const minutesMap = { '1m': 1, '5m': 5, '15m': 15, '30m': 30, '1h': 60, '4h': 240, '1d': 1440 };
        const stepMs = (minutesMap[interval] || 60) * 60 * 1000;
        let basePrice = 4600 + Math.random() * 50; // 基于 XAUUSD 大致区间

        const dates = [], klines = [], volumes = [];
        for (let i = count; i >= 0; i--) {
            const ts = now - i * stepMs;
            const d = new Date(ts);
            const dateStr = formatKlineDate(ts / 1000, interval);
            
            const open = basePrice;
            const close = open + (Math.random() - 0.48) * 15;
            const high = Math.max(open, close) + Math.random() * 8;
            const low = Math.min(open, close) - Math.random() * 8;
            
            dates.push(dateStr);
            klines.push([open, close, low, high]);
            volumes.push(Math.random() * 1000);
            basePrice = close;
        }
        return { dates, klines, volumes };
    }

    function formatKlineDate(timestamp, interval) {
        const d = new Date(timestamp * 1000); const month = d.getMonth() + 1; const date = d.getDate();
        const hours = d.getHours().toString().padStart(2, '0'); const minutes = d.getMinutes().toString().padStart(2, '0');
        if (interval === '1d') return `${month}-${date}`; if (interval.includes('h')) return `${month}-${date} ${hours}:00`; return `${month}-${date} ${hours}:${minutes}`;
    }
    function formatNum(num, decimals = 2) { const n = parseFloat(num); if (isNaN(n)) return '--'; return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }

    // =================== 6. 图表渲染 ===================
    const chartDom = document.getElementById('kline');
    const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

    function updateChart() {
        if (!chartData.klines.length) return;
        const { dates, klines, volumes } = chartData;
        const closes = klines.map(k => k[1]); const highs = klines.map(k => k[3]); const lows = klines.map(k => k[2]);
        
        const totalLen = dates.length; const visibleCount = Math.min(50, totalLen);
        const startIndex = Math.max(0, totalLen - visibleCount); const endIndex = totalLen - 1;

        let minLow = Infinity, maxHigh = -Infinity;
        for (let i = startIndex; i <= endIndex; i++) { minLow = Math.min(minLow, lows[i]); maxHigh = Math.max(maxHigh, highs[i]); }
        const padding = (maxHigh - minLow) * 0.1 || 10; const yMin = minLow - padding; const yMax = maxHigh + padding;
        
        const series = []; const grids = []; const xAxes = []; const yAxes = [];
        const showVol = indicatorState.VOL; const showMacd = indicatorState.MACD;
        let mainHeight = showVol && showMacd ? 50 : showVol || showMacd ? 65 : 100; let currentTop = 5;

        grids.push({ left: 0, right: 0, top: currentTop + '%', height: mainHeight + '%' });
        xAxes.push({ type: 'category', data: dates, gridIndex: 0, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false } });
        yAxes.push({ scale: false, min: yMin, max: yMax, splitNumber: 6, position: 'right', gridIndex: 0, splitLine: { lineStyle: { color: '#2b3139', type: 'dashed' } }, axisLabel: { color: '#848e9c', fontSize: 10, inside: true, margin: 4, formatter: value => formatNum(value, 1), z: 1 } });

        grids.push({ left: 0, right: '10%', top: currentTop + '%', height: mainHeight + '%' });
        xAxes.push({ type: 'category', data: dates, gridIndex: 1, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false } });
        yAxes.push({ scale: false, min: yMin, max: yMax, splitNumber: 6, position: 'right', gridIndex: 1, splitLine: { show: false }, axisLabel: { show: false } });

        const klineSeries = { id: 'klineMain', type: 'candlestick', data: klines, xAxisIndex: 1, yAxisIndex: 1, z: 10, itemStyle: { color: '#0ecb81', color0: '#f6465d', borderColor: '#0ecb81', borderColor0: '#f6465d' }, markLine: { symbol: 'none', animation: false, lineStyle: { type: 'dashed', width: 1 }, label: { position: 'end', distance: 2, color: '#848e9c', fontSize: 10, formatter: '{c}' }, data: [] } };
        if (currentPrice) { klineSeries.markLine.data.push({ yAxis: currentPrice, lineStyle: { color: '#f0b90b' }, label: { formatter: formatNum(currentPrice), color: '#f0b90b', distance: 0 } }); }
        series.push(klineSeries);

        const cleanData = (arr) => arr.map(v => v === null ? '-' : v);

        if (indicatorState.MA && closes.length > 20) {
            series.push({ type: 'line', data: cleanData(Indicators.SMA(closes, 5)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(Indicators.SMA(closes, 10)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f7931a', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(Indicators.SMA(closes, 20)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#00d4aa', width: 1 }, symbol: 'none', smooth: true, z: 20 });
        }
        if (indicatorState.EMA && closes.length > 26) {
            series.push({ type: 'line', data: cleanData(Indicators.EMA(closes, 12)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(Indicators.EMA(closes, 26)), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#a78bfa', width: 1 }, symbol: 'none', smooth: true, z: 20 });
        }
        if (indicatorState.BOLL && closes.length > 20) {
            const boll = Indicators.BOLL(closes, 20, 2);
            series.push({ type: 'line', data: cleanData(boll.upper), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f6465d', width: 0.8, type: 'dashed' }, symbol: 'none', z: 20 });
            series.push({ type: 'line', data: cleanData(boll.middle), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#f0b90b', width: 0.8 }, symbol: 'none', z: 20 });
            series.push({ type: 'line', data: cleanData(boll.lower), xAxisIndex: 1, yAxisIndex: 1, lineStyle: { color: '#0ecb81', width: 0.8, type: 'dashed' }, symbol: 'none', z: 20 });
        }

        if (showVol) {
            currentTop += mainHeight + 6; const volHeight = showMacd ? 15 : 20;
            grids.push({ left: 0, right: '10%', top: currentTop + '%', height: volHeight + '%' });
            const idx = 2;
            xAxes.push({ type: 'category', data: dates, gridIndex: idx, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: idx, splitLine: { show: false }, axisLabel: { show: false } });
            const volColors = klines.map(k => k[1] >= k[0] ? '#0ecb81' : '#f6465d');
            series.push({ type: 'bar', data: volumes.map((v, i) => ({ value: v, itemStyle: { color: volColors[i] } })), xAxisIndex: idx, yAxisIndex: idx, z: 20 });
            currentTop += volHeight;
        }

        if (showMacd && closes.length > 26) {
            if (!showVol) currentTop += mainHeight + 6; const macdHeight = 15; const idx = showVol ? 3 : 2;
            grids.push({ left: 0, right: '10%', top: currentTop + '%', height: macdHeight + '%' });
            xAxes.push({ type: 'category', data: dates, gridIndex: idx, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false } });
            yAxes.push({ gridIndex: idx, splitLine: { show: false }, axisLabel: { show: false } });
            const macdResult = Indicators.MACD(closes);
            const macdColors = macdResult.macd.map(v => v === null ? 'transparent' : v >= 0 ? '#0ecb81' : '#f6465d');
            series.push({ type: 'bar', data: macdResult.macd.map((v, i) => ({ value: v, itemStyle: { color: macdColors[i] } })), xAxisIndex: idx, yAxisIndex: idx, z: 20 });
            series.push({ type: 'line', data: cleanData(macdResult.dif), xAxisIndex: idx, yAxisIndex: idx, lineStyle: { color: '#f0b90b', width: 1 }, symbol: 'none', smooth: true, z: 20 });
            series.push({ type: 'line', data: cleanData(macdResult.dea), xAxisIndex: idx, yAxisIndex: idx, lineStyle: { color: '#e879f9', width: 1 }, symbol: 'none', smooth: true, z: 20 });
        }

        myChart.setOption({
            animation: false, grid: grids, xAxis: xAxes, yAxis: yAxes, series: series,
            dataZoom: [{ type: 'inside', xAxisIndex: [1], start: (startIndex/totalLen)*100, end: 100 }],
            tooltip: {
                trigger: 'axis', triggerOn: 'click', confine: true, appendToBody: true, backgroundColor: '#000', borderColor: '#333', borderWidth: 1,
                textStyle: { color: '#fff', fontSize: 10 }, padding: [8, 10],
                axisPointer: { type: 'cross', lineStyle: { color: '#555', type: 'dashed', width: 1 }, crossStyle: { color: '#555', type: 'dashed', width: 1 } },
                extraCssText: 'width:30%; min-width:80px; max-width:120px; box-shadow:0 0 8px rgba(0,0,0,0.6); border-radius:4px;',
                formatter: function(params) {
                    if (!params || params.length === 0) return '';
                    const dataIndex = params[0].dataIndex;
                    if (dataIndex == null || dataIndex >= chartData.dates.length) return '';
                    const date = chartData.dates[dataIndex]; const open = chartData.klines[dataIndex][0]; const close = chartData.klines[dataIndex][1];
                    const low = chartData.klines[dataIndex][2]; const high = chartData.klines[dataIndex][3];
                    const change = close - open; const changePercent = open !== 0 ? (change / open) * 100 : 0; const colorChange = change >= 0 ? '#0ecb81' : '#f6465d';
                    return `<div style="font-size:10px; line-height:1.6;"><div style="color:#aaa;">时间：${date}</div><div>开：${formatNum(open)}</div><div>高：${formatNum(high)}</div><div>低：${formatNum(low)}</div><div>收：${formatNum(close)}</div><div style="color:${colorChange};">涨跌：${change >= 0 ? '+' : ''}${formatNum(change)}</div><div style="color:${colorChange};">涨跌幅：${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(2)}%</div></div>`;
                }
            }
        }, true);
    }

    // =================== 7. 初始化与实时推流 ===================
    function initData() {
        // 核心修复：先用本地数据生成器垫底，保证一打开绝不空白
        chartData = generateFallbackData(currentInterval, 100);
        updateChart();

        wsClient.connect();

        wsClient.subscribe('tradfi.tickers', { markets: [currentSymbol] }, (result) => {
            const ticker = result.find(t => t.symbol === currentSymbol);
            if (ticker) {
                currentPrice = parseFloat(ticker.last_price);
                const change = parseFloat(ticker.price_change_rate);
                document.getElementById('last-price').innerText = formatNum(currentPrice);
                document.getElementById('open-price').innerText = formatNum(ticker.open_price);
                document.getElementById('high-24').innerText = formatNum(ticker.high);
                document.getElementById('low-24').innerText = formatNum(ticker.low);
                document.getElementById('cn-price').innerHTML = `$${formatNum(currentPrice)} <span class="${change >= 0 ? 'green' : 'red'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>`;
                updateChart();
            }
        });

        wsClient.subscribe('tradfi.order_book', [currentSymbol], (result) => {
            const book = result.find(b => b.symbol === currentSymbol);
            if (book) {
                currentBid = parseFloat(book.bid); currentAsk = parseFloat(book.ask);
                document.getElementById('sell-bar').innerText = `卖 ${formatNum(currentAsk)}`;
                document.getElementById('buy-bar').innerText = `买 ${formatNum(currentBid)}`;
                updateOrderTab();
            }
        });
        
        subscribeKline(currentInterval);
    }

    function subscribeKline(interval) {
        wsClient.subscribe('tradfi.candlesticks', [interval, currentSymbol], (result) => {
            result.forEach(k => {
                const [intv, symbol] = k.n.split('_');
                if (intv !== currentInterval || symbol !== currentSymbol) return;

                const open = parseFloat(k.o), close = parseFloat(k.c), high = parseFloat(k.h), low = parseFloat(k.l);
                const volume = parseFloat(k.v) || 0; const dateStr = formatKlineDate(k.t, intv);
                const newKline = [open, close, low, high];
                
                if (chartData.dates.length > 0) {
                    const lastIdx = chartData.dates.length - 1;
                    if (chartData.dates[lastIdx] === dateStr) { 
                        // 如果最新的一根时间戳一致，直接平滑替换
                        chartData.klines[lastIdx] = newKline; chartData.volumes[lastIdx] = volume; 
                    } else {
                        // 新的 K 线产生了，由于我们初始化有 100 根假数据，这里直接推入新的真实数据，慢慢替代
                        chartData.dates.push(dateStr); chartData.klines.push(newKline); chartData.volumes.push(volume);
                        if (chartData.dates.length > 150) { chartData.dates.shift(); chartData.klines.shift(); chartData.volumes.shift(); }
                    }
                }
                updateChart();
            });
        });
    }

    // 启动
    initData();
    window.addEventListener('resize', () => myChart.resize());
</script>
