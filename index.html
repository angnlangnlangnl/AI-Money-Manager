<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI 金融助手</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 主应用样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 4px;
        }
        .message-bubble a {
            color: #60a5fa;
            text-decoration: underline;
        }
        .typing-cursor::after {
            content: '▊';
            animation: blink 1s step-end infinite;
            color: #6a6a7a;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }
        .tap-active:active {
            transform: scale(0.96);
            opacity: 0.7;
        }
        .drawer {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drawer.open {
            transform: translateX(0);
        }
        .drawer.closed {
            transform: translateX(-100%);
        }
        .overlay {
            transition: opacity 0.3s ease;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay.closed {
            opacity: 0;
            pointer-events: none;
        }

        #chatInput {
            min-height: 24px;
            max-height: 66px;
            font-size: 13px;
            padding: 6px 10px;
            transition: all 0.2s ease;
            background: transparent !important;
            color: #e8e8f0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            line-height: 1.4;
            caret-color: #e8e8f0;
            box-shadow: none !important;
            text-shadow: none !important;
        }
        #chatInput::before,
        #chatInput::after {
            display: none !important;
            content: none !important;
        }
        #chatInput::-webkit-scrollbar {
            width: 0;
            height: 0;
            background: transparent;
        }
        #chatInput::-webkit-scrollbar-thumb {
            background: transparent;
        }
        #chatInput::placeholder {
            color: #5a5a6a;
        }
        #chatInput.recording {
            background: #1a3a2a !important;
            color: #4ade80 !important;
            border-radius: 12px;
            caret-color: #4ade80 !important;
        }
        #chatInput.cancel-mode {
            background: #3a1a1a !important;
            color: #f87171 !important;
            border-radius: 12px;
            caret-color: #f87171 !important;
        }
        .input-container {
            background: #12121f;
            border-radius: 16px;
            border: 1px solid #1a1a2a;
            padding: 2px 4px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            transition: border-color 0.2s;
            flex: 1;
            box-shadow: none !important;
        }
        .input-container:focus-within {
            border-color: #3b82f6;
        }
        .input-container::before,
        .input-container::after {
            display: none !important;
            content: none !important;
        }

        .quick-scroll {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .quick-scroll::-webkit-scrollbar {
            display: none;
        }

        .report-card {
            background: linear-gradient(145deg, #12121f, #0d0d18);
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 16px;
            margin: 8px 0;
            width: 100%;
        }
        .report-card h3 {
            color: #60a5fa;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 8px;
        }
        .report-card ul {
            list-style: none;
            padding: 0;
        }
        .report-card li {
            padding: 6px 0;
            border-bottom: 1px solid #1a1a2a;
            font-size: 0.85rem;
            color: #c8c8d8;
        }
        .report-card li:last-child {
            border-bottom: none;
        }
        .report-card .highlight {
            color: #fbbf24;
            font-weight: 500;
        }
        .report-card .tag {
            display: inline-block;
            background: #1a1a2a;
            color: #8a8a9a;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 4px;
        }
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .report-grid .item {
            background: #0a0a12;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #1a1a2a;
        }
        .report-grid .item .num {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e8e8f0;
        }
        .report-grid .item .label {
            font-size: 0.65rem;
            color: #6a6a7a;
        }
        .report-btn {
            background: #1a2a3a;
            border-color: #2a6a4a;
        }
        .report-btn:active {
            background: #2a4a3a;
        }

        .voice-msg-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px 6px 8px;
            background: #1a2a3a;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 60px;
            max-width: 200px;
        }
        .voice-msg-wrapper:active {
            background: #2a4a5a;
        }
        .voice-msg-wrapper .voice-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .voice-msg-wrapper .voice-icon svg {
            width: 20px;
            height: 20px;
            fill: #60a5fa;
        }
        .voice-msg-wrapper .voice-icon.playing svg {
            fill: #4ade80;
        }
        .voice-msg-wrapper .duration {
            font-size: 13px;
            color: #c8c8d8;
            font-weight: 500;
            min-width: 32px;
            text-align: center;
        }
        .voice-msg-wrapper .duration.playing {
            color: #4ade80;
        }
        .voice-msg-wrapper .duration .wave {
            display: inline-block;
            animation: wave 1.2s ease-in-out infinite;
        }
        @keyframes wave {
            0%,
            100% {
                transform: scaleY(0.4);
            }
            50% {
                transform: scaleY(1);
            }
        }

        #cancelTip {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #dc2626;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.4);
        }
        #cancelTip.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        #voiceBtn.active {
            background: #1a3a2a !important;
            border-color: #4ade80 !important;
        }
        #voiceBtn.active svg {
            stroke: #4ade80 !important;
        }

        .top-nav {
            padding-top: 3.6px !important;
            padding-bottom: 3.6px !important;
        }
        .top-nav-border {
            border-bottom-width: 1px;
        }
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 2px 0;
        }
        .chat-header .label {
            font-size: 10px;
            color: #5a5a6a;
        }
        .chat-header .label .highlight {
            color: #4a9a5a;
        }

        .share-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .share-overlay.show {
            display: flex;
        }
        .share-panel {
            background: #12121f;
            border-radius: 24px 24px 0 0;
            padding: 20px 24px 34px;
            width: 100%;
            max-width: 420px;
            max-height: 80vh;
            animation: slideUp 0.35s ease;
            border-top: 1px solid #1a1a2a;
        }
        .share-panel .handle {
            width: 40px;
            height: 4px;
            background: #2a2a3a;
            border-radius: 4px;
            margin: 0 auto 16px;
        }
        .share-panel .title {
            font-size: 16px;
            font-weight: 600;
            color: #e8e8f0;
            text-align: center;
            margin-bottom: 16px;
        }
        .share-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .share-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 0;
            border-radius: 12px;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .share-item:active {
            background: #1a1a2a;
            transform: scale(0.95);
        }
        .share-item .icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: transform 0.2s;
        }
        .share-item .icon-wrap svg {
            width: 26px;
            height: 26px;
        }
        .share-item .label {
            font-size: 10px;
            color: #8a8a9a;
        }
        .share-cancel {
            display: block;
            width: 100%;
            padding: 12px;
            background: #1a1a2a;
            border: none;
            border-radius: 12px;
            color: #8a8a9a;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .share-cancel:active {
            background: #2a2a3a;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0.5;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .settings-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            z-index: 999;
            display: none;
            flex-direction: column;
            animation: fadeIn 0.25s ease;
        }
        .settings-overlay.show {
            display: flex;
        }
        .settings-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #1a1a2a;
            flex-shrink: 0;
            background: #0a0a0f;
            min-height: 52px;
        }
        .settings-header .back-btn {
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            transition: background 0.2s;
            color: #8a8a9a;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            margin-right: 12px;
        }
        .settings-header .back-btn:active {
            background: #1a1a2a;
        }
        .settings-header .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #8a8a9a;
            fill: none;
            stroke-width: 2;
        }
        .settings-header .title {
            font-size: 18px;
            font-weight: 600;
            color: #e8e8f0;
            flex: 1;
            text-align: center;
            margin-right: 40px;
        }
        .settings-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 30px;
            background: #0a0a0f;
        }
        .settings-section {
            background: #0d0d18;
            border-radius: 16px;
            border: 1px solid #1a1a2a;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .settings-section .section-title {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #8a8a9a;
            border-bottom: 1px solid #1a1a2a;
        }
        .settings-section .section-content {
            padding: 12px 16px;
        }
        .settings-input {
            width: 100%;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: #e8e8f0;
            outline: none;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .settings-input:focus {
            border-color: #3b82f6;
        }
        .settings-input::placeholder {
            color: #4a4a5a;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        .info-row .label {
            color: #6a6a7a;
        }
        .info-row .value {
            color: #e8e8f0;
            font-weight: 500;
        }
        .settings-btn-primary {
            width: 100%;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .settings-btn-primary:active {
            background: #2563eb;
        }
        .settings-btn-secondary {
            width: 100%;
            background: #1a1a2a;
            color: #8a8a9a;
            border: 1px solid #2a2a3a;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .settings-btn-secondary:active {
            background: #2a2a3a;
        }
        .settings-btn-cancel {
            width: 100%;
            background: #1a1a2a;
            color: #6a6a7a;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .settings-btn-cancel:active {
            background: #2a2a3a;
        }
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .dashboard-stats .stat-item {
            text-align: center;
            padding: 8px 0;
            background: #0a0a12;
            border-radius: 10px;
        }
        .dashboard-stats .stat-num {
            font-size: 18px;
            font-weight: 700;
            color: #e8e8f0;
            display: block;
        }
        .dashboard-stats .stat-label {
            font-size: 10px;
            color: #5a5a6a;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-switch .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #2a2a3a;
            border-radius: 24px;
            transition: background 0.3s;
        }
        .toggle-switch .slider::before {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: #6a6a7a;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .toggle-switch input:checked + .slider {
            background: #3b82f6;
        }
        .toggle-switch input:checked + .slider::before {
            transform: translateX(20px);
            background: #fff;
        }

        .rebate-dashboard {
            background: #0d0d18;
            border: 1px solid #1a1a2a;
            border-radius: 16px;
            padding: 20px;
            margin: 12px 0 4px 0;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .rebate-dashboard:hover {
            border-color: #2a3a4a;
        }
        .rebate-dashboard::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05), transparent);
            pointer-events: none;
        }
        .rebate-dashboard::after {
            content: '💰';
            position: absolute;
            bottom: -10px;
            right: -10px;
            font-size: 60px;
            opacity: 0.03;
            pointer-events: none;
        }
        .rebate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        .rebate-item {
            flex: 1;
        }
        .rebate-item-left {
            text-align: left;
        }
        .rebate-item-right {
            text-align: right;
        }
        .rebate-label {
            font-size: 12px;
            color: #8a8a9a;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .rebate-label-left {
            justify-content: flex-start;
        }
        .rebate-label-right {
            justify-content: flex-end;
        }
        .rebate-total-amount {
            font-size: 32px;
            font-weight: 800;
            color: #10b981;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            line-height: 1;
            animation: rebatePulse 3s ease-in-out infinite;
        }
        .rebate-pending-amount {
            font-size: 22px;
            font-weight: 700;
            color: #f59e0b;
            line-height: 1;
        }
        @keyframes rebatePulse {
            0%,
            100% {
                text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
            }
        }
        .rebate-divider {
            border-top: 1px solid rgba(42, 58, 74, 0.4);
            margin: 12px 0;
            position: relative;
            z-index: 1;
        }
        .rebate-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8a8a9a;
            position: relative;
            z-index: 1;
        }
        .rebate-stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rebate-stat-icon {
            font-size: 14px;
        }
        .rebate-stat-value {
            color: #e8e8f0;
            font-weight: 700;
        }
        .rebate-rate-badge {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 11px;
        }
        @media (max-width: 360px) {
            .rebate-total-amount {
                font-size: 24px;
            }
            .rebate-pending-amount {
                font-size: 18px;
            }
        }

        .wave-bars {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 20px;
        }
        .wave-bars span {
            display: block;
            width: 3px;
            height: 100%;
            background: #4ade80;
            border-radius: 2px;
            animation: waveAnim 0.8s ease-in-out infinite alternate;
        }
        .wave-bars span:nth-child(1) {
            animation-delay: 0s;
            height: 40%;
        }
        .wave-bars span:nth-child(2) {
            animation-delay: 0.2s;
            height: 70%;
        }
        .wave-bars span:nth-child(3) {
            animation-delay: 0.4s;
            height: 100%;
        }
        .wave-bars span:nth-child(4) {
            animation-delay: 0.6s;
            height: 60%;
        }
        .wave-bars span:nth-child(5) {
            animation-delay: 0.3s;
            height: 80%;
        }
        @keyframes waveAnim {
            0% {
                transform: scaleY(0.3);
            }
            100% {
                transform: scaleY(1);
            }
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 4px 0;
        }
        .msg-wrapper .msg-row-ai {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            padding-left: 12px;
        }
        .msg-wrapper .msg-row-ai .msg-avatar {
            margin-bottom: 4px;
            margin-left: 2px;
        }
        .msg-wrapper .msg-row-ai .msg-bubble {
            max-width: 96%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            background: #12121f;
            border: 1px solid #1a1a2a;
            border-top-left-radius: 4px;
        }
        .msg-wrapper .msg-row-user {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 10px;
            width: 100%;
        }
        .msg-wrapper .msg-row-user .msg-avatar {
            flex-shrink: 0;
            order: 2;
        }
        .msg-wrapper .msg-row-user .msg-bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            background: #3b82f6;
            border-top-right-radius: 4px;
            color: #fff;
            order: 1;
        }
        .msg-wrapper .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;

        .token-modal .search-input::placeholder {

        .token-modal .token-option {

            padding: 10px 12px;

            margin-bottom: 4px;

        }
        .token-modal .token-option .token-name {
            font-size: 13px;
            font-weight: 600;
            color: #e8e8f0;
            white-space: nowrap;
        }
        .token-modal .token-option .token-price {
            font-size: 11px;
            color: #6a6a7a;
            white-space: nowrap;
            flex: 1;
            text-align: center;
            margin: 0 8px;
        }
        .token-modal .token-option .check-icon {
            color: #3b82f6;
            font-size: 14px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }
        .token-modal .no-results {

            padding: 15px;
            color: #5a5a6a;
            font-size: 12px;
        }
        .token-modal .save-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
            margin-top: 8px;
        }

            background: #0d9668;
        }

        /* 合约输入框 - 修复显示错误 */
        .contract-input-section {
            border-top: 1px solid #1a1a2a;
            padding-top: 12px;
            margin-top: 4px;
            flex-shrink: 0;
            display: block;

            font-size: 11px;
            color: #8a8a9a;
            margin-bottom: 8px;

        }
        .contract-input-row {

            gap: 8px;
            align-items: center;
            width: 100%;

            flex: 1;
            background: #0a0a12;
            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            color: #e8e8f0;
            outline: none;
            min-width: 0;
            width: 100%;
            height: 38px;
            line-height: 1.2;
        }
        .contract-input-row input:focus {
            border-color: #3b82f6;
        }
        .contract-input-row input::placeholder {
            color: #5a5a6a;
        }
        .contract-add-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
            flex-shrink: 0;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .contract-add-btn:active {
            background: #2563eb;
        }
        .contract-add-btn:disabled {
            background: #2a2a3a;
            color: #6a6a7a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- 设置面板 -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-header">
            <div class="back-btn" onclick="closeSettings()" title="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </div>
            <span class="title">⚙️ 设置</span>
        </div>

        <div class="settings-body">
            <div class="settings-section">
                <div class="section-title">👤 用户信息</div>
                <div class="section-content">
                    <div class="info-row">
                        <span class="label">用户ID</span>
                        <span class="value" id="userIdDisplay">user_001</span>
                    </div>
                    <div class="info-row">
                        <span class="label">推广员ID</span>
                        <input type="text" id="promoterIdInput" placeholder="输入推广员ID" class="settings-input">
                    </div>
                </div>
            </div>

            <!-- 累计返利卡片 - 移动到API配置卡片上面 -->
            <div class="rebate-dashboard" id="rebateDashboard">
                <div class="rebate-header">
                    <div class="rebate-item rebate-item-left">
                        <div class="rebate-label rebate-label-left">
                            <span>💰</span>
                            <span>累计返利</span>
                        </div>
                        <div class="rebate-total-amount" id="totalRebate">$0.00</div>
                    </div>
                    <div class="rebate-item rebate-item-right">
                        <div class="rebate-label rebate-label-right">
                            <span>⏳</span>
                            <span>待结算</span>
                        </div>
                        <div class="rebate-pending-amount" id="pendingRebate">$0.00</div>
                    </div>
                </div>
                <div class="rebate-divider"></div>
                <div class="rebate-footer">
                    <div class="rebate-stat">
                        <span class="rebate-stat-icon">👥</span>
                        <span>推广用户：</span>
                        <span class="rebate-stat-value" id="totalUsers">0</span>
                        <span>人</span>
                    </div>
                    <div class="rebate-rate-badge">💎 返利比例：2%</div>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title">🔑 API配置</div>
                <div class="section-content">
                    <input type="text" id="apiKeyInput" placeholder="API Key" class="settings-input">
                    <input type="password" id="apiSecretInput" placeholder="API Secret" class="settings-input">
                    <input type="password" id="apiPassphraseInput" placeholder="Passphrase (Gate.io)" class="settings-input">
                    <button onclick="saveApiConfig()" class="settings-btn-primary">💾 保存配置</button>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title">🌙 深色模式</div>
                <div class="section-content">
                    <div class="toggle-row">
                        <span class="label">启用深色模式</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="darkModeToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 代币选择弹窗 -->
    <div class="token-modal-overlay" id="tokenModalOverlay" onclick="closeTokenModal(event)">

            <div class="modal-title">🔍 管理代币</div>
            <input type="text" class="search-input" id="tokenSearchInput" placeholder="搜索代币..." oninput="filterTokenList()">
            <div class="token-list" id="tokenModalContent"></div>

            <div class="contract-input-section">

            <button class="save-btn" onclick="saveTokenSelection()">💾 保存选择</button>
        </div>

        let recognition = null;

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('浏览器不支持语音识别');
                return false;
            }
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
                recognition = null;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            return true;
        }

        function startSpeechToText(onResult, onError) {
            if (!recognition) {
                if (!initSpeechRecognition()) {
                    if (onError) onError('浏览器不支持语音识别，请使用Chrome或Edge浏览器');
                    return;
                }
            }

            if (isListening) {
                try {
                    recognition.stop();
                } catch (e) {}
                isListening = false;
                setTimeout(() => {
                    startSpeechToText(onResult, onError);
                }, 100);
                return;
            }

            recognition.onresult = null;
            recognition.onerror = null;
            recognition.onend = null;

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        if (onResult) onResult(transcript, true);
                    } else {
                        if (onResult) onResult(transcript, false);
                    }
                }
            };

            recognition.onerror = function(event) {
                if (onError) {
                    let msg = '语音识别错误';
                    if (event.error === 'not-allowed') msg = '请允许使用麦克风权限';
                    else if (event.error === 'no-speech') msg = '未检测到语音，请重新尝试';
                    else if (event.error === 'audio-capture') msg = '无法访问麦克风';
                    else if (event.error === 'aborted') {
                        return;
                    } else msg = '语音识别失败：' + event.error;
                    onError(msg);
                }
            };

            recognition.onend = function() {
                isListening = false;
            };

            try {
                recognition.start();
                isListening = true;
            } catch (e) {
                if (onError) onError('启动语音识别失败：' + e.message);
            }
        }

        function stopSpeechToText() {
            if (recognition) {
                try {

            }

        // 判断合约地址属于哪条链
        function detectChainFromAddress(address) {
            const addr = address.toLowerCase().trim();
            
            // Ethereum 合约地址：0x开头，42个字符
            if (addr.startsWith('0x') && addr.length === 42) {
                return 'ethereum';
            }
            
            // Solana 合约地址：base58编码，通常32-44个字符，不含0x
            if (!addr.startsWith('0x') && addr.length >= 32 && addr.length <= 44) {
                return 'solana';
            }
            
            return 'unknown';
        }

        async function fetchEthereumTokenData(contractAddress) {

                );
                
                if (!response.ok) {
                    throw new Error('API请求失败');
                }
                
                const data = await response.json();
                
                let matchedToken = null;
                if (data.coins && data.coins.length > 0) {
                    for (const coin of data.coins) {
                        try {
                            const detailResponse = await fetch(
                                `https://api.coingecko.com/api/v3/coins/${coin.id}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false`
                            );
                            if (detailResponse.ok) {
                                const detail = await detailResponse.json();
                                const platforms = detail.platforms || {};
                                if (platforms.ethereum && platforms.ethereum.toLowerCase() === contractAddress.toLowerCase()) {
                                    matchedToken = {
                                        symbol: detail.symbol ? detail.symbol.toUpperCase() : coin.symbol.toUpperCase(),
                                        name: detail.name || coin.name,
                                        price: detail.market_data?.current_price?.usd || null,
                                        chain: 'Ethereum',
                                        contractAddress: contractAddress
                                    };
                                    break;
                                }
                                if (platforms['binance-smart-chain'] && platforms['binance-smart-chain'].toLowerCase() === contractAddress.toLowerCase()) {
                                    matchedToken = {
                                        symbol: detail.symbol ? detail.symbol.toUpperCase() : coin.symbol.toUpperCase(),
                                        name: detail.name || coin.name,
                                        price: detail.market_data?.current_price?.usd || null,
                                        chain: 'BNB Chain',
                                        contractAddress: contractAddress
                                    };
                                    break;
                                }
                            }
                        } catch (innerErr) {
                            continue;
                        }
                    }
                }
                
                if (!matchedToken) {
                    matchedToken = await fetchTokenFromRPC(contractAddress, 'ethereum');
                }
                
                return matchedToken;
            } catch (error) {
                console.error('获取以太坊代币数据失败:', error);

        // 使用RPC获取ERC20代币信息（备用方案）
        async function fetchTokenFromRPC(contractAddress, chain) {
            const rpcUrls = {
                'ethereum': 'https://eth.llamarpc.com',
                'bsc': 'https://bsc-dataseed.binance.org'
            };
            
            const rpcUrl = rpcUrls[chain] || rpcUrls['ethereum'];
            
            try {
                const nameResponse = await fetch(rpcUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'eth_call',
                        params: [{
                            to: contractAddress,
                            data: '0x06fdde03'
                        }, 'latest'],
                        id: 1
                    })
                });
                
                const symbolResponse = await fetch(rpcUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'eth_call',
                        params: [{
                            to: contractAddress,
                            data: '0x95d89b41'
                        }, 'latest'],
                        id: 2
                    })
                });
                
                let symbol = 'UNKNOWN';
                let name = 'Unknown Token';
                
                if (symbolResponse.ok) {
                    const symbolData = await symbolResponse.json();
                    if (symbolData.result && symbolData.result !== '0x') {
                        const hexSymbol = symbolData.result.slice(2);
                        let symbolStr = '';
                        for (let i = 0; i < hexSymbol.length; i += 2) {
                            const charCode = parseInt(hexSymbol.substr(i, 2), 16);
                            if (charCode > 0) {
                                symbolStr += String.fromCharCode(charCode);
                            }
                        }
                        if (symbolStr) symbol = symbolStr;
                    }
                }
                
                if (nameResponse.ok) {
                    const nameData = await nameResponse.json();
                    if (nameData.result && nameData.result !== '0x') {
                        const hexName = nameData.result.slice(2);
                        let nameStr = '';
                        for (let i = 0; i < hexName.length; i += 2) {
                            const charCode = parseInt(hexName.substr(i, 2), 16);
                            if (charCode > 0) {
                                nameStr += String.fromCharCode(charCode);
                            }
                        }
                        if (nameStr) name = nameStr;
                    }
                }
                
                return {
                    symbol: symbol,
                    name: name,
                    price: null,
                    chain: chain === 'ethereum' ? 'Ethereum' : 'BNB Chain',
                    contractAddress: contractAddress
                };
            } catch (error) {
                console.error('RPC获取代币信息失败:', error);
                return null;
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isRecording = true;
                audioChunks = [];
                recordingDuration = 0;

                const input = document.getElementById('chatInput');
                input.classList.add('recording');
                input.value = '录音中 0s';

                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };
                mediaRecorder.onstop = function() {
                    stream.getTracks().forEach(function(track) { track.stop(); });
                };
                mediaRecorder.start(100);

                recordingTimer = setInterval(function() {
                    recordingDuration++;
                    const inputEl = document.getElementById('chatInput');
                    if (inputEl && isRecording) {
                        inputEl.value = '录音中 ' + recordingDuration + 's';
                    }
                    if (recordingDuration >= 60) {
                        stopRecording(true);
                    }
                }, 1000);

            } catch (err) {
                isRecording = false;
                const input = document.getElementById('chatInput');
                input.classList.remove('recording');
                input.value = '';
                input.placeholder = '按住录音，松开发送';
                addSystemMessage('无法访问麦克风，请检查权限设置');
            }
        }

        function stopRecording(send) {
            if (!isRecording) return;
            isRecording = false;

            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            const input = document.getElementById('chatInput');
            input.classList.remove('recording', 'cancel-mode');
            input.value = '';
            input.placeholder = '按住录音，松开发送';
            document.getElementById('cancelTip').classList.remove('show');

            const duration = recordingDuration;

            if (send && duration >= 1 && audioChunks.length > 0) {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                addVoiceMessage(duration, audioBlob);
            } else if (duration < 1 && send) {
                addSystemMessage('录音太短，请按住久一点再发送');
            }

            audioChunks = [];
        }

        function addVoiceMessage(duration, audioBlob) {
            const msgId = 'voice_' + Date.now();
            _voiceData[msgId] = audioBlob;

            const durationStr = formatDuration(duration);
            const voiceWidth = getVoiceWidth(duration);
            const timeStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            wrapper.innerHTML = `

                    <div class="msg-bubble" style="background:#3b82f6;color:#fff;border-top-right-radius:4px;max-width:82%;padding:6px 12px;">
                        <div class="voice-msg-wrapper" onclick="playVoiceMessage('${msgId}')" style="width:${voiceWidth}px; background:rgba(255,255,255,0.15);">
                            <span class="voice-icon" id="voiceIcon_${msgId}">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a1 1 0 0 1 1 1v16a1 1 0 0 1-2 0V4a1 1 0 0 1 1-1zm-4 3a1 1 0 0 0-1 1v10a1 1 0 0 0 2 0V7a1 1 0 0 0-1-1zm8 0a1 1 0 0 0-1 1v10a1 1 0 0 0 2 0V7a1 1 0 0 0-1-1z"/></svg>
                            </span>
                            <span class="duration" id="duration_${msgId}">${durationStr}</span>
                        </div>
                    </div>
                </div>
                <div class="msg-time user-time">${timeStr}</div>
            `;

            document.getElementById('messageList').appendChild(wrapper);
            const container = document.getElementById('messageList');
            container.scrollTop = container.scrollHeight;
        }

        function playVoiceMessage(msgId) {
            const data = _voiceData;
            if (!data || !data[msgId]) return;

            if (currentAudio) {
                currentAudio.pause();
                if (currentPlayingId) updateSpeakerIcon(currentPlayingId, 'idle');
            }

            const audioBlob = data[msgId];
            const url = URL.createObjectURL(audioBlob);
            const audio = new Audio(url);

            currentAudio = audio;
            currentPlayingId = msgId;
            updateSpeakerIcon(msgId, 'playing');

            audio.onended = function() {
                updateSpeakerIcon(msgId, 'idle');
                currentAudio = null;
                currentPlayingId = null;
                URL.revokeObjectURL(url);
            };

            audio.play().catch(function() {});
        }

        function updateSpeakerIcon(msgId, state) {
            const icon = document.getElementById('voiceIcon_' + msgId);
            const duration = document.getElementById('duration_' + msgId);
            if (!icon) return;

            if (state === 'playing') {
                icon.classList.add('playing');
                icon.innerHTML = `
                    <div class="wave-bars">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                `;
                if (duration) duration.classList.add('playing');
            } else {
                icon.classList.remove('playing');
                icon.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a1 1 0 0 1 1 1v16a1 1 0 0 1-2 0V4a1 1 0 0 1 1-1zm-4 3a1 1 0 0 0-1 1v10a1 1 0 0 0 2 0V7a1 1 0 0 0-1-1zm8 0a1 1 0 0 0-1 1v10a1 1 0 0 0 2 0V7a1 1 0 0 0-1-1z"/></svg>
                `;
                if (duration) duration.classList.remove('playing');
            }
        }

        function formatDuration(seconds) {
            const s = Math.floor(seconds);
            const m = Math.floor(s / 60);
            const secs = s % 60;
            return m > 0 ? m + ':' + String(secs).padStart(2, '0') : '0:' + String(secs).padStart(2, '0');
        }

        function getVoiceWidth(duration) {
            const minWidth = 60;
            const maxWidth = 200;
            const minDuration = 1;
            const maxDuration = 60;
            const width = minWidth + (maxWidth - minWidth) * Math.min(duration - minDuration, maxDuration - minDuration) / (
                maxDuration - minDuration);
            return Math.max(minWidth, Math.min(maxWidth, Math.round(width)));
        }

        // ============================================================
        //  消息发送逻辑
        // ============================================================
        function sendMessage(text) {
            if (!text || text.trim() === '' || isProcessing) return;

            const trimmedText = text.trim();
            const lower = trimmedText.toLowerCase();

            if (lower === '你好' || lower === '您好' || lower === 'hi' || lower === 'hello') {
                messages.push({ id: `user-${Date.now()}`, role: 'user', content: trimmedText, timestamp: new Date(),
                    type: 'text' });
                messages.push({ id: `ai-${Date.now()}`, role: 'assistant', content: getWhatCanDoContent(), timestamp: new Date(),
                    type: 'text' });
                renderMessages();
                updateSendButton();
                return;
            }

            if (lower.includes('你能做什么') || lower.includes('你会什么') || lower.includes('功能介绍') || lower.includes('有什么用') ||
                lower.includes('帮助')) {
                messages.push({ id: `user-${Date.now()}`, role: 'user', content: trimmedText, timestamp: new Date(),
                    type: 'text' });
                messages.push({ id: `ai-${Date.now()}`, role: 'assistant', content: getWhatCanDoContent(), timestamp: new Date(),
                    type: 'text' });
                renderMessages();
                updateSendButton();
                return;
            }

            if (lower.includes('市场需求') || lower.includes('市场有多大') || lower.includes('规模') || lower.includes('tam') || lower
                .includes('市场空间')) {
                messages.push({ id: `user-${Date.now()}`, role: 'user', content: trimmedText, timestamp: new Date(),
                    type: 'text' });
                messages.push({ id: `ai-${Date.now()}`, role: 'assistant', content: getMarketDemandContent(), timestamp: new Date(),
                    type: 'text' });
                renderMessages();
                updateSendButton();
                return;
            }

            if (lower.includes('抢占市场') || lower.includes('收费') || lower.includes('定价') || lower.includes('怎么赚钱') || lower
                .includes('商业模式') || lower.includes('付费') || lower.includes('推广') || lower.includes('裂变')) {
                messages.push({ id: `user-${Date.now()}`, role: 'user', content: trimmedText, timestamp: new Date(),
                    type: 'text' });
                messages.push({ id: `ai-${Date.now()}`, role: 'assistant', content: getPricingContent(), timestamp: new Date(),
                    type: 'text' });
                renderMessages();
                updateSendButton();
                return;
            }

            if (lower.includes('黄金') || lower.includes('gold') || lower.includes('金价') || lower.includes('贵金属') || lower
                .includes('分析黄金')) {
                messages.push({ id: `user-${Date.now()}`, role: 'user', content: trimmedText, timestamp: new Date(),
                    type: 'text' });
                messages.push({ id: `ai-${Date.now()}`, role: 'assistant', content: getGoldContent(), timestamp: new Date(),
                    type: 'text' });
                renderMessages();
                updateSendButton();
                return;
            }

            if (!isAssetRelated(trimmedText)) {
                messages.push({ id: `user-${Date.now()}`, role: 'user', content: trimmedText, timestamp: new Date(),
                    type: 'text' });
                messages.push({ id: `system-${Date.now()}`, role: 'system',
                    content: '你已经超出对话范围，请输入数字资产管理相关指令', timestamp: new Date(), type: 'text' });
                renderMessages();
                updateSendButton();
                return;
            }

            messages.push({ id: `user-${Date.now()}`, role: 'user', content: trimmedText, timestamp: new Date(),
                type: 'text' });
            isProcessing = true;
            renderMessages();
            updateSendButton();

            callDeepSeek(trimmedText)
                .then(aiResponse => {
                    messages.push({ id: `ai-${Date.now()}`, role: 'assistant', content: aiResponse, timestamp: new Date(),
                        type: 'text' });
                    isProcessing = false;
                    renderMessages();
                    updateSendButton();
                })
                .catch(error => {
                    console.error('DeepSeek API调用失败:', error);
                    messages.push({ id: `ai-${Date.now()}`, role: 'assistant',
                        content: `AI服务调用失败：${error.message || '未知错误'}\n\n请检查网络连接或API配置。`,
                        timestamp: new Date(), type: 'text' });
                    isProcessing = false;
                    renderMessages();
                    updateSendButton();
                });
        }

        // ============================================================
        //  渲染消息
        // ============================================================
        function renderMessages() {
            const container = document.getElementById('messageList');
            const children = container.children;
            const toRemove = [];
            for (let i = 0; i < children.length; i++) {
                const child = children[i];
                if (!child.querySelector('.voice-msg-wrapper')) {
                    toRemove.push(child);
                }
            }
            toRemove.forEach(el => el.remove());

            let html = '';
            messages.forEach(msg => {
                const isUser = msg.role === 'user';
                const isSystem = msg.role === 'system';
                const isReport = msg.type === 'report';
                const isTransaction = msg.type === 'transaction_preview';
                const isAlert = msg.type === 'alert';
                const isAssetSummary = msg.type === 'asset_summary';

                if (isSystem) {
                    html +=
                        `<div class="flex justify-center"><div class="system-message">${msg.content}</div></div>`;
                    return;
                }

                const timeStr = msg.timestamp.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                const contentHtml = (msg.content || '').replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
                    .replace(/\n/g, '<br>');

                if (isReport) {
                    html += `
                        <div class="msg-wrapper">
                            <div class="msg-row-ai">
                                <div class="msg-avatar">AI</div>
                                <div class="msg-bubble" style="max-width:96%;">
                                    ${msg.content}
                                </div>
                            </div>
                            <div class="msg-time ai-time">${timeStr}</div>
                        </div>
                    `;
                    return;
                }

                let typeLabel = '';
                let typeColor = '';
                if (isTransaction) { typeLabel = '交易预览 · 待确认';
                    typeColor = 'text-emerald-400'; } else if (isAlert) { typeLabel = '风险提醒';
                    typeColor = 'text-amber-400'; } else if (isAssetSummary) { typeLabel = '持仓分析';
                    typeColor = 'text-blue-400'; }

                if (isUser) {
                    html += `
                        <div class="msg-wrapper">
                            <div class="msg-row-user">
                                <div class="msg-avatar user">我</div>
                                <div class="msg-bubble" style="background:#3b82f6;color:#fff;border-top-right-radius:4px;max-width:82%;">${contentHtml}</div>
                            </div>
                            <div class="msg-time user-time">${timeStr}</div>
                        </div>
                    `;
                    return;
                }

                html += `
                    <div class="msg-wrapper">
                        <div class="msg-row-ai">
                            <div class="msg-avatar">AI</div>
                            <div class="msg-bubble" style="max-width:96%;">
                                ${typeLabel ? `<div class="text-xs ${typeColor} mb-1">${typeLabel}</div>` : ''}
                                <div class="text-[#d0d0e0] text-sm leading-relaxed">${contentHtml}</div>
                                ${isTransaction ? `
                                    <div class="flex gap-2 mt-2.5">
                                        <button class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg active:bg-emerald-500/30 transition-colors tap-active" onclick="alert('交易已模拟执行（演示版）')">确认执行</button>
                                        <button class="text-xs bg-[#1a1a2a] text-[#6a6a7a] px-3 py-1.5 rounded-lg active:bg-[#2a2a3a] transition-colors tap-active" onclick="alert('修改参数功能（演示版）')">修改参数</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        <div class="msg-time ai-time">${timeStr}</div>
                    </div>
                `;
            });

            if (isProcessing) {
                html += `
                    <div class="msg-wrapper">
                        <div class="msg-row-ai">
                            <div class="msg-avatar">AI</div>
                            <div class="msg-bubble" style="max-width:96%;">
                                <div class="typing-cursor text-[#4a4a5a] text-sm">思考中</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.insertAdjacentHTML('beforeend', html);
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        //  UI 控制
        // ============================================================
        function updateSendButton() {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('sendBtn');
            const hasText = input.value.trim() !== '';
            if (hasText && !isProcessing && !isVoiceMode) {
                btn.disabled = false;
                btn.className = 'p-2 rounded-xl transition-all flex-shrink-0 bg-blue-500 text-white active:bg-blue-600 tap-active';
                btn.innerHTML =
                    `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/></svg>`;
            } else {
                btn.disabled = true;
                btn.className = 'p-2 rounded-xl transition-all flex-shrink-0 bg-[#1a1a2a] text-[#4a4a5a] cursor-not-allowed';
                btn.innerHTML =
                    `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/></svg>`;
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const voiceBtn = document.getElementById('voiceBtn');

            voiceBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleVoiceMode();
            });

            input.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 66) + 'px';
                updateSendButton();
            });

            sendBtn.addEventListener('click', function() {
                if (isVoiceMode) {
                    return;
                }
                const text = input.value.trim();
                if (text && !isProcessing) {
                    sendMessage(text);
                    input.value = '';
                    input.style.height = 'auto';
                    updateSendButton();
                }
            });

            input.addEventListener('keydown', function(e) {
                if (isVoiceMode) return;
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendBtn.click();
                }
            });

            renderAssetOverview();
            renderQuickActions();
            renderMessages();
            updateSendButton();

            window.sendMessage = sendMessage;
            window.toggleDrawer = toggleDrawer;
            window.closeDrawer = closeDrawer;
            window.toggleVoiceMode = toggleVoiceMode;
            window.playVoiceMessage = playVoiceMessage;
            window.openShare = openShare;
            window.closeShare = closeShare;
            window.shareTo = shareTo;
            window.openSettings = openSettings;
            window.closeSettings = closeSettings;
            window.saveApiConfig = saveApiConfig;
            window.openFullDashboard = openFullDashboard;
            window.addRebate = addRebate;
            window.settleRebate = settleRebate;
            window.resetRebate = resetRebate;
            window.openTokenModal = openTokenModal;
            window.closeTokenModal = closeTokenModal;
            window.filterTokenList = filterTokenList;
            window.toggleTokenSelection = toggleTokenSelection;
            window.saveTokenSelection = saveTokenSelection;
            window.handleContractKeydown = handleContractKeydown;
            window.addTokenFromContract = addTokenFromContract;

            document.getElementById('overlay').addEventListener('click', closeDrawer);
            document.getElementById('tokenModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeTokenModal();
                }
            });
        });
    </script>
